            const hasData = Object.keys(progressAllEntries).length > 0;

            const toggles = (chartId) => ['month','year'].map(v =>
                `<button data-progress-chart="${chartId}" data-progress-view="${v}" onclick="setProgressView('${chartId}','${v}')" style="padding:5px 14px;border-radius:20px;border:none;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.2s;background:${progressViews[chartId]===v?ACCENT:'#1A1A1A'};color:${progressViews[chartId]===v?'#fff':'rgba(255,255,255,0.56)'};">${v==='month'?'Month':'Year'}</button>`
            ).join('');

            const chartCard = (id, title, chartId) => `
                <div class="chart-card">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                        <div class="chart-title" style="margin-bottom:0;">${title}</div>
                        <div style="display:flex;gap:6px;">${toggles(chartId)}</div>
                    </div>
                    <canvas id="${id}" height="120"></canvas>
                </div>`;

            return `
                <div>
                    <h2 class="page-title">Analytics</h2>
                    <p class="page-subtitle">Track your growth over time</p>
                    ${!hasData ? `<div style="text-align:center;padding:60px 20px;color:rgba(255,255,255,0.45);font-weight:400;">
                        <div style="font-size:40px;margin-bottom:12px;">📊</div>
                        <div style="font-size:16px;font-weight:700;color:rgba(255,255,255,0.65);">No data yet</div>
                        <div style="font-size:13px;margin-top:6px;">Log your numbers each week to see your trends here</div>
                        <button onclick="setPage('numbers')" style="margin-top:20px;background:${ACCENT};color:#000;border:none;padding:12px 24px;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px;">Log This Week →</button>
                    </div>` : `
                    ${chartCard('chartRevenue','💰 Revenue (£)','revenue')}
                    ${chartCard('chartRates','📈 Occupancy vs Rebook Rate (%)','rates')}
                    ${chartCard('chartViews','👥 Total Views','views')}
                    ${chartCard('chartFollowers','➕ New Followers','followers')}
                    `}
                </div>
            `;
        };

        const renderProgressCharts = () => {
            ['revenue','rates','views','followers'].forEach(chartId => {
                drawChart(chartId, progressViews[chartId] || 'month');
            });
        };

        // ── BUSINESS REPORT ──
        // All-time / this-month / this-week summary + month-by-month animated
        // bar chart. Same animation style as the waitlist landing page.
        const brMonthKey = (d) => d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0');
        const brMonthLabel = (key) => {
            const [y, m] = key.split('-');
            return new Date(Date.UTC(+y, +m - 1, 1)).toLocaleString('en-GB', { month: 'short' }).toUpperCase();
        };
        const brMonthLabelFull = (key) => {
            const [y, m] = key.split('-');
            return new Date(Date.UTC(+y, +m - 1, 1)).toLocaleString('en-GB', { month: 'short', year: '2-digit' }).toUpperCase();
        };
        const brFmtMoney = (v) => currencySymbol() + Math.round(v || 0).toLocaleString(getCurrency().locale);

        const renderClientBusinessReport = async () => {
            const [snap] = await Promise.all([
                db.ref(`portal/entries/${currentUser.uid}`).once('value'),
                loadLeaveDates(),
            ]);
            const all = snap.val() || {};
            const weekKeys = Object.keys(all).filter(k => /^\d{4}_W\d{1,2}$/.test(k));

            if (weekKeys.length === 0) {
                return `
                    <div>
                        <h2 class="page-title">Business Report</h2>
                        <p class="page-subtitle">Your revenue hub — all-time, month, week.</p>
                        <div class="br-empty">
                            <div class="br-empty-title">No data logged yet</div>
                            <div style="font-size:13px;">Log your numbers and your report will populate here automatically.</div>
                            <button onclick="setPage('numbers')" style="margin-top:20px;background:${ACCENT};color:#000;border:none;padding:12px 24px;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit;">Log Numbers &#x2192;</button>
                        </div>
                    </div>`;
            }

            const now = new Date();
            const thisMonthKey = brMonthKey(new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1)));
            const thisWeekKey = getWeekKey();

            const monthRevenue = {};
            const monthTotals = {};
            const weekTotalsByKey = {};
            let earliestMonthKey = thisMonthKey;

            weekKeys.forEach(wk => {
                const t = getWeeklyTotals(all[wk], wk);
                weekTotalsByKey[wk] = t;
                const monday = getMondayOfWeek(wk);
                const mKey = brMonthKey(new Date(Date.UTC(monday.getFullYear(), monday.getMonth(), 1)));
                monthRevenue[mKey] = (monthRevenue[mKey] || 0) + (t.revenue || 0);
                if (!monthTotals[mKey]) monthTotals[mKey] = { revenue:0, newClients:0, rebookings:0, noShows:0, appointmentsFilled:0, appointmentsAvailable:0, businessExpenses:0, personalExpenses:0 };
                ['revenue','newClients','rebookings','noShows','appointmentsFilled','appointmentsAvailable','businessExpenses','personalExpenses'].forEach(k => {
                    monthTotals[mKey][k] += (t[k] || 0);
                });
                if (mKey < earliestMonthKey) earliestMonthKey = mKey;
            });

            const buildMonthRange = (startKey, endKey) => {
                const [sy, sm] = startKey.split('-').map(Number);
                const [ey, em] = endKey.split('-').map(Number);
                const keys = [];
                let y = sy, m = sm;
                while (y < ey || (y === ey && m <= em)) {
                    keys.push(y + '-' + String(m).padStart(2, '0'));
                    m++; if (m > 12) { m = 1; y++; }
                }
                return keys;
            };
            const months = buildMonthRange(earliestMonthKey, thisMonthKey);

            const emptyTot = { revenue:0, newClients:0, rebookings:0, noShows:0, appointmentsFilled:0, appointmentsAvailable:0, businessExpenses:0, personalExpenses:0 };
            const allTime = weekKeys.reduce((acc, wk) => {
                const t = weekTotalsByKey[wk];
                Object.keys(acc).forEach(k => acc[k] += (t[k] || 0));
                return acc;
            }, { ...emptyTot });
            const thisMonth = monthTotals[thisMonthKey] || { ...emptyTot };
            const thisWeek = weekTotalsByKey[thisWeekKey] || { ...emptyTot };

            const ringColor = (v) => v >= 75 ? '#4ADE80' : v >= 50 ? '#FBBF24' : '#FF4533';
            const periodCard = (label, tot, isCurrent) => {
                const avail = Math.round(tot.appointmentsAvailable);
                const filled = Math.round(tot.appointmentsFilled);
                const missed = Math.max(0, avail - filled);
                const pct = avail > 0 ? Math.min(100, Math.round((filled / avail) * 100)) : 0;
                const profit = tot.revenue - (tot.businessExpenses + tot.personalExpenses);
                const margin = tot.revenue > 0 ? (profit / tot.revenue * 100) : 0;
                const occupancyPct = avail > 0 ? (filled / avail * 100) : 0;
                const rebookPct = filled > 0 ? (Math.round(tot.rebookings) / filled * 100) : 0;
                return `
                <div class="br-period ${isCurrent ? 'current' : ''}">
                    <div class="br-period-head">
                        <div class="br-period-label">${label}</div>
                        <div>
                            <span class="br-period-hero">${brFmtMoney(tot.revenue)}</span>
                            <span class="br-period-hero-sub">revenue</span>
                        </div>
                    </div>
                    <div class="br-capacity">
                        <div class="br-capacity-row">
                            <span><strong>${filled.toLocaleString('en-GB')}</strong> of <strong>${avail.toLocaleString('en-GB')}</strong> appointments filled${avail > 0 ? ` · <span class="br-capacity-missed">${missed.toLocaleString('en-GB')} empty chair${missed === 1 ? '' : 's'}</span>` : ''}</span>
                            <span><strong>${avail > 0 ? pct + '%' : '—'}</strong> capacity</span>
                        </div>
                        <div class="br-capacity-bar"><div class="br-capacity-fill" style="width:${pct}%;"></div></div>
                    </div>
                    <div class="br-period-row">
                        <span><strong>${Math.round(tot.newClients).toLocaleString('en-GB')}</strong> new clients</span>
                        <span><strong>${Math.round(tot.rebookings).toLocaleString('en-GB')}</strong> rebookings</span>
                        <span><strong>${Math.round(tot.noShows).toLocaleString('en-GB')}</strong> no-shows</span>
                        <span><strong>${brFmtMoney(profit)}</strong> profit</span>
                    </div>
                    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.08);">
                        <div style="background:rgba(255,255,255,0.03);border-radius:10px;padding:12px;text-align:center;">
                            <div style="font-size:10px;color:rgba(255,255,255,0.45);text-transform:uppercase;letter-spacing:0.08em;font-weight:700;margin-bottom:4px;">Profit Margin</div>
                            <div style="font-size:20px;font-weight:800;color:${ringColor(margin)};">${margin.toFixed(1)}%</div>
                            <div style="font-size:10px;color:rgba(255,255,255,0.45);margin-top:2px;">${brFmtMoney(profit)} / ${brFmtMoney(tot.revenue)}</div>
                        </div>
                        <div style="background:rgba(255,255,255,0.03);border-radius:10px;padding:12px;text-align:center;">
                            <div style="font-size:10px;color:rgba(255,255,255,0.45);text-transform:uppercase;letter-spacing:0.08em;font-weight:700;margin-bottom:4px;">Occupancy Rate</div>
                            <div style="font-size:20px;font-weight:800;color:${ringColor(occupancyPct)};">${occupancyPct.toFixed(1)}%</div>
                            <div style="font-size:10px;color:rgba(255,255,255,0.45);margin-top:2px;">${filled.toLocaleString('en-GB')} / ${avail.toLocaleString('en-GB')} appts</div>
                        </div>
                        <div style="background:rgba(255,255,255,0.03);border-radius:10px;padding:12px;text-align:center;">
                            <div style="font-size:10px;color:rgba(255,255,255,0.45);text-transform:uppercase;letter-spacing:0.08em;font-weight:700;margin-bottom:4px;">Rebook Rate</div>
                            <div style="font-size:20px;font-weight:800;color:${ringColor(rebookPct)};">${rebookPct.toFixed(1)}%</div>
                            <div style="font-size:10px;color:rgba(255,255,255,0.45);margin-top:2px;">${Math.round(tot.rebookings).toLocaleString('en-GB')} / ${filled.toLocaleString('en-GB')} rebooked</div>
                        </div>
                    </div>
                </div>`;
            };

            const maxVal = Math.max(1, ...months.map(k => monthRevenue[k] || 0));
            const bars = months.map(k => {
                const v = monthRevenue[k] || 0;
                const h = (v / maxVal) * 100;
                const isCurrent = k === thisMonthKey;
                return `<div class="br-bar ${isCurrent ? 'current' : ''}" data-value="${v}" data-target-height="${h}">
                    <div class="br-bar-value">${currencySymbol()}0</div>
                    <div class="br-bar-fill"></div>
                    <div class="br-bar-label">${months.length > 18 ? brMonthLabelFull(k) : brMonthLabel(k)}</div>
                </div>`;
            }).join('');

            const csvRows = [['Month', 'Revenue', 'New Clients', 'Rebookings', 'No Shows', 'Appts Filled', 'Appts Available', 'Business Expenses', 'Personal Expenses']];
            months.forEach(k => {
                const t = monthTotals[k] || emptyTot;
                csvRows.push([k, t.revenue, t.newClients, t.rebookings, t.noShows, t.appointmentsFilled, t.appointmentsAvailable, t.businessExpenses, t.personalExpenses]);
            });
            window._brCsvPayload = csvRows;

            return `
                <div>
                    <h2 class="page-title">Business Report</h2>
                    <p class="page-subtitle">Your revenue hub — backdated from your first entry to today.</p>

                    <div class="br-period-grid">
                        ${periodCard('All-Time', allTime, false)}
                        ${periodCard('This Month', thisMonth, true)}
                        ${periodCard('This Week', thisWeek, true)}
                    </div>

                    <div class="br-chart-card">
                        <div class="br-chart-head">
                            <div>
                                <div class="br-chart-title">Month by Month</div>
                                <div class="br-chart-sub">Revenue per month since you started logging</div>
                            </div>
                            <button class="br-export-btn" onclick="exportBusinessReportCsv()">&#x2193; Export CSV</button>
                        </div>
                        <div class="br-chart" id="brChart" style="--br-cols:${months.length};">
                            ${bars}
                        </div>
                    </div>
                </div>
            `;
        };

        window.animateBusinessReportChart = () => {
            const chart = document.getElementById('brChart');
            if (!chart) return;
            const bars = chart.querySelectorAll('.br-bar');
            if (!bars.length) return;
            const countUp = (el, target, durationMs) => {
                const start = performance.now();
                const tick = () => {
                    const t = Math.min(1, (performance.now() - start) / durationMs);
                    const eased = 1 - Math.pow(1 - t, 3);
                    el.textContent = currencySymbol() + Math.round(target * eased).toLocaleString(getCurrency().locale);
                    if (t < 1) requestAnimationFrame(tick);
                };
                requestAnimationFrame(tick);
            };
            const play = () => {
                const stagger = Math.max(80, Math.min(500, 4500 / Math.max(1, bars.length)));
                bars.forEach((bar, i) => {
                    setTimeout(() => {
                        const h = parseFloat(bar.getAttribute('data-target-height')) || 0;
                        const target = parseFloat(bar.getAttribute('data-value')) || 0;
                        bar.querySelector('.br-bar-fill').style.height = h + '%';
                        bar.classList.add('in-view');
                        countUp(bar.querySelector('.br-bar-value'), target, 1100);
                    }, i * stagger);
                });
            };
            if (!('IntersectionObserver' in window)) { play(); return; }
            let played = false;
            const io = new IntersectionObserver((entries) => {
                entries.forEach((e) => {
                    if (e.isIntersecting && !played) { played = true; play(); io.disconnect(); }
                });
            }, { threshold: 0.2 });
            io.observe(chart);
        };

        window.exportBusinessReportCsv = () => {
            const rows = window._brCsvPayload || [];
            if (!rows.length) return;
            const csv = rows.map(r => r.map(v => {
                const s = String(v == null ? '' : v);
                return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
            }).join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'scalo-business-report-' + new Date().toISOString().slice(0,10) + '.csv';
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        };

        // ── CONTENT LIBRARY ──
        const platformBadgeHtml = (platform) => {
            const cls = {Instagram:'platform-instagram',TikTok:'platform-tiktok',YouTube:'platform-youtube'}[platform]||'';
            return `<span class="platform-badge ${cls}">${platform||'Other'}</span>`;
        };

        const renderClientContent = async (uid = null) => {
            const targetUid = uid || currentUser.uid;
            const rankClass = (i) => i===0?'rank-gold':i===1?'rank-silver':i===2?'rank-bronze':'';
            let contentList = [];
            let instagramHandle = null;
            let lastScraped = null;
            try {
                // Get instagram handle from social_profiles or legacy instagramHandle
                const [profileSnap, igSnap, contentSnap] = await Promise.all([
                    db.ref(`portal/social_profiles/${targetUid}`).once('value'),
                    db.ref(`portal/users/${targetUid}/instagramHandle`).once('value'),
                    db.ref(`portal/content_library/${targetUid}`).once('value')
                ]);
                const profile = profileSnap.val();
                instagramHandle = igSnap.val();
                if (!instagramHandle && profile?.instagramUrl) {
                    instagramHandle = profile.instagramUrl.replace(/https?:\/\/(www\.)?instagram\.com\//i,'').replace(/[?#].*$/,'').replace(/\//g,'');
                }
                const contentData = contentSnap.val();
                if (contentData) {
                    contentList = Object.values(contentData).map((v) => ({
                        id: v.videoUrl || '',
                        title: v.caption ? v.caption.slice(0, 80) + (v.caption.length > 80 ? '...' : '') : 'Instagram Reel',
                        platform: 'Instagram',
                        views: v.views || v.plays || 0,
                        likes: v.likes || 0,
                        comments: v.comments || 0,
                        link: v.videoUrl || '',
                        datePosted: v.postedAt || null,
                        thumbnail: v.thumbnailUrl || '',
                        scraped_at: v.scrapedAt || null
                    }));
                    contentList.sort((a, b) => (b.views || 0) - (a.views || 0));
                    lastScraped = contentList[0]?.scraped_at;
                }
            } catch(e) { console.warn('Content load error', e); }
            const scraped = lastScraped ? new Date(lastScraped).toLocaleDateString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : null;
            return `
                <div>
                    <h2 class="page-title">Content Library</h2>
                    <p class="page-subtitle">Top 20 best performing reels &#x2014; click Refresh to update your list</p>
                    ${instagramHandle ? `
                    <div style="display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.04);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:14px 18px;box-shadow:0 4px 24px rgba(0,0,0,0.12),inset 0 1px 0 rgba(255,255,255,0.06);margin-bottom:20px;">
                        <div style="width:36px;height:36px;background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg></div>
                        <div style="flex:1;">
                            <div style="font-size:14px;font-weight:700;color:#fff;">@${instagramHandle}</div>
                            <div style="font-size:11px;color:rgba(255,255,255,0.45);font-weight:400;margin-top:2px;">${scraped ? `Last scraped: ${scraped}` : 'First scrape pending &#x2014; check back tomorrow'}</div>
                        </div>
                        <button onclick="handleRefreshContent()" id="refreshContentBtn" style="background:#1A1A1A;color:rgba(255,255,255,0.65);border:1px solid rgba(255,255,255,0.12);padding:6px 14px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;margin-right:8px;">${IC.refresh} Refresh</button>
                        <a href="https://instagram.com/${instagramHandle}" target="_blank" rel="noopener" style="color:${ACCENT};font-size:12px;font-weight:700;text-decoration:none;">View Profile &#x2192;</a>
                    </div>` : `
                    <div style="background:rgba(255,255,255,0.04);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:20px;box-shadow:0 4px 24px rgba(0,0,0,0.12),inset 0 1px 0 rgba(255,255,255,0.06);margin-bottom:20px;">
                        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
                            <div style="width:36px;height:36px;background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg></div>
                            <div>
                                <div style="font-size:14px;font-weight:700;color:#fff;">Connect Your Instagram</div>
                                <div style="font-size:12px;color:rgba(255,255,255,0.45);font-weight:400;">Paste your Instagram profile link to start tracking your content</div>
                            </div>
                        </div>
                        <div style="display:flex;gap:10px;">
                            <input type="text" id="igHandleInput" class="form-input" placeholder="https://instagram.com/yourusername" style="flex:1;margin-bottom:0;">
                            <button id="saveIgHandleBtn" style="background:${ACCENT};color:#000;border:none;padding:10px 20px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap;">Connect</button>
                        </div>
                    </div>`}
                    ${contentList.length === 0 ? `
                    <div class="empty-state">
                        <div class="empty-state-icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#CCC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg></div>
                        <p style="margin-bottom:6px;font-size:15px;">No videos scraped yet</p>
                        <p style="font-size:13px;font-weight:400;color:rgba(255,255,255,0.45);">Your top 20 Instagram reels will appear here automatically after the first daily scrape</p>
                    </div>` : ''}
                    ${contentList.map((item, index) => `
                        <div class="content-card" style="flex-direction:column;align-items:stretch;">
                            <div style="display:flex;align-items:center;gap:14px;">
                                ${item.thumbnail ? `<img src="${item.thumbnail}" style="width:54px;height:54px;object-fit:cover;border-radius:8px;flex-shrink:0;" onerror="this.style.display='none'">` : ''}
                                <div class="content-rank ${rankClass(index)}">#${index+1}</div>
                                <div class="content-body">
                                    <div class="content-title">${item.title}</div>
                                    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px;">
                                        ${platformBadgeHtml(item.platform)}
                                        ${item.datePosted ? `<span style="color:rgba(255,255,255,0.45);font-size:11px;font-weight:400;">${item.datePosted}</span>` : ''}
                                        ${item.link ? `<a href="${item.link}" target="_blank" rel="noopener" style="color:${ACCENT};font-size:11px;font-weight:700;text-decoration:none;">View &#x2192;</a>` : ''}
                                    </div>
                                    <div class="content-metrics">
                                        ${item.likes ? `<span class="content-metric">${IC.heart} <strong>${formatNumber(item.likes)}</strong> likes</span>` : ''}
                                        ${item.comments ? `<span class="content-metric">${IC.chat} <strong>${formatNumber(item.comments)}</strong> comments</span>` : ''}
                                    </div>
                                </div>
                                <div class="content-views">
                                    <div class="content-views-number">${formatNumber(item.views)}</div>
                                    <div class="content-views-label">views</div>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        };

        const handleSaveIgHandle = async () => {
            const input = document.getElementById('igHandleInput');
            if (!input) return;
            let val = input.value.trim();
            // Extract handle from URL or plain text
            val = val.replace(/\/$/, '').replace(/\?.*$/, '');
            if (val.includes('instagram.com/')) val = val.split('instagram.com/').pop();
            val = val.replace(/^@/, '');
            if (!val) { toast.error('Please enter your Instagram username or profile link'); return; }
            try {
                await db.ref(`portal/users/${currentUser.uid}/instagramHandle`).set(val);
                setPage('content');

                                            ${c.daysRemaining !== null && c.daysRemaining <= 30 ? `<a href="mailto:${c.email}?subject=${renewalSubject}&body=${renewalBody(c.name.split(' ')[0])}" style="background:rgba(255,69,51,0.15);color:#FF4533;border:none;padding:6px 10px;border-radius:6px;font-weight:700;font-size:11px;cursor:pointer;font-family:inherit;text-decoration:none;">${IC.mail} Renewal</a>` : ''}
                                        </td>

                        '<input type="file" accept="image/*" onchange="handleAvatarUpload(event)" style="display:none;">' +

        window.closeAvatarModal = (e) => {
            if (e && e.target !== e.currentTarget) return;

        };

        window.handleAvatarUpload = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = async () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 128;
                    canvas.height = 128;
                    const ctx = canvas.getContext('2d');
                    const size = Math.min(img.width, img.height);
                    const sx = (img.width - size) / 2;
                    const sy = (img.height - size) / 2;
                    ctx.drawImage(img, sx, sy, size, size, 0, 0, 128, 128);
                    const base64 = canvas.toDataURL('image/jpeg', 0.8);
                    try {
                        await db.ref('portal/users/' + currentUser.uid + '/profilePicture').set(base64);
                        currentUser.profilePicture = base64;
                        closeAvatarModal();
                        render();
                    } catch (err) { toast.error('Error saving photo: ' + err.message); }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

                        type: 'line',

                                borderWidth: 2.5,

// Helper: convert week key like "2026_W13" to date range like "24 Mar - 30 Mar"
const weekKeyToDateRange = (key) => {
    try {
        const [yr, wPart] = key.split('_W');
        const weekNum = parseInt(wPart);
        const year = parseInt(yr);
        // ISO week date: Jan 4 is always in week 1
        const jan4 = new Date(year, 0, 4);
        const dayOfWeek = jan4.getDay() || 7; // Mon=1..Sun=7
        const mondayW1 = new Date(jan4);
        mondayW1.setDate(jan4.getDate() - dayOfWeek + 1);
        const monday = new Date(mondayW1);
        monday.setDate(mondayW1.getDate() + (weekNum - 1) * 7);
        const sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 6);
        const fmt = (d) => d.toLocaleDateString('en-GB', { day:'numeric', month:'short' });
        const monthLabel = monday.toLocaleDateString('en-GB', { month:'long', year:'numeric' });
        return { range: fmt(monday) + ' \u2013 ' + fmt(sunday), month: monthLabel };
    } catch(e) { return { range: key, month: '' }; }
};

        // ── MONEY: SAVINGS + INVESTMENTS ──

        // Any element with data-progress="<percent>" starts at 0% and animates to that width via CSS transition.
        // Triggered when the element enters the viewport, so it feels alive on scroll.
        window.animateProgressBars = () => {
            document.querySelectorAll('[data-progress]').forEach(el => {
                if (el.dataset.progressDone === '1') return;
                const target = parseFloat(el.dataset.progress) || 0;
                el.dataset.progressDone = '1';
                // Force initial 0% to be rendered before changing — ensures the CSS transition fires
                el.style.width = '0%';
                const trigger = () => {
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            el.style.width = target + '%';
                        });
                    });
                };
                // Use IntersectionObserver so off-screen bars animate when scrolled into view
                if ('IntersectionObserver' in window) {
                    const obs = new IntersectionObserver((entries) => {
                        entries.forEach(e => {
                            if (e.isIntersecting) {
                                obs.unobserve(el);
                                trigger();
                            }
                        });
                    }, { threshold: 0.3 });
                    obs.observe(el);
                    // Fallback: trigger anyway after 1.5s if observer never fires
                    setTimeout(() => { if (el.style.width === '0%') trigger(); }, 1500);

                const suffix = el.dataset.countupSuffix || '';

                const start = performance.now();

                const ease = (t) => 1 - Math.pow(1 - t, 3); // easeOutCubic
                const fmt = (n) => Math.round(n).toLocaleString('en-GB');
                const step = (now) => {
                    const elapsed = now - start;
                    const t = Math.min(1, elapsed / duration);
                    const v = startVal + (target - startVal) * ease(t);
                    el.textContent = prefix + fmt(v) + suffix;

        // Toggle the weekly/monthly button group + sync the unit label and hidden input

        // Live preview shared by setup wizard and add/edit modals
        window.updatePotPreview = (idPrefix) => {
            const target = parseFloat((document.getElementById(idPrefix + 'Target') || {}).value);
            const contribution = parseFloat((document.getElementById(idPrefix + 'Contribution') || {}).value);
            const unit = (document.getElementById(idPrefix + 'Unit') || {}).value || 'weekly';
            const previewEl = document.getElementById(idPrefix + 'PreviewText');
            if (!previewEl) return;
            if (isNaN(target) || target <= 0 || isNaN(contribution) || contribution <= 0) {
                previewEl.textContent = 'Enter a target and contribution to see the timeline';
                return;
            }
            const weekly = unit === 'monthly' ? contribution / WEEKS_PER_MONTH : contribution;
            const weeks = Math.ceil(target / weekly);
            const months = Math.round(weeks / WEEKS_PER_MONTH);
            const years = (weeks / 52).toFixed(1);
            const dateLabel = futureDateLabel(weeks);
            const timeLabel = weeks < 8 ? `${weeks} week${weeks === 1 ? '' : 's'}`
                : weeks < 78 ? `${months} month${months === 1 ? '' : 's'}`
                : `${years} years`;
            const cadence = unit === 'monthly' ? 'month' : 'week';
            previewEl.innerHTML = `Saving <strong>${formatMoney(contribution)}/${cadence}</strong>, you'll hit <strong>${formatMoney(target)}</strong> in <strong>${timeLabel}</strong> &mdash; ${dateLabel}`;
        };

        // ── CRITICAL NUMBERS ──
        // Aggregates revenue + hours worked across the user's logged entries to surface:
        //   1) Income per minute (revenue ÷ minutes worked) for a chosen period
        //   2) Daily average revenue for that same period
        //   3) A monthly trend line vs. a 7%/yr inflation baseline anchored to the user's first month
        const INFLATION_RATE = 0.07; // 7% annual
        let criticalPeriod = 'month'; // 'today' | 'week' | 'month' | 'all'

        // Convert a weekKey like "2026_W17" + day index (0=Mon..6=Sun) into a JS Date at local midnight
        const dateForWeekDay = (weekKey, dayIdx) => {
            const monday = getMondayOfWeek(weekKey);
            const d = new Date(monday);
            d.setDate(monday.getDate() + dayIdx);
            d.setHours(0, 0, 0, 0);
            return d;
        };

        // Flatten every logged day across all weeks into a sorted timeline of { date, revenue, hoursWorked }
        const buildDailyTimeline = (entries) => {
            const out = [];
            Object.entries(entries || {}).forEach(([weekKey, entry]) => {
                if (!entry || !weekKey.includes('_W')) return;
                if (entry.days) {
                    for (let i = 0; i < 7; i++) {
                        if (isDayLeave(weekKey, i)) continue; // skip annual leave
                        const day = entry.days[i];
                        if (!day) continue;
                        const revenue = parseFloat(day.revenue) || 0;
                        const hoursWorked = parseFloat(day.hoursWorked) || 0;
                        const hasAnyData = FIELD_KEYS.some(k => day[k] !== undefined && day[k] !== null && day[k] !== '');
                        if (!hasAnyData) continue;
                        out.push({ date: dateForWeekDay(weekKey, i), revenue, hoursWorked });
                    }
                } else {
                    // Old flat-week format: spread across the 7 days of that week, skipping leave days
                    const totals = getWeeklyTotals(entry, weekKey);
                    if (!(totals.revenue || totals.appointmentsFilled || totals.hoursWorked)) return;
                    const workingDays = 7 - getLeaveDayCount(weekKey);
                    if (workingDays === 0) return;
                    for (let i = 0; i < 7; i++) {
                        if (isDayLeave(weekKey, i)) continue;
                        out.push({
                            date: dateForWeekDay(weekKey, i),
                            revenue: totals.revenue / workingDays,
                            hoursWorked: totals.hoursWorked / workingDays,
                        });
                    }
                }
            });
            out.sort((a, b) => a.date - b.date);
            return out;
        };

        // Filter the timeline to entries inside the selected period (today/week/month/all)
        const filterTimelineByPeriod = (timeline, period) => {
            const now = new Date();
            now.setHours(0, 0, 0, 0);
            if (period === 'today') {
                return timeline.filter(d => d.date.getTime() === now.getTime());
            }
            if (period === 'week') {
                const dow = now.getDay() || 7; // Mon=1..Sun=7
                const monday = new Date(now);
                monday.setDate(now.getDate() - (dow - 1));
                return timeline.filter(d => d.date >= monday && d.date <= now);
            }
            if (period === 'month') {
                const first = new Date(now.getFullYear(), now.getMonth(), 1);
                return timeline.filter(d => d.date >= first && d.date <= now);
            }
            return timeline; // all time
        };

        // Compute the two card metrics for the selected period
        const computeCriticalMetrics = (timeline, period) => {
            const slice = filterTimelineByPeriod(timeline, period);
            const totalRevenue = slice.reduce((s, d) => s + d.revenue, 0);
            const totalHours = slice.reduce((s, d) => s + d.hoursWorked, 0);
            const dayCount = slice.length;
            const incomePerMinute = totalHours > 0 ? totalRevenue / (totalHours * 60) : null;
            const dailyAverage = dayCount > 0 ? totalRevenue / dayCount : null;
            return { incomePerMinute, dailyAverage, totalHours, dayCount, totalRevenue };
        };

        // Bucket the timeline into calendar months: returns sorted [{ key:'YYYY-MM', label:'Mar 26', dailyAvg }, ...]
        const buildMonthlyBuckets = (timeline) => {
            const buckets = {}; // 'YYYY-MM' → { revenue, days, year, month }
            timeline.forEach(d => {
                const y = d.date.getFullYear();
                const m = d.date.getMonth();
                const key = y + '-' + String(m + 1).padStart(2, '0');
                if (!buckets[key]) buckets[key] = { revenue: 0, days: 0, year: y, month: m };
                buckets[key].revenue += d.revenue;
                buckets[key].days += 1;
            });
            const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            return Object.keys(buckets).sort().map(key => {
                const b = buckets[key];
                return {
                    key,
                    label: MONTH_NAMES[b.month] + ' ' + String(b.year).slice(-2),
                    fullLabel: MONTH_NAMES[b.month] + ' ' + b.year,
                    dailyAvg: b.days > 0 ? b.revenue / b.days : 0,
                    days: b.days,
                };
            });
        };

        // Build the inflation-projection line: starting at month[0].dailyAvg, compounding 7%/yr
        const buildInflationLine = (monthlyBuckets) => {
            if (!monthlyBuckets.length) return [];
            const baseline = monthlyBuckets[0].dailyAvg;
            const monthlyMultiplier = Math.pow(1 + INFLATION_RATE, 1 / 12);
            return monthlyBuckets.map((_, i) => baseline * Math.pow(monthlyMultiplier, i));
        };

        // Re-render only the Critical Numbers tiles when the dropdown changes — avoids a full page reload
        window.setCriticalPeriod = (period) => {
            criticalPeriod = period;
            const timeline = window.__criticalTimeline || [];
            const m = computeCriticalMetrics(timeline, period);
            const sym = currencySymbol();
            const fmt = (n) => sym + (Math.round(n * 100) / 100).toLocaleString(getCurrency().locale, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
            const ipmStr = m.incomePerMinute === null ? '—' : fmt(m.incomePerMinute);

        // Build / re-build the Chart.js line graph for Critical Numbers

                            pointHoverBackgroundColor: accent,
                            pointHoverBorderColor: '#fff',
                            pointHoverBorderWidth: 2,
                        },
                        {
                            label: 'Inflation (7%/yr)',
                            data: inflation.map(v => Math.round(v * 100) / 100),
                            borderColor: 'rgba(255,255,255,0.35)',
                            borderWidth: 1.5,
                            borderDash: [5, 5],
                            tension: 0.4,
                            fill: false,
                            pointRadius: 3,
                            pointBackgroundColor: 'rgba(255,255,255,0.35)',
                            pointBorderColor: '#0f0f0f',
                            pointBorderWidth: 1.5,
                            pointHoverRadius: 5,
                            pointHoverBackgroundColor: 'rgba(255,255,255,0.7)',
                            pointHoverBorderColor: '#fff',
                            pointHoverBorderWidth: 1.5,
                        },
                    ],
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(15,15,15,0.98)',
                            borderColor: 'rgba(255,255,255,0.1)',
                            borderWidth: 1,
                            titleColor: '#fff',
                            titleFont: { size: 12, weight: '700' },
                            bodyColor: 'rgba(255,255,255,0.85)',

                            padding: 12,
                            cornerRadius: 10,
                            displayColors: true,

                            boxHeight: 10,

                                    const idx = items[0].dataIndex;

                                },

                                    const idx = items[0].dataIndex;
                                    const you = monthly[idx].dailyAvg;

        const renderClientCriticalNumbers = async () => {

            const sym = currencySymbol();
            const fmt = (n) => sym + (Math.round(n * 100) / 100).toLocaleString(getCurrency().locale, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
            const ipmStr = m.incomePerMinute === null ? '—' : fmt(m.incomePerMinute);

            const daSub = m.dailyAverage === null ? 'No revenue logged' : 'across ' + m.dayCount + ' day' + (m.dayCount === 1 ? '' : 's');
            const periodLabel = { today: 'today', week: 'this week', month: 'this month', all: 'all time' }[criticalPeriod];

            return `
                <div>

                    </div>

        const renderClientMoneyDashboard = (data) => {
            const savings = data.savings;
            const investments = data.investments;
            const activePots = getActivePots(savings);
            const pausedPots = getPausedPots(savings);
            const totalSaved = totalSavedAcrossPots(savings);
            const aggregateWeekly = totalWeeklyTargetActive(savings);
            const invested = totalInvested(investments);

            // Recent investments list (newest first, top 6)
            const invEntries = Object.entries(investments.entries || {})
                .map(([id, e]) => ({ id, ...e }))
                .sort((a, b) => (b.date || b.createdAt || '').localeCompare(a.date || a.createdAt || ''))
                .slice(0, 6);

            const formatWeeksShort = (w) => {

            const renderPotCard = (pot, paused) => {

                const pace = paceForPot(savings, pot);

                return `

                                </button>

                        </div>
                        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap;">
                            <span class="money-pace-pill ${pace.state}">${pace.label}</span>
                            <span style="font-size:11px;color:rgba(255,255,255,0.45);font-weight:600;">${paused ? 'Resume to keep adding' : (weeksLeft > 0 && isFinite(weeksLeft) ? formatWeeksShort(weeksLeft) + ' &middot; ' + projected : '')}</span>
                        </div>
                        <div class="money-progress-track">
                            <div class="money-progress-fill" data-progress="${pct}" style="width:0%;"></div>
                        </div>
                        <div class="money-progress-row">
                            <span><strong>${formatMoney(saved)}</strong> saved</span>
                            <span>${formatMoney(Math.max(0, target - saved))} to go</span>
                        </div>
                        ${streak > 0 ? `<div style="margin-top:10px;"><span class="money-streak-pill">🔥 ${streak} ${isMonthly ? 'month' : 'week'}${streak === 1 ? '' : 's'} in a row</span></div>` : ''}
                        ${!paused ? (logged
                            ? `<div style="margin-top:12px;padding:10px 12px;background:rgba(74,222,128,0.08);border:1px solid rgba(74,222,128,0.25);border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
                                <span style="font-size:12px;color:#4ADE80;font-weight:700;">&check; ${formatMoney(transfers[periodKey].amount)} logged for ${periodLabel}</span>
                                <button class="money-btn-ghost" style="font-size:11px;padding:4px 10px;" onclick="editPotTransfer('${pot.id}','${periodKey}')">Edit amount</button>
                            </div>`
                            : `<div class="pot-log-row">
                                <span style="font-size:13px;color:rgba(255,255,255,0.55);font-weight:600;">Log for ${periodLabel}:</span>
                                <span style="font-size:14px;font-weight:700;color:rgba(255,255,255,0.45);">${currencySymbol()}</span>
                                <input type="number" id="${inputId}" class="form-input pot-log-input" min="0" step="1" value="${Math.round(pot.contribution)}">
                                <button class="money-btn-primary" style="padding:8px 14px;font-size:12px;" onclick="logForPot('${pot.id}','${periodKey}')">Log it &check;</button>
                            </div>`) : ''}
                    </div>`;
            };

            const activePotsHtml = activePots.map(p => renderPotCard(p, false)).join('');
            const pausedPotsHtml = pausedPots.length > 0
                ? `<div style="margin-top:18px;">
                    <div style="font-size:11px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.45);margin-bottom:10px;">Paused (${pausedPots.length})</div>
                    ${pausedPots.map(p => renderPotCard(p, true)).join('')}
                </div>`
                : '';

            // Standalone investments ledger (separate from pots)
            const invGoal = (investments && investments.goal) || null;
            const invGoalAmount = invGoal ? (Number(invGoal.targetAmount) || 0) : 0;
            const invGoalPct = invGoalAmount > 0 ? Math.min(100, (invested / invGoalAmount) * 100) : 0;

            return `
                <div>
                    <h2 class="page-title">Investments</h2>
                    <p class="page-subtitle">Track every pot you're saving toward, plus the standalone investments you log along the way.</p>

                    <div class="money-hero">
                        <div class="money-hero-card">
                            <div class="money-hero-label">Total saved</div>
                            <div class="money-hero-value" data-countup="${Math.round(totalSaved)}" data-countup-prefix="${currencySymbol()}">${formatMoney(totalSaved)}</div>
                            <div class="money-hero-sub">Across ${activePots.length} active pot${activePots.length === 1 ? '' : 's'}${pausedPots.length > 0 ? ` &middot; ${pausedPots.length} paused` : ''}</div>
                        </div>
                        <div class="money-hero-card">
                            <div class="money-hero-label">Weekly rate</div>
                            <div class="money-hero-value">${aggregateWeekly > 0 ? formatMoney(aggregateWeekly) : '—'}</div>
                            <div class="money-hero-sub">${aggregateWeekly > 0 ? `Combined active target${activePots.some(p => p.contributionUnit === 'monthly') ? ' (monthly normalised)' : ''}` : 'Add a pot to set a rate'}</div>
                        </div>
                        <div class="money-hero-card">
                            <div class="money-hero-label">Total invested</div>
                            <div class="money-hero-value" data-countup="${Math.round(invested)}" data-countup-prefix="${currencySymbol()}">${formatMoney(invested)}</div>
                            <div class="money-hero-sub">${invEntries.length === 0 ? 'No entries yet' : Object.keys(investments.entries || {}).length + ' entries'}</div>
                        </div>
                    </div>

                    <!-- Pots -->
                    <div style="display:flex;align-items:center;justify-content:space-between;margin:18px 2px 12px;">
                        <div style="font-size:12px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.55);">Your pots</div>
                        <button class="money-btn-ghost" style="font-size:12px;padding:6px 12px;" onclick="openAddPotModal()">+ Add pot</button>
                    </div>
                    ${activePotsHtml || '<div class="money-empty">All pots are paused. Resume one or add a new one to start saving again.</div>'}
                    <div class="pot-add-card" onclick="openAddPotModal()">+ Add another pot</div>
                    ${pausedPotsHtml}

                    <!-- Standalone investments ledger -->
                    <div class="money-card" style="margin-top:24px;">
                        <div class="money-card-head">
                            <div>
                                <div class="money-card-title">Investments ledger</div>
                                <div class="money-card-sub">${invGoal && invGoalAmount > 0 ? `Target ${formatMoney(invGoalAmount)} by ${invGoal.targetDate ? new Date(invGoal.targetDate).toLocaleDateString('en-GB', { month: 'short', year: 'numeric' }) : '—'}` : 'One-off contributions. Stocks, crypto, business reinvestment.'}</div>
                            </div>
                            <button class="money-btn-primary" onclick="openAddInvestmentModal()">+ Add entry</button>
                        </div>
                        ${invGoal && invGoalAmount > 0 ? `
                        <div class="money-progress-track">
                            <div class="money-progress-fill" data-progress="${invGoalPct}" style="width:0%;"></div>
                        </div>
                        <div class="money-progress-row" style="margin-bottom:14px;">
                            <span><strong>${formatMoney(invested)}</strong> invested</span>
                            <span>${formatMoney(Math.max(0, invGoalAmount - invested))} to go</span>
                        </div>` : ''}
                        ${invEntries.length === 0
                            ? `<div class="money-empty">No investments logged yet. Click <strong>+ Add entry</strong> when you put money into stocks, crypto, or your business.</div>`
                            : invEntries.map(e => {
                                const cat = e.category && INV_CATEGORIES.includes(e.category) ? e.category : null;
                                const catLabel = cat ? INV_CATEGORY_LABELS[cat] : 'Other';
                                const dateStr = e.date ? new Date(e.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '';
                                const note = (e.note || '').replace(/</g, '&lt;') || '<span style="color:rgba(255,255,255,0.4);">No note</span>';
                                return `<div class="money-investment-row">
                                    <span class="money-investment-cat ${cat || ''}">${catLabel}</span>
                                    <div>
                                        <div class="money-investment-note">${note}</div>
                                        <div class="money-investment-date">${dateStr}</div>
                                    </div>
                                    <div class="money-investment-amount">${formatMoney(e.amount)}</div>
                                    <button class="money-btn-ghost" onclick="deleteInvestmentEntry('${e.id}')" title="Delete">&times;</button>
                                </div>`;
                            }).join('')}
                    </div>

                    <div class="money-cta-row" style="margin-top:12px;">
                        <button class="money-btn-secondary" onclick="setPage('numbers')">Log this week's numbers &rarr;</button>
                    </div>
                </div>
            `;
        };

        // ── POT CRUD HANDLERS ──

        // Read form fields rendered by renderPotFormFields and return a validated pot payload.
        const readPotFormFields = (idPrefix) => {
            const label = (document.getElementById(idPrefix + 'Label')?.value || '').trim();
            const target = parseFloat(document.getElementById(idPrefix + 'Target')?.value);
            const contribution = parseFloat(document.getElementById(idPrefix + 'Contribution')?.value);
            const unit = (document.getElementById(idPrefix + 'Unit')?.value) || 'weekly';
            if (!label) { toast.error('Give this pot a name'); return null; }
            if (isNaN(target) || target <= 0) { toast.error('Enter a target amount'); return null; }
            if (isNaN(contribution) || contribution <= 0) { toast.error('Enter how much you can put in each ' + (unit === 'monthly' ? 'month' : 'week')); return null; }
            return {
                label,
                target,
                contribution: Math.round(contribution * 100) / 100,
                contributionUnit: unit === 'monthly' ? 'monthly' : 'weekly',
            };
        };

        // First-time setup — creates the first pot and marks setupComplete
        window.saveFirstPot = async () => {
            const fields = readPotFormFields('moneySetup');
            if (!fields) return;
            const uid = currentUser.uid;
            try {
                const potId = db.ref('portal/savings/' + uid + '/pots').push().key;
                const nowIso = new Date().toISOString();
                await db.ref('portal/savings/' + uid + '/pots/' + potId).set({
                    ...fields,
                    status: 'active',
                    startDate: nowIso.slice(0, 10),
                    createdAt: nowIso,
                });
                await db.ref('portal/savings/' + uid + '/settings').update({
                    setupComplete: true,
                    updatedAt: nowIso,
                });
                toast.success('Pot created');
                setPage('money');
            } catch (err) {
                toast.error('Could not save: ' + err.message);
            }
        };

        // Open "Add another pot" modal
        window.openAddPotModal = () => {
            const container = document.getElementById('confirmModalContainer');
            if (!container) return;
            container.innerHTML = `
                <div class="confirm-modal-overlay" onclick="if(event.target===this) closePotModal()">
                    <div class="confirm-modal" style="max-width:520px;">
                        <div class="confirm-modal-title">Add a new pot</div>
                        <div class="confirm-modal-message">Each pot is one thing you're saving toward. You can pause or delete it later.</div>
                        ${renderPotFormFields({ idPrefix: 'addPot', defaultUnit: 'weekly' })}
                        <div class="confirm-modal-actions">
                            <button class="confirm-btn confirm-btn-cancel" onclick="closePotModal()">Cancel</button>
                            <button class="confirm-btn confirm-btn-confirm" onclick="saveNewPot()">Add pot</button>
                        </div>
                    </div>
                </div>
            `;
            setTimeout(() => {
                const a = document.getElementById('addPotLabel');
                if (a) a.focus();
                updatePotPreview('addPot');
            }, 50);
        };

        window.closePotModal = () => {
            const c = document.getElementById('confirmModalContainer');
            if (c) c.innerHTML = '';
        };

        window.saveNewPot = async () => {
            const fields = readPotFormFields('addPot');
            if (!fields) return;
            const uid = currentUser.uid;
            try {
                const potId = db.ref('portal/savings/' + uid + '/pots').push().key;
                const nowIso = new Date().toISOString();
                await db.ref('portal/savings/' + uid + '/pots/' + potId).set({
                    ...fields,
                    status: 'active',
                    startDate: nowIso.slice(0, 10),
                    createdAt: nowIso,
                });
                closePotModal();
                toast.success('Pot added');
                setPage('money');
            } catch (err) {
                toast.error('Could not save: ' + err.message);
            }
        };

        window.openEditPotModal = async (potId) => {
            const container = document.getElementById('confirmModalContainer');
            if (!container) return;
            const uid = currentUser.uid;
            const snap = await db.ref('portal/savings/' + uid + '/pots/' + potId).once('value');
            const pot = snap.val() || {};
            container.innerHTML = `
                <div class="confirm-modal-overlay" onclick="if(event.target===this) closePotModal()">
                    <div class="confirm-modal" style="max-width:520px;">
                        <div class="confirm-modal-title">Edit pot</div>
                        <div class="confirm-modal-message">Change the name, target, or how much you put in.</div>
                        ${renderPotFormFields({ idPrefix: 'editPot', defaults: pot })}
                        <div class="confirm-modal-actions">
                            <button class="confirm-btn confirm-btn-cancel" onclick="closePotModal()">Cancel</button>
                            <button class="confirm-btn confirm-btn-confirm" onclick="saveEditedPot('${potId}')">Save</button>
                        </div>
                    </div>
                </div>
            `;
            setTimeout(() => {
                const a = document.getElementById('editPotLabel');
                if (a) a.focus();
                updatePotPreview('editPot');
            }, 50);
        };

        window.saveEditedPot = async (potId) => {
            const fields = readPotFormFields('editPot');
            if (!fields) return;
            const uid = currentUser.uid;
            try {
                await db.ref('portal/savings/' + uid + '/pots/' + potId).update(fields);
                closePotModal();
                toast.success('Pot updated');
                setPage('money');
            } catch (err) {
                toast.error('Could not save: ' + err.message);
            }
        };

        window.togglePotPause = async (potId) => {
            const uid = currentUser.uid;
            try {
                const snap = await db.ref('portal/savings/' + uid + '/pots/' + potId + '/status').once('value');
                const next = snap.val() === 'paused' ? 'active' : 'paused';
                await db.ref('portal/savings/' + uid + '/pots/' + potId + '/status').set(next);
                toast.success(next === 'paused' ? 'Pot paused' : 'Pot resumed');
                setPage(currentPage);
            } catch (err) {
                toast.error('Could not update: ' + err.message);
            }
        };

        window.deletePot = async (potId) => {
            const uid = currentUser.uid;
            const snap = await db.ref('portal/savings/' + uid + '/pots/' + potId).once('value');
            const pot = snap.val() || {};
            const ok = await confirmAsync({
                title: 'Delete "' + (pot.label || 'this pot') + '"?',
                message: 'This removes the pot AND every transfer you\'ve logged to it. You can\'t undo this.',
                confirmLabel: 'Delete pot',
                danger: true,
            });
            if (!ok) return;
            try {
                const update = {};
                update['pots/' + potId] = null;
                update['transfers/' + potId] = null;
                await db.ref('portal/savings/' + uid).update(update);
                toast.success('Pot deleted');
                setPage(currentPage);
            } catch (err) {
                toast.error('Could not delete: ' + err.message);
            }
        };

        // Add investment modal
        window.openAddInvestmentModal = () => {
            const container = document.getElementById('confirmModalContainer');
            if (!container) return;
            const today = new Date().toISOString().slice(0, 10);
            container.innerHTML = `
                <div class="confirm-modal-overlay" onclick="if(event.target===this) closeAddInvestmentModal()">
                    <div class="confirm-modal" style="max-width:480px;">
                        <div class="confirm-modal-title">Log an investment</div>
                        <div class="confirm-modal-message">Quick record of money you put in. No fancy maths.</div>
                        <div style="margin-bottom:14px;">
                            <div class="form-label" style="margin-bottom:6px;">Amount</div>
                            <input type="number" id="invModalAmount" class="form-input" min="0" step="1" placeholder="100">
                        </div>
                        <div style="margin-bottom:14px;">
                            <div class="form-label" style="margin-bottom:6px;">Date</div>
                            <input type="date" id="invModalDate" class="form-input" value="${today}">
                        </div>
                        <div style="margin-bottom:14px;">
                            <div class="form-label" style="margin-bottom:6px;">Category &mdash; optional</div>
                            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                                ${INV_CATEGORIES.map(c => `<button type="button" class="money-btn-secondary inv-cat-btn" data-cat="${c}" onclick="selectInvCategory('${c}')" style="flex:1;min-width:90px;font-size:12px;padding:8px 10px;">${INV_CATEGORY_LABELS[c]}</button>`).join('')}
                            </div>
                            <input type="hidden" id="invModalCategory" value="">
                        </div>
                        <div style="margin-bottom:18px;">
                            <div class="form-label" style="margin-bottom:6px;">Note &mdash; optional</div>
                            <input type="text" id="invModalNote" class="form-input" placeholder="e.g. Vanguard S&P 500">
                        </div>
                        <div class="confirm-modal-actions">
                            <button class="confirm-btn confirm-btn-cancel" onclick="closeAddInvestmentModal()">Cancel</button>
                            <button class="confirm-btn confirm-btn-confirm" onclick="saveInvestmentEntry()">Add entry</button>
                        </div>
                    </div>
                </div>
            `;
            setTimeout(() => { const a = document.getElementById('invModalAmount'); if (a) a.focus(); }, 50);
        };

        window.closeAddInvestmentModal = () => {
            const c = document.getElementById('confirmModalContainer');
            if (c) c.innerHTML = '';
        };

        window.selectInvCategory = (cat) => {
            const hidden = document.getElementById('invModalCategory');
            if (hidden) hidden.value = cat;
            document.querySelectorAll('.inv-cat-btn').forEach(b => {
                if (b.dataset.cat === cat) {
                    b.style.background = 'var(--accent)';
                    b.style.color = '#000';
                    b.style.borderColor = 'var(--accent)';
                } else {
                    b.style.background = 'rgba(255,255,255,0.06)';
                    b.style.color = 'rgba(255,255,255,0.85)';
                    b.style.borderColor = 'rgba(255,255,255,0.1)';
                }
            });
        };

        window.saveInvestmentEntry = async () => {
            const amount = parseFloat(document.getElementById('invModalAmount').value);
            const date = document.getElementById('invModalDate').value;
            const category = document.getElementById('invModalCategory').value || null;
            const note = (document.getElementById('invModalNote').value || '').trim();
            if (isNaN(amount) || amount <= 0) { toast.error('Enter a valid amount'); return; }
            if (!date) { toast.error('Pick a date'); return; }
            const uid = currentUser.uid;
            try {
                const id = db.ref('portal/investments/' + uid + '/entries').push().key;
                await db.ref('portal/investments/' + uid + '/entries/' + id).set({
                    amount, date, category, note: note || null,
                    createdAt: new Date().toISOString(),
                });
                closeAddInvestmentModal();
                toast.success('Investment logged');
                setPage('money');
            } catch (err) {
                toast.error('Could not save: ' + err.message);
            }
        };

        window.deleteInvestmentEntry = async (id) => {
            const ok = await confirmAsync({ title: 'Delete this entry?', message: 'This investment record will be removed.', confirmLabel: 'Delete', danger: true });
            if (!ok) return;
            try {
                await db.ref('portal/investments/' + currentUser.uid + '/entries/' + id).remove();
                toast.success('Entry deleted');
                setPage('money');
            } catch (err) {
                toast.error('Could not delete: ' + err.message);
            }
        };

        // Log a transfer for a specific pot. Reads the amount from the pot's inline input
        // (id="potLogAmount_<potId>"), falling back to the pot's contribution amount.
        window.logForPot = async (potId, periodKey) => {
            const uid = currentUser.uid;
            try {
                const potSnap = await db.ref('portal/savings/' + uid + '/pots/' + potId).once('value');
                const pot = potSnap.val();
                if (!pot) { toast.error('Pot not found'); setPage('money'); return; }
                const periodK = periodKey || currentPeriodKey(pot);
                const inputEl = document.getElementById('potLogAmount_' + potId);
                let amount = inputEl ? parseFloat(inputEl.value) : Number(pot.contribution);
                if (isNaN(amount) || amount < 0) amount = Number(pot.contribution) || 0;
                amount = Math.round(amount * 100) / 100;
                await db.ref('portal/savings/' + uid + '/transfers/' + potId + '/' + periodK).set({
                    amount,
                    transferredAt: new Date().toISOString(),
                    source: 'manual',
                });
                toast.success('Logged ' + formatMoney(amount) + ' to ' + (pot.label || 'pot'));
                setPage(currentPage);
            } catch (err) {
                toast.error('Could not log: ' + err.message);
            }
        };

        // Edit/override a transfer amount for a specific pot + period
        window.editPotTransfer = async (potId, periodKey) => {
            const uid = currentUser.uid;
            const [potSnap, txSnap] = await Promise.all([
                db.ref('portal/savings/' + uid + '/pots/' + potId).once('value'),
                db.ref('portal/savings/' + uid + '/transfers/' + potId + '/' + periodKey).once('value'),
            ]);
            const pot = potSnap.val() || {};
            const existing = txSnap.val() || {};
            const sym = currencySymbol();
            const periodLabel = pot.contributionUnit === 'monthly' ? 'this month' : 'this week';
            const container = document.getElementById('confirmModalContainer');
            if (!container) return;
            container.innerHTML = `
                <div class="confirm-modal-overlay" onclick="if(event.target===this) document.getElementById('confirmModalContainer').innerHTML='';">
                    <div class="confirm-modal" style="max-width:420px;">
                        <div class="confirm-modal-title">Edit amount for ${periodLabel}</div>
                        <div class="confirm-modal-message">Different amount than planned? Enter what you actually transferred to <strong>${(pot.label || 'this pot').replace(/</g, '&lt;')}</strong>.</div>
                        <div style="margin-bottom:18px;">
                            <div class="form-label" style="margin-bottom:6px;">Amount transferred (${sym})</div>
                            <input type="number" id="editTransferAmount" class="form-input" min="0" step="1" value="${existing.amount || ''}">
                        </div>
                        <div class="confirm-modal-actions">
                            <button class="confirm-btn confirm-btn-cancel" onclick="document.getElementById('confirmModalContainer').innerHTML='';">Cancel</button>
                            <button class="confirm-btn confirm-btn-confirm" onclick="savePotTransferOverride('${potId}','${periodKey}')">Save</button>
                        </div>
                    </div>
                </div>
            `;
            setTimeout(() => { const a = document.getElementById('editTransferAmount'); if (a) { a.focus(); a.select(); } }, 50);
        };

        window.savePotTransferOverride = async (potId, periodKey) => {
            const amount = parseFloat(document.getElementById('editTransferAmount').value);
            if (isNaN(amount) || amount < 0) { toast.error('Enter a valid amount'); return; }
            const uid = currentUser.uid;
            try {
                await db.ref('portal/savings/' + uid + '/transfers/' + potId + '/' + periodKey).set({
                    amount: Math.round(amount * 100) / 100,
                    transferredAt: new Date().toISOString(),
                    source: 'manual-edit',
                });
                document.getElementById('confirmModalContainer').innerHTML = '';
                toast.success('Saved');
                setPage(currentPage);
            } catch (err) {
                toast.error('Could not save: ' + err.message);
            }
        };

        // ── SCALO INTELLIGENCE ──
        // Feature flag: flip to true when ready to ship the Intelligence tab to clients.
        // When false, the nav item is hidden and the /intelligence route is blocked.
        const SCALO_INTELLIGENCE_ENABLED = true;

        const SCALO_BOTS = [
            {
                id: 'story-coach',
                name: 'SCALO Story Coach',
                description: 'Turn your ideas into ready to film scripts using The Story Framework',
                label: 'Story to Status Module',
                requiresModuleLevel: 5,
                unlockCopy: 'Complete Level Five: Story to Status to unlock this bot.',
                icon: '<svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 8.4 C8.4 7.3, 5.4 7.1, 2.8 7.5 L2.8 15.2 C5.4 14.8, 8.4 15, 10 16 C11.6 15, 14.6 14.8, 17.2 15.2 L17.2 7.5 C14.6 7.1, 11.6 7.3, 10 8.4 Z"/><path d="M10 8.4 L10 16"/><path d="M5 4.1 L5.27 4.76 L5.9 4.9 L5.27 5.04 L5 5.7 L4.73 5.04 L4.1 4.9 L4.73 4.76 Z" fill="currentColor" stroke="none"/><path d="M10 1.8 L10.33 2.6 L11.15 2.9 L10.33 3.2 L10 4 L9.67 3.2 L8.85 2.9 L9.67 2.6 Z" fill="currentColor" stroke="none"/><path d="M14.5 3.4 L14.74 3.96 L15.3 4.1 L14.74 4.24 L14.5 4.8 L14.26 4.24 L13.7 4.1 L14.26 3.96 Z" fill="currentColor" stroke="none"/></svg>',
                systemPrompt: `You are SCALO Story Coach, an expert short-form video scriptwriter trained in The Story Framework used inside the SCALO Story to Status Module.\n\nYour job is to take any idea a creator gives you \u2014 a rough thought, a client win, a common objection, an observation, a lesson \u2014 and turn it into a ready-to-film short-form video script (Reels / TikTok / Shorts) that follows The Story Framework exactly.\n\n=== THE STORY FRAMEWORK ===\nEvery script you produce must contain these six beats in order:\n1. HOOK (0\u20133s) \u2014 a scroll-stopping first line that creates curiosity, tension, or identification. No intros, no \u201chey guys\u201d, no wind-up.\n2. CONTEXT (3\u20138s) \u2014 one line that frames who this is for and why it matters right now.\n3. CONFLICT \u2014 the real problem, struggle, or misbelief the viewer is stuck on.\n4. TURN \u2014 the shift, realisation, or reframe that changes how they see it.\n5. PROOF \u2014 a concrete example, story, result, or specific how-to so the viewer believes the turn.\n6. CTA / STATUS LINE \u2014 a single closing line that either invites action or positions the creator as the authority on this topic.\n\n=== OUTPUT FORMAT ===\nAlways return the script in this exact structure:\n\nTITLE: <5\u20138 word working title>\nDURATION: <estimated seconds, aim 25\u201360s>\n\n[HOOK]\n<spoken line>\n\n[CONTEXT]\n<spoken line>\n\n[CONFLICT]\n<spoken line(s)>\n\n[TURN]\n<spoken line(s)>\n\n[PROOF]\n<spoken line(s)>\n\n[CTA / STATUS LINE]\n<spoken line>\n\nB-ROLL / DELIVERY NOTES:\n- <3\u20135 bullet points on how to film it: camera angle, cuts, on-screen text, tone>\n\n=== RULES ===\n- Write the way the creator actually speaks \u2014 short sentences, plain words, zero corporate jargon.\n- No filler like \u201cin today\u2019s video\u201d or \u201clet\u2019s dive in\u201d. Cut straight to the hook.\n- Keep each beat lean. If a line doesn\u2019t earn its place, cut it.\n- If the creator\u2019s idea is vague, ask ONE sharp clarifying question before writing. Otherwise, write the script.\n- If they ask for variations, produce 3 alternate hooks labelled Hook A / B / C.\n- Always end by offering: \u201cWant me to tighten it, swap the hook, or build the next one?\u201d`,
                setupSteps: [
                    { title: 'Copy the system prompt', text: 'Hit the green button above &#x2014; it&rsquo;s copied to your clipboard.' },
                    { title: 'Open Claude and create a new Project', text: 'Go to claude.ai, click <strong>Projects</strong> in the sidebar, then <strong>Create Project</strong>.' },
                    { title: 'Paste into Custom Instructions', text: 'Open the project, click <strong>Set custom instructions</strong>, paste, and save. Start chatting to use the bot.' },

        ];

        // A bot is unlocked only when the linked roadmap module has items AND every item is ticked.
        // If the module is empty (not yet uploaded), it stays locked — matches the spec.
        const isBotUnlocked = (bot, completions) => {

            return mod.items.every(i => completions[i.id] === true);
        };

            window.__scaloBotLocks = locks;

            const lockIconSmall = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="7.5" width="9" height="6.5" rx="1.4"/><path d="M5.5 7.5V5.2a2.5 2.5 0 0 1 5 0V7.5"/></svg>';

            return `
                <div>
                    <h2 class="page-title">SCALO Intelligence</h2>

            // Store on window so copy button can read the exact prompt without HTML escaping issues
            window.__activeBotPrompt = bot.systemPrompt;
            const escaped = bot.systemPrompt
                .replace(/&/g, '&amp;')

            container.innerHTML = `

                            </div>

        window.closeBotModal = (e) => {
            if (e && e.target !== e.currentTarget) return;
            const container = document.getElementById('botModalContainer');
            if (container) container.innerHTML = '';
            window.__activeBotPrompt = null;
        };

        window.copyBotPrompt = async () => {
            const text = window.__activeBotPrompt || '';
            const btn = document.getElementById('botCopyBtn');
            const label = document.getElementById('botCopyBtnLabel');
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                } else {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.position = 'fixed';
                    ta.style.left = '-9999px';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                }
                if (btn) btn.classList.add('copied');
                if (label) label.textContent = 'Copied \u2713';
                setTimeout(() => {
                    if (btn) btn.classList.remove('copied');
