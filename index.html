                <div class="portal-sidebar">
                    <img src="${SCALO_LOGO}" alt="SCALO" class="sidebar-logo">
                    <div class="sidebar-profile" onclick="openAvatarModal()" title="Update your photo">
                        ${sidebarAvatarHtml}
                        <div class="sidebar-profile-text">
                            <div class="sidebar-profile-greeting">Welcome back</div>
                            <div class="sidebar-profile-name">${sidebarFullName}</div>
                        </div>
                    </div>
                    ${!isAdmin ? `
                    <div class="sidebar-currency" onclick="event.stopPropagation()">
                        <span class="sidebar-currency-label">Currency</span>
                        <select class="sidebar-currency-select" onchange="changeCurrency(this.value)" aria-label="Currency">
                            ${Object.entries(CURRENCIES).map(([code, c]) => `
                                <option value="${code}" ${userCurrency === code ? 'selected' : ''}>${c.flag} ${c.label}</option>
                            `).join('')}
                        </select>
                    </div>` : ''}
                    <div class="sidebar-nav">
                        ${navHtml}
                    </div>
                    <button class="sidebar-signout" onclick="signOut()">
                        <span class="sidebar-nav-icon">&#x2192;</span>
                        <span class="nav-label">Sign Out</span>
                    </button>
                </div>
            `;

            const pageTitles = { hub:'Overview', implementation:'The Roadmap', dailyfive:'The Daily Five', businessReport:'Business Report', numbers:'Log Your Numbers', money:'Investments', criticalNumbers:'Critical Numbers', pricecoach:'Price Coach', content:'Content Library', inspo:'Inspo Feed', social:'Social Profiles', progress:'Analytics', intelligence:'SCALO Intelligence', goals:'Your Goals', icp:'Your ICP', clients:'Your Clients', addClient:'Add New Client', crm:'Client CRM', clientDetail:'Client Detail' };

            let pageContent = '';
            try {
                if (isAdmin) {
                    if (currentPage === 'clients') pageContent = await renderAdminClients();
                    else if (currentPage === 'addClient') pageContent = await renderAdminAddClient();
                    else if (currentPage === 'crm') pageContent = await renderAdminCRM();
                    else if (currentPage === 'clientDetail' && selectedClientDetail) pageContent = await renderAdminClientDetail(selectedClientDetail);
                    else { currentPage = 'clients'; pageContent = await renderAdminClients(); }
                } else {
                    if (currentPage === 'hub') pageContent = await renderClientHub();
                    else if (currentPage === 'implementation') pageContent = await renderClientImplementation();
                    else if (currentPage === 'businessReport') pageContent = await renderClientBusinessReport();
                    else if (currentPage === 'numbers') pageContent = await renderClientNumbers();
                    else if (currentPage === 'money') pageContent = await renderClientMoney();
                    else if (currentPage === 'criticalNumbers') pageContent = await renderClientCriticalNumbers();
                    else if (currentPage === 'icp') pageContent = await renderClientICP();
                    else if (currentPage === 'goals') pageContent = await renderClientGoals();
                    else if (currentPage === 'dailyfive') pageContent = await renderClientDailyFive();
                    else if (currentPage === 'pricecoach') pageContent = await renderClientPriceCoach();
                    else if (currentPage === 'content') pageContent = await renderClientContent();
                    else if (currentPage === 'inspo') pageContent = await renderClientInspo();
                    else if (currentPage === 'social') pageContent = await renderClientSocial();
                    else if (currentPage === 'progress') pageContent = await renderClientProgress();
                    else if (currentPage === 'intelligence' && SCALO_INTELLIGENCE_ENABLED) pageContent = await renderClientIntelligence();
                    else if (currentPage === 'intelligence') { currentPage = 'hub'; pageContent = await renderClientHub(); }
                }
            } catch (err) {
                console.error('Render failed for page "' + currentPage + '":', err);
                const errMsg = (err && err.message) ? err.message : String(err);
                pageContent = '<div style="max-width:560px;margin:60px auto;padding:32px;background:rgba(255,69,51,0.06);border:1px solid rgba(255,69,51,0.25);border-radius:14px;text-align:center;">'
                    + '<div style="font-size:32px;margin-bottom:12px;">&#9888;</div>'
                    + '<div style="font-size:16px;font-weight:700;color:#fff;margin-bottom:8px;">Couldn’t load this page</div>'
                    + '<div style="font-size:13px;color:rgba(255,255,255,0.6);margin-bottom:18px;line-height:1.5;">Something went wrong loading <strong>' + (pageTitles[currentPage] || currentPage) + '</strong>. Try refreshing, or head back to the overview.</div>'
                    + '<div style="font-size:11px;color:rgba(255,255,255,0.35);font-family:monospace;background:rgba(0,0,0,0.3);padding:8px 12px;border-radius:8px;word-break:break-word;margin-bottom:18px;">' + errMsg.replace(/</g,'&lt;') + '</div>'
                    + '<button onclick="setPage(\'' + (isAdmin ? 'clients' : 'hub') + '\')" style="background:var(--accent);color:#000;border:none;padding:10px 22px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;">Back to ' + (isAdmin ? 'Clients' : 'Overview') + '</button>'
                    + '</div>';
            }

            const pageTitle = pageTitles[currentPage] || '';
            const topbarHtml = `
                <div class="portal-topbar">
                    <div class="portal-topbar-title">${pageTitle}</div>
                </div>
            `;

            root.innerHTML = `
                <div class="portal-layout">
                    ${sidebarHtml}
                    <div class="portal-content-area">
                        ${topbarHtml}
                        <div class="page-fade-in" key="${currentPage}-${Date.now()}">${pageContent}</div>
                    </div>
                </div>
                <div id="avatarModalContainer"></div>
                <div id="botModalContainer"></div>
            `;
            // Trigger count-up + progress-bar animations on freshly-rendered content
            setTimeout(() => { animateCountUps(); animateProgressBars(); }, 30);

            if (currentPage === 'progress' && !isAdmin) setTimeout(renderProgressCharts, 50);
            if (currentPage === 'hub' && !isAdmin) {
                document.body.classList.add('hub-active');
                setTimeout(() => { renderHubCharts(); initHubFocusMode(); }, 50);
            } else if (!isAdmin) {
                document.body.classList.remove('hub-active');
                // Tear down the hub dot rail / scroll listener when leaving the hub
                if (_hubFocusCleanup) { _hubFocusCleanup(); _hubFocusCleanup = null; }
                const stale = document.getElementById('hubDotRail');
                if (stale) stale.remove();
            }
            if (currentPage === 'social' && !isAdmin) setTimeout(renderSocialCharts, 50);
            if (currentPage === 'businessReport' && !isAdmin) setTimeout(animateBusinessReportChart, 60);
            if (currentPage === 'criticalNumbers' && !isAdmin) setTimeout(renderCriticalChart, 60);

            // Event listeners
            if (isAdmin) {
                if (currentPage === 'addClient') document.getElementById('createClientBtn').addEventListener('click', handleCreateClient);
            } else {
                if (currentPage === 'numbers') {
                    const weekPicker = document.getElementById('weekPicker');
                    if (weekPicker) weekPicker.addEventListener('change', (e) => { if (e.target.value) { selectedWeekKey = weekKeyFromInput(e.target.value); selectedDayIndex = null; setPage('numbers'); } });
                } else if (currentPage === 'content') {
                    const addBtn = document.getElementById('addContentBtn');
                    const modal = document.getElementById('addContentModal');
                    if (addBtn) addBtn.addEventListener('click', () => modal.classList.add('active'));
                    const cancelBtn = document.getElementById('cancelContentBtn');
                    if (cancelBtn) cancelBtn.addEventListener('click', () => modal.classList.remove('active'));
                    const saveBtn = document.getElementById('saveContentBtn');
                    if (saveBtn) saveBtn.addEventListener('click', handleAddContent);
                    const igBtn = document.getElementById('saveIgHandleBtn');
                    if (igBtn) igBtn.addEventListener('click', handleSaveIgHandle);
                    document.querySelectorAll('.content-delete-btn').forEach(btn => {
                        btn.addEventListener('click', () => handleDeleteContent(btn.dataset.id));
                    });
                }
            }
        };

        // ── DISMISS COACHING ALERT ──
        window.dismissAlert = (type) => {
            if (type === 'rebook') {
                sessionStorage.setItem('dismissedRebookAlert', '1');
                const el = document.getElementById('rebookAlertBanner');
                if (el) el.style.display = 'none';
            } else if (type === 'occupancy') {
                sessionStorage.setItem('dismissedOccupancyAlert', '1');
                const el = document.getElementById('occupancyAlertBanner');
                if (el) el.style.display = 'none';
            }
        };

        // ── SAVE GOALS ──
        window.saveGoals = async () => {
            if (!currentUser) return;
            const updates = {
                why: (document.getElementById('goalWhy')?.value || '').trim(),
                how: (document.getElementById('goalHow')?.value || '').trim(),
                goal90: (document.getElementById('goal90')?.value || '').trim(),
                goal6m: (document.getElementById('goal6m')?.value || '').trim(),
                updatedAt: new Date().toISOString()
            };
            try {
                await db.ref(`portal/goals/${currentUser.uid}`).update(updates);
                const msg = document.getElementById('goalsSavedMsg');
                if (msg) {
                    msg.textContent = 'Goals saved';
                    msg.style.opacity = '1';
                    setTimeout(() => { msg.style.opacity = '0'; }, 2500);
                }
            } catch (err) { toast.error('Error saving goals: ' + err.message); }
        };
        window.saveICP = async () => {
            if (!currentUser) return;
            const updates = {
                icpAge: (document.getElementById('icpAge')?.value || '').trim(),
                icpGender: (document.getElementById('icpGender')?.value || '').trim(),
                icpWants: (document.getElementById('icpWants')?.value || '').trim(),
                icpPains: (document.getElementById('icpPains')?.value || '').trim(),
                icpChannels: (document.getElementById('icpChannels')?.value || '').trim(),
                icpSpend: (document.getElementById('icpSpend')?.value || '').trim(),
                icpFrequency: (document.getElementById('icpFrequency')?.value || '').trim(),
                updatedAt: new Date().toISOString()
            };
            try {
                await db.ref(`portal/goals/${currentUser.uid}`).update(updates);
                const msg = document.getElementById('icpSavedMsg');
                if (msg) {
                    msg.textContent = 'ICP saved';
                    msg.style.opacity = '1';
                    setTimeout(() => { msg.style.opacity = '0'; setPage('icp'); }, 1500);
                }
            } catch (err) { toast.error('Error saving ICP: ' + err.message); }
        };

        // ── GLOBALS ──
        // Dark mode is the only supported theme. Clear any legacy preference so
        // returning users who had light mode saved drop back to dark.
        try { localStorage.removeItem('scalo-theme'); } catch(e) {}
        document.documentElement.classList.remove('light-mode');

        window.setPage = (page) => { currentPage = page; render(); };
        window.changeCurrency = async (code) => {
            if (!CURRENCIES[code]) return;
            userCurrency = code;
            if (currentUser && currentUser.uid) {
                try {
                    await db.ref('portal/users/' + currentUser.uid + '/currency').set(code);
                    currentUser.currency = code;
                    toast.success('Currency set to ' + CURRENCIES[code].label);
                } catch (e) {
                    toast.error('Could not save currency: ' + e.message);
                }
            }
            render();
        };

        window.toggleSidebarSection = (sectionId) => {
            // Read the current rendered state directly to avoid recomputing default logic here
            const el = document.querySelector('.sidebar-section[data-id="' + sectionId + '"]');
            // Fall back to the toggle map if we can't read the DOM
            const stored = sidebarSectionToggles[sectionId];
            if (typeof stored === 'boolean') {
                sidebarSectionToggles[sectionId] = !stored;
            } else {
                // No explicit state yet — flip from the default (auto-expanded if it has the active page)
                // We don't have access to the section structure here, so just store the OPPOSITE of "is currently visible"
                const items = document.querySelector('.sidebar-section[data-id="' + sectionId + '"] .sidebar-section-items');
                const wasExpanded = items && items.parentElement.classList.contains('expanded');
                sidebarSectionToggles[sectionId] = !wasExpanded;
            }
            render();
        };

        // Tap a section header → open the dropdown AND navigate to its first sub-item, so the
        // main content actually changes (otherwise mobile users — who can't see the section
        // label — think nothing happened). If the user is already viewing any sub-item of this
        // section, just keep the dropdown open and leave them where they are.
        window.enterSidebarSection = (sectionId, firstPage, subPagesCsv) => {
            sidebarSectionToggles[sectionId] = true;
            const subPages = (subPagesCsv || '').split(',').filter(Boolean);
            if (subPages.includes(currentPage)) {
                render();
            } else {
                setPage(firstPage);
            }
        };
        window.handleRefreshContent = async () => {
            const btn = document.getElementById('refreshContentBtn');
            const origHtml = btn ? btn.innerHTML : '';
            if (btn) { btn.innerHTML = IC.refresh + ' Scraping reels... (30-60s)'; btn.disabled = true; btn.style.opacity = '0.6'; }
            try {
                if (!sbClient) throw new Error('Supabase not connected');
                const idToken = await getIdToken();
                const { data, error } = await sbClient.functions.invoke('scrape-reels', { body: { uid: currentUser.uid, idToken } });
                if (error) throw new Error(error.message || JSON.stringify(error));
                if (data && data.error === 'Cooldown') {
                    toast.error(data.message || 'You can refresh once a week.');
                    if (btn) { btn.innerHTML = origHtml; btn.disabled = false; btn.style.opacity = '1'; }
                    return;
                }
                if (btn) btn.innerHTML = IC.refresh + ' Updating...';
                setTimeout(() => setPage('content'), 1500);
            } catch(e) {
                toast.error('Refresh failed: ' + (e.message || JSON.stringify(e)));
                if (btn) { btn.innerHTML = origHtml; btn.disabled = false; btn.style.opacity = '1'; }
            }
        };
        window.handleRefreshInspo = async () => {
            const btn = document.getElementById('refreshInspoBtn');
            const origHtml = btn ? btn.innerHTML : '';
            if (btn) { btn.innerHTML = IC.refresh + ' Scraping inspo... (30-60s)'; btn.disabled = true; btn.style.opacity = '0.6'; }
            try {
                if (!sbClient) throw new Error('Supabase not connected');
                const { data, error } = await sbClient.functions.invoke('scrape-inspo', {
                    body: { uid: currentUser.uid }
                });
                if (error) throw new Error(error.message || JSON.stringify(error));
                if (btn) btn.innerHTML = IC.refresh + ' Updating...';
                setTimeout(() => setPage('inspo'), 1500);
            } catch(e) {
                toast.error('Refresh failed: ' + (e.message || JSON.stringify(e)));
                if (btn) { btn.innerHTML = origHtml; btn.disabled = false; btn.style.opacity = '1'; }
            }
        };
        window.signOut = async () => { await auth.signOut(); };
        window.openClientDetail = (uid) => { selectedClientDetail = uid; currentPage = 'clientDetail'; render(); };
        window.loadWeekForEdit = (key) => { selectedWeekKey = key; selectedDayIndex = null; setPage('numbers'); };
        window.deleteClient = async (uid) => {
            if (!await confirmAsync({ title: 'Remove this client?', message: 'They will lose access to the portal and see an "access revoked" message if they try to log in. You can re-enable them later from the admin panel.', confirmLabel: 'Remove client', danger: true })) return;
            try {
                // Soft-disable: keep profile but mark as disabled, wipe their data
                await Promise.all([
                    db.ref(`portal/users/${uid}/disabled`).set(true),
                    db.ref(`portal/users/${uid}/disabledAt`).set(new Date().toISOString()),
                    db.ref(`portal/entries/${uid}`).remove(),
                    db.ref(`portal/tasks/${uid}`).remove(),
                    db.ref(`portal/content/${uid}`).remove()
                ]);
                selectedClientDetail = null;
                currentPage = 'clients';
                render();
            } catch (err) { toast.error('Error removing client: ' + err.message); }
        };

        window.reEnableClient = async (uid) => {
            if (!await confirmAsync({ title: 'Re-enable this client?', message: 'They will be able to log in and use the portal again.', confirmLabel: 'Re-enable' })) return;
            try {
                await Promise.all([
                    db.ref(`portal/users/${uid}/disabled`).remove(),
                    db.ref(`portal/users/${uid}/disabledAt`).remove()
                ]);
                render();
            } catch (err) { toast.error('Error re-enabling client: ' + err.message); }
        };

        // ── AUTH ──
        let accessRevoked = false;
        // ── PUSH NOTIFICATIONS ──
        const VAPID_PUBLIC_KEY = 'BFWu1YzV1qat1ivzCUze63sRzWgaTjpSM8UeTodAEqfNOvML52j9hMHVBG4NqGvcCVK0qiW3P3NTm4X_tjLz7-U';
        async function setupPushNotifications(uid) {
            try {
                if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
                const registration = await navigator.serviceWorker.register('/sw.js');
                await navigator.serviceWorker.ready;
                // Check if already subscribed
                let subscription = await registration.pushManager.getSubscription();
                if (!subscription) {
                    // Ask permission
                    const permission = await Notification.requestPermission();
                    if (permission !== 'granted') return;
                    // Subscribe
                    const urlBase64ToUint8Array = (base64String) => {
                        const padding = '='.repeat((4 - base64String.length % 4) % 4);
                        const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
                        const rawData = atob(base64);
                        return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
                    };
                    subscription = await registration.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
                    });
                }
                // Save subscription to Firebase
                await db.ref(`portal/push_subscriptions/${uid}`).set(JSON.parse(JSON.stringify(subscription)));
            } catch (err) {
                console.warn('Push notification setup failed:', err);
            }
        }

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                await refreshSupabaseSession(user);
                const snap = await db.ref(`portal/users/${user.uid}`).once('value');
                if (snap.exists()) {
                    const userData = snap.val();
                    if (userData.disabled) {
                        // Account has been disabled by admin
                        accessRevoked = true;
                        currentUser = null;
                        await auth.signOut();
                    } else {
                        accessRevoked = false;
                        currentUser = { uid: user.uid, ...userData };
                        userCurrency = (userData.currency && CURRENCIES[userData.currency]) ? userData.currency : 'GBP';
                        db.ref(`portal/users/${user.uid}/lastLogin`).set(new Date().toISOString());
                        // Setup push notifications for students (not admin)
                        if (userData.role !== 'admin') {
                            setTimeout(() => setupPushNotifications(user.uid), 3000);
                        }
                    }
                } else if (user.email === 'timbrace14@gmail.com') {
                    const profile = { firstName: 'Tim', lastName: 'Brace', email: user.email, role: 'admin', createdAt: new Date().toISOString(), lastLogin: new Date().toISOString() };
                    await db.ref(`portal/users/${user.uid}`).set(profile);
                    currentUser = { uid: user.uid, ...profile };
                }
            } else { currentUser = null; userCurrency = 'GBP'; clearSupabaseSession(); }
            authLoading = false;
            render();
        });

        render();
    </script>
</body>
</html>
