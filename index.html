                            <button id="tabSignUp" onclick="switchAuthMode('signup')" style="flex:1;padding:10px;border:none;border-radius:8px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;transition:all 0.2s;background:${authMode==='signup'?'#2A2A2A':'transparent'};color:${authMode==='signup'?'#fff':'rgba(255,255,255,0.56)'};box-shadow:${authMode==='signup'?'0 1px 4px rgba(0,0,0,0.2)':'none'};">Create Account</button>
                        </div>
                        ${authMode === 'signup' ? `
                            <div style="display:flex;gap:12px;">
                                <div class="form-group" style="flex:1;"><label class="form-label">First Name</label><input type="text" id="signupFirst" class="form-input" placeholder="John"></div>
                                <div class="form-group" style="flex:1;"><label class="form-label">Last Name</label><input type="text" id="signupLast" class="form-input" placeholder="Doe"></div>
                            </div>
                        ` : `<h1 class="login-heading" style="margin-bottom:8px;">Welcome back</h1><p class="login-subtext">Sign in to your portal</p>`}
                        <div class="form-group">
                            <label class="form-label">Email</label>
                            <input type="email" id="loginEmail" class="form-input" placeholder="you@example.com">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Password</label>
                            <input type="password" id="loginPassword" class="form-input" placeholder="&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;">
                        </div>
                        <div class="error-message" id="loginError"></div>
                        <button class="btn-primary" id="signInBtn">${authMode === 'signup' ? 'Create Account &#x2192;' : 'Sign In &#x2192;'}</button>
                        ${authMode === 'signin' ? `<div style="text-align:center;margin-top:16px;"><button id="forgotPasswordBtn" style="background:none;border:none;color:${ACCENT};font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;padding:8px 16px;text-decoration:underline;text-underline-offset:3px;">Forgot password?</button></div>` : ''}
                    </div>
                </div>
            </div>
        `;

        window.switchAuthMode = (mode) => { authMode = mode; render(); };

        const handleSignIn = async () => {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');
            if (!email || !password) { errorDiv.textContent = 'Please enter email and password'; return; }
            try {
                errorDiv.textContent = authMode === 'signup' ? 'Creating account...' : 'Signing in...';
                if (authMode === 'signup') {
                    const firstName = (document.getElementById('signupFirst')?.value || '').trim();
                    const lastName = (document.getElementById('signupLast')?.value || '').trim();
                    if (!firstName) { errorDiv.textContent = 'Please enter your first name'; return; }
                    const cred = await auth.createUserWithEmailAndPassword(email, password);
                    // Check if this UID was previously disabled
                    const existingSnap = await db.ref(`portal/users/${cred.user.uid}`).once('value');
                    if (existingSnap.exists() && existingSnap.val().disabled) {
                        accessRevoked = true;
                        await auth.signOut();
                        render();
                        return;
                    }
                    const isAdmin = email === 'timbrace14@gmail.com';
                    // Write profile to DB — non-blocking so login isn't stuck if DB isn't ready
                    db.ref(`portal/users/${cred.user.uid}`).set({
                        firstName, lastName, email,
                        role: isAdmin ? 'admin' : 'client',
                        createdAt: new Date().toISOString()
                    }).catch(() => {});
                } else {
                    const cred = await auth.signInWithEmailAndPassword(email, password);
                    // Check if account is disabled before onAuthStateChanged races
                    const userSnap = await db.ref(`portal/users/${cred.user.uid}`).once('value');
                    if (userSnap.exists() && userSnap.val().disabled) {
                        accessRevoked = true;
                        currentUser = null;
                        await auth.signOut();
                        authLoading = false;
                        render();
                        return;
                    }
                }
            } catch (err) {
                const msg = err.message || 'Sign in failed';
                const friendly = msg.includes('configuration-not-found')
                    ? 'Firebase auth not set up yet. Please enable Email/Password in Firebase Console → Authentication → Sign-in method.'
                    : msg.includes('user-not-found') || msg.includes('wrong-password') || msg.includes('invalid-credential')
                    ? 'Incorrect email or password.'
                    : msg.includes('email-already-in-use')
                    ? 'An account with this email already exists. Try signing in instead.'
                    : msg;
                errorDiv.textContent = friendly;
            }
        };

        const handleForgotPassword = async () => {
            const email = document.getElementById('loginEmail').value;
            if (!email) { document.getElementById('loginError').textContent = 'Enter your email above, then click forgot password'; return; }
            try {
                await auth.sendPasswordResetEmail(email);
                document.getElementById('loginError').textContent = '';
                toast.success('Password reset email sent to ' + email + '. Check your inbox.');
            } catch(err) {
                const msg = err.message || '';
                document.getElementById('loginError').textContent = msg.includes('user-not-found') ? 'No account found with that email.' : 'Error sending reset email. Try again.';
            }
        };

        // ── METRIC CARD ──
        const MetricCard = (label, value, trend = null, isCurrency = false, isPercent = false, isGood = null) => {
            let displayValue = value, valueClass = '';
            if (isCurrency) { displayValue = formatCurrency(value); }
            else if (isPercent) {
                displayValue = `${parseFloat(value || 0).toFixed(1)}%`;
                if (isGood === true) valueClass = 'green';
                else if (isGood === false) valueClass = 'red';
            } else { displayValue = formatNumber(value); }
            const sparkline = trend && trend.length > 1 ? generateSparkline(trend) : '';
            return `<div class="metric-card">
                <div class="metric-label">${label}</div>
                <div class="metric-value ${valueClass}">${displayValue}</div>
                ${sparkline}
            </div>`;
        };

        // ── CLIENT HUB ──
        let hubChartData = null;
        let hubWeekOffset = 0; // 0 = current week, -1 = last week, etc.

        const getOffsetWeekKey = (offset) => {
            const d = new Date();
            d.setDate(d.getDate() + offset * 7);
            const s = new Date(d.getFullYear(), 0, 1);
            const week = Math.ceil(((d - s) / 86400000 + s.getDay() + 1) / 7);
            return `${d.getFullYear()}_W${String(week).padStart(2, '0')}`;
        };

        const renderClientHub = async () => {
            const weekKey = getOffsetWeekKey(hubWeekOffset);
            const [entriesSnap, socialHistSnap, socialProfileSnap, goalsSnap, savingsSnap, investmentsSnap, , dfData] = await Promise.all([
                db.ref(`portal/entries/${currentUser.uid}`).once('value'),
                db.ref(`portal/social_history/${currentUser.uid}`).once('value'),
                db.ref(`portal/social_profiles/${currentUser.uid}`).once('value'),
                db.ref(`portal/goals/${currentUser.uid}`).once('value'),
                db.ref(`portal/savings/${currentUser.uid}`).once('value'),
                db.ref(`portal/investments/${currentUser.uid}`).once('value'),
                loadLeaveDates(),
                df_load(),
            ]);
            const goals = goalsSnap.val() || {};
            const goalsComplete = !!(goals.why && goals.how && goals.goal90 && goals.goal6m);
            const icpComplete = !!(goals.icpAge && goals.icpGender && goals.icpWants && goals.icpPains);
            // Setup strip is ALWAYS visible so students can always re-edit Goals/ICP from the hub.
            // It just goes quieter (small green chips) once both are complete.
            const bothSetupComplete = goalsComplete && icpComplete;
            const entries = entriesSnap.val() || {};

            // Daily Five widget: computed from entries (for auto-tick) + dfData
            const dfTodayStr = df_iso(new Date());
            const dfActive = dfData && dfData.startDate && dfData.mode;
            const dfStats = dfActive ? df_computeStats(dfData, entries, dfTodayStr) : null;
            const dfTodayItems = dfStats ? (() => {
                const todayData = (dfData.days || {})[dfTodayStr] || {};
                const auto = df_hasNumbersFor(entries, dfTodayStr);
                const ticked = DF_ITEMS.filter(it => it.key === 'numbers' ? auto : !!todayData[it.key]).length;
                return { ticked, total: DF_ITEMS.length };
            })() : null;
            const socialHistory = socialHistSnap.val() || {};
            const socialProfile = socialProfileSnap.val() || {};
            const hubSavings = savingsSnap.val() || {};
            const hubInvestments = investmentsSnap.val() || {};
            const socialWeeks = Object.entries(socialHistory).sort(([a],[b]) => a.localeCompare(b));
            const hasSocialHistory = socialWeeks.length > 0;
            const hasTikTok = !!socialProfile.tiktokUrl;
            const socialLatest = socialWeeks.length > 0 ? socialWeeks[socialWeeks.length-1][1] : {};
            const socialPrev = socialWeeks.length > 1 ? socialWeeks[socialWeeks.length-2][1] : {};
            const socialDiff = (key) => { const d = (socialLatest[key]||0)-(socialPrev[key]||0); if(d===0) return ''; return `<span style="font-size:11px;font-weight:700;color:${d>0?'#4ADE80':'#FF4533'};margin-left:6px;">${d>0?'+':''}${formatNumber(d)}</span>`; };
            const currentEntryRaw = entries[weekKey] || {};
            const currentEntry = getWeeklyTotals(currentEntryRaw, weekKey);
            const allEntries = Object.values(entries);
            const allEntriesWithKeys = Object.entries(entries);

            const last8Weeks = [];
            for (let i = 7; i >= 0; i--) {
                const d = new Date(); d.setDate(d.getDate() - (7 - i) * 7);
                const s = new Date(d.getFullYear(), 0, 1);
                const week = Math.ceil(((d - s) / 86400000 + s.getDay() + 1) / 7);
                const wk = `${d.getFullYear()}_W${String(week).padStart(2, '0')}`;
                last8Weeks.push(getWeeklyTotals(entries[wk], wk));
            }

            const calcMetric = (key) => last8Weeks.map(w => parseFloat(w[key]) || 0);
            const revenue = currentEntry.revenue || 0;
            const expenses = currentEntry.expenses || 0;
            const noShows = currentEntry.noShows || 0;
            const avgTicket = currentEntry.avgTicketPrice || 0;
            const lossOfEarnings = noShows * avgTicket;
            const trueProfit = revenue - lossOfEarnings - expenses;
            const trueMargin = revenue > 0 ? (trueProfit / revenue * 100) : 0;
            const occupancy = currentEntry.appointmentsAvailable > 0
                ? currentEntry.appointmentsFilled / currentEntry.appointmentsAvailable * 100 : 0;
            const rebook = currentEntry.appointmentsFilled > 0
                ? currentEntry.rebookings / currentEntry.appointmentsFilled * 100 : 0;

            // All-time totals (using getWeeklyTotals for each entry, leave-aware)
            const allTotals = allEntriesWithKeys.map(([k, e]) => getWeeklyTotals(e, k));
            const allRevenue = allTotals.reduce((s,e) => s+e.revenue, 0);
            const allExpenses = allTotals.reduce((s,e) => s+e.expenses, 0);
            const allBusinessExpenses = allTotals.reduce((s,e) => s+(e.businessExpenses||0), 0);
            const allPersonalExpenses = allTotals.reduce((s,e) => s+(e.personalExpenses||0), 0);
            const allClients = allTotals.reduce((s,e) => s+e.newClients, 0);
            const allViews = allEntries.reduce((s,e) => s+(parseFloat(e.instagramViews)||0)+(parseFloat(e.tiktokViews)||0), 0);
            const allFollowers = allEntries.reduce((s,e) => s+(parseFloat(e.instagramFollowers)||0)+(parseFloat(e.tiktokFollowers)||0), 0);
            const allNoShows = allTotals.reduce((s,e) => s+e.noShows, 0);
            const allRebookings = allTotals.reduce((s,e) => s+e.rebookings, 0);
            const allTrueProfit = allRevenue - allExpenses;
            const allTrueProfitMargin = allRevenue > 0 ? (allTrueProfit / allRevenue * 100) : 0;
            const allApptsAvailable = allTotals.reduce((s,e) => s+e.appointmentsAvailable, 0);
            const allApptsFilled = allTotals.reduce((s,e) => s+e.appointmentsFilled, 0);
            const allOccupancy = allApptsAvailable > 0 ? (allApptsFilled / allApptsAvailable * 100) : 0;
            const allRebook = allApptsFilled > 0 ? (allRebookings / allApptsFilled * 100) : 0;

            // ── Monthly aggregations for coaching alerts + 3-bar margin panel ──
            const now = new Date();
            const thisMonthYear = now.getFullYear();
            const thisMonthNum = now.getMonth();
            const thisMonthName = now.toLocaleDateString('en-GB', { month: 'long' });
            const lastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
            const lastMonthYear = lastMonth.getFullYear();
            const lastMonthNum = lastMonth.getMonth(); // 0-indexed
            const lastMonthName = lastMonth.toLocaleDateString('en-GB', { month: 'long' });
            let lmApptsAvailable = 0, lmApptsFilled = 0, lmRebookings = 0, lmWeeksLogged = 0;
            let cmRevenue = 0, cmBusinessExp = 0, cmPersonalExp = 0, cmWeeksLogged = 0;
            let lmRevenue = 0, lmBusinessExp = 0, lmPersonalExp = 0;
            Object.entries(entries).forEach(([wk, e]) => {
                const yr = parseInt(wk.split('_')[0]);
                const wn = parseInt(wk.split('_W')[1]);
                const d = new Date(yr, 0, 1 + (wn - 1) * 7);
                const t = getWeeklyTotals(e, wk);
                if (d.getFullYear() === thisMonthYear && d.getMonth() === thisMonthNum) {
                    cmRevenue += t.revenue || 0;
                    cmBusinessExp += t.businessExpenses || 0;
                    cmPersonalExp += t.personalExpenses || 0;
                    if ((t.revenue || 0) > 0) cmWeeksLogged++;
                } else if (d.getFullYear() === lastMonthYear && d.getMonth() === lastMonthNum) {
                    lmApptsAvailable += t.appointmentsAvailable;
                    lmApptsFilled += t.appointmentsFilled;
                    lmRebookings += t.rebookings;
                    lmWeeksLogged++;
                    lmRevenue += t.revenue || 0;
                    lmBusinessExp += t.businessExpenses || 0;
                    lmPersonalExp += t.personalExpenses || 0;
                }
            });
            const lmOccupancy = lmApptsAvailable > 0 ? (lmApptsFilled / lmApptsAvailable * 100) : 0;
            const lmRebook = lmApptsFilled > 0 ? (lmRebookings / lmApptsFilled * 100) : 0;

            // 3-bar profit margins: Combined (true) / Business-only (operating) / Personal-only (lifestyle)
            const cmCombinedMargin = cmRevenue > 0 ? ((cmRevenue - cmBusinessExp - cmPersonalExp) / cmRevenue * 100) : 0;
            const cmBusinessMargin = cmRevenue > 0 ? ((cmRevenue - cmBusinessExp) / cmRevenue * 100) : 0;
            const cmPersonalMargin = cmRevenue > 0 ? ((cmRevenue - cmPersonalExp) / cmRevenue * 100) : 0;
            const lmCombinedMargin = lmRevenue > 0 ? ((lmRevenue - lmBusinessExp - lmPersonalExp) / lmRevenue * 100) : 0;
            const lmBusinessMargin = lmRevenue > 0 ? ((lmRevenue - lmBusinessExp) / lmRevenue * 100) : 0;
            const lmPersonalMargin = lmRevenue > 0 ? ((lmRevenue - lmPersonalExp) / lmRevenue * 100) : 0;
            const showMarginPanel = cmRevenue > 0 || lmRevenue > 0;
            const showRebookAlert = lmWeeksLogged > 0 && lmRebook < 50 && !sessionStorage.getItem('dismissedRebookAlert');
            const showOccupancyAlert = lmWeeksLogged > 0 && lmOccupancy >= 80 && !sessionStorage.getItem('dismissedOccupancyAlert');

            // ── Money: nudge if numbers logged this week but transfer not ticked ──
            // ── Multi-pot savings: aggregate across active pots, check this-week transfer nudge ──
            const hubActivePots = getActivePots(hubSavings);
            const hubPausedPots = getPausedPots(hubSavings);
            const hubAllPots = hubActivePots.concat(hubPausedPots);
            const hubSavingsSetup = hubAllPots.length > 0;
            const hubCurrentWeekKey = getWeekKey();
            const hubCurrentWeekEntry = getWeeklyTotals(entries[hubCurrentWeekKey] || {}, hubCurrentWeekKey);
            const hubLoggedThisWeek = (hubCurrentWeekEntry.revenue || 0) > 0;
            // Weekly nudge fires only if there are weekly active pots with at least one not yet logged
            const hubWeeklyActivePots = hubActivePots.filter(p => p.contributionUnit !== 'monthly');
            const hubWeeklyPotsPending = hubWeeklyActivePots.filter(p => !getPotTransfers(hubSavings, p.id)[hubCurrentWeekKey]);
            const hubWeeklyTargetPending = hubWeeklyPotsPending.reduce((s, p) => s + (Number(p.contribution) || 0), 0);
            const showTransferNudge = hubSavingsSetup && hubLoggedThisWeek && hubWeeklyPotsPending.length > 0 && hubWeeklyTargetPending > 0;
            const hubAggregateWeekly = totalWeeklyTargetActive(hubSavings);

            // ── Investments summary tiles ──
            const hubTotalSaved = totalSavedAcrossPots(hubSavings);
            const hubTotalInvested = totalInvested(hubInvestments);
            const hubCombinedWealth = hubTotalSaved + hubTotalInvested;
            const hubTotalTarget = hubAllPots.reduce((s, p) => s + (Number(p.target) || 0), 0);
            const hubGoalPct = hubTotalTarget > 0 ? Math.min(100, (hubTotalSaved / hubTotalTarget) * 100) : 0;
            const showInvestmentsSummary = hubSavingsSetup;

            hubChartData = { trueMargin, occupancy, rebook, allTrueProfitMargin, allOccupancy, allRebook, revenue, expenses, lossOfEarnings, trueProfit, noShows, avgTicket, appointmentsAvailable: currentEntry.appointmentsAvailable||0, appointmentsFilled: currentEntry.appointmentsFilled||0, rebookings: currentEntry.rebookings||0 };

            const hour = new Date().getHours();
            const greeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';

            return `
                <div class="hub-page">
                    <!-- Dot rail is appended to <body> by initHubFocusMode() so position:fixed
                         isn't broken by the transformed .page-fade-in ancestor.
                         Visual order: Pulse → This Week → This Month → All Time (set via CSS order). -->

                    <!-- §1 — PULSE (greeting, setup, alerts, investments) -->
                    <section class="hub-snap-section active" data-snap-id="pulse">
                    <div class="greeting" style="margin-bottom:20px;">
                        <div class="greeting-text">${greeting}, <strong>${currentUser.firstName}</strong></div>
                    </div>

                    ${bothSetupComplete ? `
                    <!-- SETUP STRIP — quiet state (both complete) -->
                    <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;">
                        <button onclick="setPage('goals')" style="display:inline-flex;align-items:center;gap:8px;padding:7px 14px;background:rgba(74,222,128,0.06);border:1px solid rgba(74,222,128,0.2);border-radius:20px;color:rgba(74,222,128,0.85);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;transition:all 0.2s;letter-spacing:0.02em;" onmouseover="this.style.background='rgba(74,222,128,0.12)'" onmouseout="this.style.background='rgba(74,222,128,0.06)'">
                            <span style="display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:#4ADE80;color:#0f0f0f;font-size:9px;font-weight:900;">&#x2713;</span>
                            Goals
                            <span style="color:rgba(255,255,255,0.35);font-size:10px;margin-left:2px;">edit</span>
                        </button>
                        <button onclick="setPage('icp')" style="display:inline-flex;align-items:center;gap:8px;padding:7px 14px;background:rgba(74,222,128,0.06);border:1px solid rgba(74,222,128,0.2);border-radius:20px;color:rgba(74,222,128,0.85);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;transition:all 0.2s;letter-spacing:0.02em;" onmouseover="this.style.background='rgba(74,222,128,0.12)'" onmouseout="this.style.background='rgba(74,222,128,0.06)'">
                            <span style="display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:#4ADE80;color:#0f0f0f;font-size:9px;font-weight:900;">&#x2713;</span>
                            ICP
                            <span style="color:rgba(255,255,255,0.35);font-size:10px;margin-left:2px;">edit</span>
                        </button>
                    </div>` : `
                    <!-- SETUP STRIP — prominent state (at least one incomplete) -->
                    <div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;">
                        <button onclick="setPage('goals')" style="flex:1;min-width:160px;display:flex;align-items:center;gap:10px;padding:12px 16px;background:${goalsComplete ? 'rgba(74,222,128,0.08)' : 'rgba(245,200,66,0.08)'};border:1px solid ${goalsComplete ? 'rgba(74,222,128,0.35)' : 'rgba(245,200,66,0.35)'};border-radius:12px;color:${goalsComplete ? '#4ADE80' : '#f5c842'};font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;text-align:left;transition:all 0.2s;" onmouseover="this.style.opacity='0.85'" onmouseout="this.style.opacity='1'">
                            <span style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:${goalsComplete ? '#4ADE80' : 'rgba(245,200,66,0.18)'};color:${goalsComplete ? '#0f0f0f' : '#f5c842'};font-size:12px;flex-shrink:0;">${goalsComplete ? '&#x2713;' : '&#x2192;'}</span>
                            <span style="flex:1;">Goals</span>
                            <span style="font-size:11px;font-weight:600;color:${goalsComplete ? 'rgba(74,222,128,0.7)' : 'rgba(245,200,66,0.7)'};">${goalsComplete ? 'Complete' : 'Set up'}</span>
                        </button>
                        <button onclick="setPage('icp')" style="flex:1;min-width:160px;display:flex;align-items:center;gap:10px;padding:12px 16px;background:${icpComplete ? 'rgba(74,222,128,0.08)' : 'rgba(245,200,66,0.08)'};border:1px solid ${icpComplete ? 'rgba(74,222,128,0.35)' : 'rgba(245,200,66,0.35)'};border-radius:12px;color:${icpComplete ? '#4ADE80' : '#f5c842'};font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;text-align:left;transition:all 0.2s;" onmouseover="this.style.opacity='0.85'" onmouseout="this.style.opacity='1'">
                            <span style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:${icpComplete ? '#4ADE80' : 'rgba(245,200,66,0.18)'};color:${icpComplete ? '#0f0f0f' : '#f5c842'};font-size:12px;flex-shrink:0;">${icpComplete ? '&#x2713;' : '&#x2192;'}</span>
                            <span style="flex:1;">Ideal Client (ICP)</span>
                            <span style="font-size:11px;font-weight:600;color:${icpComplete ? 'rgba(74,222,128,0.7)' : 'rgba(245,200,66,0.7)'};">${icpComplete ? 'Complete' : 'Set up'}</span>
                        </button>
                    </div>`}

                    ${dfActive ? (() => {
                        const todayDone = dfTodayItems.ticked === dfTodayItems.total;
                        const ringColor = todayDone ? '#4ADE80' : (dfTodayItems.ticked > 0 ? '#f5c842' : 'rgba(255,255,255,0.25)');
                        const dayClamped = Math.min(dfStats.dayNumber, DF_LENGTH);
                        return `
                    <!-- DAILY FIVE STREAK WIDGET -->
                    <div onclick="setPage('dailyfive')" style="display:flex;align-items:center;gap:14px;padding:14px 18px;background:linear-gradient(135deg,rgba(245,200,66,0.06),rgba(184,233,134,0.06));border:1px solid rgba(245,200,66,0.22);border-radius:14px;margin-bottom:16px;cursor:pointer;transition:all 0.2s;" onmouseover="this.style.background='linear-gradient(135deg,rgba(245,200,66,0.1),rgba(184,233,134,0.1))'" onmouseout="this.style.background='linear-gradient(135deg,rgba(245,200,66,0.06),rgba(184,233,134,0.06))'">

        // Lighter shade for the left end of the donut ring's left-to-right gradient
        const RING_GRADIENT_LIGHT = {

            '#FBBF24': '#FCD976',

        const makeRingGradient = (canvas, color) => {

            const makeDonut = (id, value, color, delay) => {

                const pct = Math.min(Math.max(value, 0), 100);
                const ringFill = makeRingGradient(canvas, color);

        // ── HUB FOCUS-MODE ──
        // Tracks which hub section is most visible as the user scrolls and dims the others.

            // Always remove any existing rail before considering re-adding

            rail.className = 'hub-dot-rail';

                const btn = document.createElement('button');

            document.body.appendChild(rail);

            const setActive = (idx) => {
                sections.forEach((s, i) => {
                    s.classList.toggle('active', i === idx);
                    s.classList.toggle('dim', i !== idx);
                });
                dots.forEach((d, i) => d.classList.toggle('active', i === idx));

            // don't fire on the scroll container — which we observed in this layout).
            const ratios = new Map();
            sections.forEach(s => ratios.set(s, 0));

            const pickActive = () => {
                let bestIdx = 0;
                let bestRatio = -1;
                sections.forEach((s, i) => {
                    const r = ratios.get(s) || 0;
                    if (r > bestRatio) { bestRatio = r; bestIdx = i; }
                });
                setActive(bestIdx);
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(e => ratios.set(e.target, e.intersectionRatio));
                pickActive();
            }, {
                root: scroller,
                threshold: [0, 0.1, 0.25, 0.4, 0.55, 0.7, 0.85, 1.0],

            const updateByScroll = () => {
