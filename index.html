                                <option value="">Choose a client...</option>
                                ${clientUsers.map(([uid, u]) => `<option value="${uid}">${u.firstName} ${u.lastName}</option>`).join('')}
                            </select>
                        </div>
                        <div class="form-group"><label class="form-label">Task Title</label><input type="text" id="taskTitle" class="form-input" placeholder="Complete meal prep"></div>
                        <div class="form-group"><label class="form-label">Description</label><textarea id="taskDescription" class="textarea" placeholder="Details about this task..."></textarea></div>
                        <div class="form-group"><label class="form-label">Due Date</label><input type="date" id="taskDueDate" class="form-input"></div>
                        <div id="checklistItemsContainer">
                            <div class="form-group" style="margin-bottom:8px;">
                                <label class="form-label">Checklist Items</label>
                                <button class="btn-secondary" id="addChecklistItem" style="width:auto;margin-top:8px;">+ Add Item</button>
                            </div>
                        </div>
                        <button class="btn-primary" id="assignTaskBtn" style="margin-top:16px;">Assign Task &#x2192;</button>
                    </div>
                    <div id="allTasksList" style="margin-top:24px;"></div>
                </div>
            `;
        };

        const handleAddChecklistItem = () => {
            const container = document.getElementById('checklistItemsContainer');
            const itemCount = container.querySelectorAll('.checklist-item-input').length;
            const newItem = document.createElement('div');
            newItem.className = 'form-group checklist-item-input';
            newItem.style.marginBottom = '8px';
            newItem.innerHTML = `<div style="display:flex;gap:8px;align-items:flex-end;">
                <input type="text" class="form-input" placeholder="Item ${itemCount + 1}" style="flex:1;">
                <button style="background:${ACCENT};border:none;color:#000;padding:12px 14px;border-radius:8px;cursor:pointer;font-weight:700;" onclick="this.parentElement.parentElement.remove();">&#x00D7;</button>
            </div>`;
            container.appendChild(newItem);
        };

        const handleAssignTask = async () => {
            const clientId = document.getElementById('taskClientSelect').value;
            const title = document.getElementById('taskTitle').value;
            const description = document.getElementById('taskDescription').value;
            const dueDate = document.getElementById('taskDueDate').value;
            if (!clientId || !title) { alert('Please select a client and enter a title'); return; }
            const checklist = {};
            document.querySelectorAll('.checklist-item-input input').forEach((input, i) => {
                if (input.value) checklist[`item_${i}`] = { text: input.value, done: false };
            });
            try {
                const taskId = db.ref(`portal/tasks/${clientId}`).push().key;
                await db.ref(`portal/tasks/${clientId}/${taskId}`).set({ title, description, dueDate, createdAt: new Date().toISOString(), createdBy: currentUser.uid, checklist: Object.keys(checklist).length > 0 ? checklist : { item_0: { text: 'Complete task', done: false } } });
                alert('Task assigned!');
                document.getElementById('taskTitle').value = '';
                document.getElementById('taskDescription').value = '';
                document.getElementById('taskDueDate').value = '';
                document.getElementById('taskClientSelect').value = '';
                document.querySelectorAll('.checklist-item-input').forEach(el => el.remove());
            } catch (err) { alert('Error: ' + err.message); }
        };

        // ── ADMIN: CLIENT DETAIL — see full tabbed version near PDF EXPORT section ──

        // ── CONTENT INSPO ──
        let inspoSelectedWeek = null;

        const getInspoWeekKey = () => {
            const d = new Date();
            const s = new Date(d.getFullYear(), 0, 1);
            const week = Math.ceil(((d - s) / 86400000 + s.getDay() + 1) / 7);
            return `${d.getFullYear()}_W${String(week).padStart(2, '0')}`;
        };

        const renderClientInspo = async () => {
            const uid = currentUser.uid;
            if (!inspoSelectedWeek) inspoSelectedWeek = getInspoWeekKey();

            const [creatorsSnap, allWeeksSnap] = await Promise.all([
                db.ref(`portal/inspo_creators/${uid}`).once('value'),
                db.ref(`portal/inspo_videos/${uid}`).once('value')
            ]);

            const creators = creatorsSnap.val() || {};
            const creatorList = Object.entries(creators);
            const allWeeksRaw = allWeeksSnap.val() || {};

            // Get list of all saved weeks sorted newest first
            const allWeeks = Object.keys(allWeeksRaw).sort((a, b) => b.localeCompare(a));
            const currentWeekKey = inspoSelectedWeek;
            const weekVideos = allWeeksRaw[currentWeekKey] || {};

            // Group videos by creator for selected week
            const videosByCreator = {};
            Object.values(weekVideos).forEach(v => {
                if (!videosByCreator[v.creatorHandle]) videosByCreator[v.creatorHandle] = [];
                videosByCreator[v.creatorHandle].push(v);
            });

            const weekLabel = (key) => {
                const [year, w] = key.split('_W');
                const jan1 = new Date(parseInt(year), 0, 1);
                const monday = new Date(jan1.getTime() + (parseInt(w) - 1) * 7 * 86400000);
                const sunday = new Date(monday.getTime() + 6 * 86400000);
                const fmt = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
                return `${fmt(monday)} &#x2013; ${fmt(sunday)}`;
            };

            return `
                <div>
                    <h2 class="page-title">Content Inspo</h2>
                    <p class="page-subtitle">Top 4 performing reels from your favourite creators &#x2014; refreshed every Monday
                        <button onclick="handleRefreshInspo()" id="refreshInspoBtn" style="background:#1A1A1A;color:rgba(255,255,255,0.65);border:1px solid rgba(255,255,255,0.12);padding:4px 12px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;margin-left:12px;">${IC.refresh} Refresh Now</button>

                        ${creatorList.length < 3 ? `

                            <div style="position:relative;flex:1;">
                                <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.45);font-size:14px;font-weight:700;">@</span>
                                <input type="text" id="inspoHandleInput" class="form-input" placeholder="barberhandle" style="padding-left:30px;">
                            </div>
                            <button onclick="handleAddInspoCreator()" style="background:${ACCENT};color:#000;border:none;padding:12px 20px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit;">+ Add</button>
                        </div>` : `<div style="font-size:12px;color:rgba(255,255,255,0.45);margin-bottom:16px;font-weight:400;">Maximum 3 creators reached &#x2014; remove one to add another.</div>`}
                        ${creatorList.length === 0 ? `<div style="text-align:center;padding:16px;color:rgba(255,255,255,0.35);font-size:13px;font-weight:400;">No creators added yet</div>` : ''}
                        ${creatorList.map(([id, creator]) => `
                            <div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.06);">
                                <div style="width:36px;height:36px;background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg></div>
                                <div style="flex:1;">
                                    <div style="font-size:14px;font-weight:700;">@${creator.handle}</div>
                                    <a href="https://instagram.com/${creator.handle}" target="_blank" rel="noopener" style="font-size:11px;color:${ACCENT};font-weight:700;text-decoration:none;">View Profile &#x2192;</a>
                                </div>
                                <button onclick="handleRemoveInspoCreator('${id}')" style="background:rgba(255,69,51,0.12);color:#FF4533;border:none;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;">Remove</button>
                            </div>
                        `).join('')}
                    </div>

                    <!-- Week selector — only show if there is saved history -->
                    ${allWeeks.length > 0 ? `
                    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;">
                        <div style="font-size:11px;font-weight:700;color:rgba(255,255,255,0.45);text-transform:uppercase;letter-spacing:0.1em;">Week:</div>
                        <div style="display:flex;gap:8px;flex-wrap:wrap;">
                            ${allWeeks.map(wk => `
                                <button onclick="inspoSelectedWeek='${wk}';setPage('inspo');" style="padding:6px 14px;border-radius:20px;border:1.5px solid ${wk===currentWeekKey?ACCENT:'rgba(255,255,255,0.12)'};background:${wk===currentWeekKey?ACCENT:'#1A1A1A'};color:${wk===currentWeekKey?'#fff':'rgba(255,255,255,0.65)'};font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.2s;">
                                    ${wk === getInspoWeekKey() ? 'This week' : weekLabel(wk)}
                                </button>
                            `).join('')}
                        </div>
                    </div>` : ''}

                    <!-- Videos for selected week -->
                    <div class="section-header" style="margin-bottom:16px;">
                        ${allWeeks.length === 0 ? 'This Week&#x27;s Inspo' : `Inspo &#x2014; ${currentWeekKey === getInspoWeekKey() ? 'This week' : weekLabel(currentWeekKey)}`}

                    ${creatorList.length === 0 ? '' : Object.keys(videosByCreator).length === 0 ? `
                    <div class="empty-state">
                        <div class="empty-state-icon">${IC.star}</div>
                        <p style="margin-bottom:6px;">Videos loading soon</p>
                        <p style="font-size:13px;font-weight:400;color:rgba(255,255,255,0.45);">Your inspo videos will appear here after the next Monday scrape. You'll also get an email every Monday morning.</p>
                    </div>` : ''}

                    ${creatorList.map(([, creator]) => {
                        const vids = (videosByCreator[creator.handle] || []).slice(0, 4);
                        if (vids.length === 0) return '';
                        return `
                        <div style="margin-bottom:32px;">
                            <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid rgba(255,255,255,0.08);">
                                <div style="width:32px;height:32px;background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg></div>
                                <div style="font-size:15px;font-weight:700;">@${creator.handle}</div>
                                <a href="https://instagram.com/${creator.handle}" target="_blank" rel="noopener" style="font-size:11px;color:${ACCENT};font-weight:700;text-decoration:none;margin-left:auto;">View Profile &#x2192;</a>
                            </div>
                            ${vids.map(v => `
                            <div class="content-card" style="flex-direction:column;margin-bottom:12px;align-items:stretch;width:100%;">
                                <div style="display:flex;align-items:flex-start;gap:14px;width:100%;">
                                    <div style="width:64px;height:64px;border-radius:10px;flex-shrink:0;overflow:hidden;background:#1A1A1A;">
                                        ${v.thumbnail ? `<img src="${v.thumbnail}" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentElement.innerHTML='${IC.film}'">` : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:24px;">${IC.film}</div>`}
                                    </div>
                                    <div style="flex:1;min-width:0;text-align:left;">
                                        <div style="font-size:13px;font-weight:700;color:#fff;margin-bottom:6px;line-height:1.4;">${v.caption ? v.caption.slice(0,80)+(v.caption.length>80?'&#x2026;':'') : 'Instagram Reel'}</div>
                                        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px;">
                                            <span style="font-size:11px;color:rgba(255,255,255,0.56);">${IC.eye} <strong style="color:#fff;">${formatNumber(v.views||0)}</strong> views</span>
                                            ${v.likes?`<span style="font-size:11px;color:rgba(255,255,255,0.56);">${IC.heart} <strong style="color:#fff;">${formatNumber(v.likes)}</strong></span>`:''}
                                            ${v.comments?`<span style="font-size:11px;color:rgba(255,255,255,0.56);">${IC.chat} <strong style="color:#fff;">${formatNumber(v.comments)}</strong></span>`:''}
                                        </div>
                                        <a href="${v.link || 'https://www.instagram.com/' + creator.handle + '/reels/'}" target="_blank" rel="noopener" style="font-size:12px;color:${ACCENT};font-weight:700;text-decoration:none;">View Reel &#x2192;</a>
                                    </div>

// Helper: convert week key like "2026_W13" to date range like "24 Mar - 30 Mar"
const weekKeyToDateRange = (key) => {
    try {
        const [yr, wPart] = key.split('_W');
        const weekNum = parseInt(wPart);
        const year = parseInt(yr);
        // ISO week date: Jan 4 is always in week 1
        const jan4 = new Date(year, 0, 4);
        const dayOfWeek = jan4.getDay() || 7; // Mon=1..Sun=7
        const mondayW1 = new Date(jan4);
        mondayW1.setDate(jan4.getDate() - dayOfWeek + 1);
        const monday = new Date(mondayW1);
        monday.setDate(mondayW1.getDate() + (weekNum - 1) * 7);
        const sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 6);
        const fmt = (d) => d.toLocaleDateString('en-GB', { day:'numeric', month:'short' });
        const monthLabel = monday.toLocaleDateString('en-GB', { month:'long', year:'numeric' });
        return { range: fmt(monday) + ' \u2013 ' + fmt(sunday), month: monthLabel };
    } catch(e) { return { range: key, month: '' }; }
};

                { page: 'inspo', icon: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 11C2 11 3 6 8 6C13 6 14 11 14 11"/><path d="M8 6V3"/><path d="M5.5 3.5C5.5 2 8 1 8 3"/><path d="M10.5 3.5C10.5 2 8 1 8 3"/></svg>', label: 'Inspo' },
                { page: 'social', icon: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2a6 6 0 0 1 0 12"/><path d="M8 2a6 6 0 0 0 0 12"/><path d="M8 14V8"/><path d="M5 5L8 8L11 5"/></svg>', label: 'Social' },
                { page: 'progress', icon: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="1.5" y="9" width="3" height="5" rx="0.5" fill="currentColor" opacity="0.4"/><rect x="6.5" y="5" width="3" height="9" rx="0.5" fill="currentColor" opacity="0.6"/><rect x="11.5" y="2" width="3" height="12" rx="0.5" fill="currentColor" opacity="0.9"/></svg>', label: 'Analytics' },
                { page: 'scaleSignal', icon: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="4" y="1" width="8" height="14" rx="2"/><circle cx="8" cy="4.2" r="1.5" fill="#4ADE80"/><circle cx="8" cy="8" r="1.5" fill="#FBBF24"/><circle cx="8" cy="11.8" r="1.5" fill="#FF4533"/></svg>', label: 'The Scale Signal' },
            ];

            const adminNavItems = [
                { page: 'clients', icon: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="5" r="3"/><path d="M2.5 14c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/></svg>', label: 'Clients' },
                { page: 'tasks', icon: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5L6.5 12L13 4"/></svg>', label: 'Tasks' },
                { page: 'crm', icon: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="1.5" y="9" width="3" height="5" rx="0.5" fill="currentColor" opacity="0.4"/><rect x="6.5" y="5" width="3" height="9" rx="0.5" fill="currentColor" opacity="0.6"/><rect x="11.5" y="2" width="3" height="12" rx="0.5" fill="currentColor" opacity="0.9"/></svg>', label: 'CRM' },
                { page: 'addClient', icon: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M8 5v6M5 8h6"/></svg>', label: 'Add Client' },
                { page: 'scaleSignal', icon: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="4" y="1" width="8" height="14" rx="2"/><circle cx="8" cy="4.2" r="1.5" fill="#4ADE80"/><circle cx="8" cy="8" r="1.5" fill="#FBBF24"/><circle cx="8" cy="11.8" r="1.5" fill="#FF4533"/></svg>', label: 'Scale Signal' },
            ];

            const navItems = isAdmin ? adminNavItems : clientNavItems;

            const sidebarHtml = `
                <div class="portal-sidebar">
                    <img src="${SCALO_LOGO}" alt="SCALO" class="sidebar-logo">
                    <div class="sidebar-nav">
                        ${navItems.map(item => `
                            <button class="sidebar-nav-item ${activeCheck === item.page ? 'active' : ''}" onclick="setPage('${item.page}')">
                                <span class="sidebar-nav-icon">${item.icon}</span>
                                <span class="nav-label">${item.label}</span>
                            </button>
                        `).join('')}
                    </div>
                    <button class="sidebar-signout" onclick="signOut()">
                        <span class="sidebar-nav-icon">&#x2192;</span>
                        <span class="nav-label">Sign Out</span>
                    </button>
                </div>
            `;

            let pageContent = '';
            if (isAdmin) {
                if (currentPage === 'clients') pageContent = await renderAdminClients();
                else if (currentPage === 'addClient') pageContent = await renderAdminAddClient();
                else if (currentPage === 'tasks') pageContent = await renderAdminTasks();
                else if (currentPage === 'crm') pageContent = await renderAdminCRM();
                else if (currentPage === 'clientDetail' && selectedClientDetail) pageContent = await renderAdminClientDetail(selectedClientDetail);
                else if (currentPage === 'scaleSignal') pageContent = await renderAdminScaleSignal();
                else { currentPage = 'clients'; pageContent = await renderAdminClients(); }
            } else {
                if (currentPage === 'hub') pageContent = await renderClientHub();
                else if (currentPage === 'implementation') pageContent = await renderClientImplementation();
                else if (currentPage === 'numbers') pageContent = await renderClientNumbers();
                else if (currentPage === 'tasks') pageContent = await renderClientTasks();
                else if (currentPage === 'content') { pageContent = await renderClientContent(); checkAndTriggerContentScrape(currentUser.uid); }
                else if (currentPage === 'inspo') { pageContent = await renderClientInspo(); checkAndTriggerInspoScrape(currentUser.uid); }
                else if (currentPage === 'social') pageContent = await renderClientSocial();
                else if (currentPage === 'progress') pageContent = await renderClientProgress();
                else if (currentPage === 'scaleSignal') pageContent = await renderClientScaleSignal();
            }

            const pageTitles = { hub:'Overview', implementation:'The Roadmap', numbers:'Log Your Numbers', tasks:'Your Tasks', content:'Content Library', inspo:'Inspo Feed', social:'Social Profiles', progress:'Analytics', scaleSignal:'The Scale Signal', clients:'Your Clients', addClient:'Add New Client', crm:'Client CRM', clientDetail:'Client Detail' };
            const pageTitle = pageTitles[currentPage] || '';
            const initials = ((currentUser.firstName||'?')[0] + (currentUser.lastName||'?')[0]).toUpperCase();
            const avatarHtml = currentUser.profilePicture
                ? '<div class="user-avatar"><img src="' + currentUser.profilePicture + '" alt=""></div>'
                : '<div class="user-avatar">' + initials + '</div>';
            const topbarHtml = `
                <div class="portal-topbar">
                    <div class="portal-topbar-title">${pageTitle}</div>
                    <div class="portal-topbar-user" onclick="openAvatarModal()">
                        ${avatarHtml}
                        <span>${currentUser.firstName}</span>
                    </div>
                </div>
            `;

            root.innerHTML = `
                <div class="portal-layout">
                    ${sidebarHtml}
                    <div class="portal-content-area">
                        ${topbarHtml}
                        ${pageContent}
                    </div>
                </div>
                <div id="avatarModalContainer"></div>
            `;

            if (currentPage === 'progress' && !isAdmin) setTimeout(renderProgressCharts, 50);
            if (currentPage === 'hub' && !isAdmin) setTimeout(renderHubCharts, 50);
            if (currentPage === 'social' && !isAdmin) setTimeout(renderSocialCharts, 50);

            // Event listeners
            if (isAdmin) {
                if (currentPage === 'addClient') document.getElementById('createClientBtn').addEventListener('click', handleCreateClient);
                else if (currentPage === 'tasks') {
                    document.getElementById('addChecklistItem').addEventListener('click', handleAddChecklistItem);
                    document.getElementById('assignTaskBtn').addEventListener('click', handleAssignTask);
                }
            } else {
                if (currentPage === 'numbers') {
                    const weekPicker = document.getElementById('weekPicker');
                    if (weekPicker) weekPicker.addEventListener('change', (e) => { if (e.target.value) { selectedWeekKey = weekKeyFromInput(e.target.value); selectedDayIndex = null; setPage('numbers'); } });
                } else if (currentPage === 'tasks') {
                    document.querySelectorAll('.checklist-checkbox').forEach(checkbox => {
                        checkbox.addEventListener('change', (e) => {
                            handleTaskChecklistChange(e.target.dataset.taskId, e.target.dataset.itemId, e.target.checked);
                        });
                    });
                } else if (currentPage === 'content') {
                    const addBtn = document.getElementById('addContentBtn');
                    const modal = document.getElementById('addContentModal');
                    if (addBtn) addBtn.addEventListener('click', () => modal.classList.add('active'));
                    const cancelBtn = document.getElementById('cancelContentBtn');
                    if (cancelBtn) cancelBtn.addEventListener('click', () => modal.classList.remove('active'));
                    const saveBtn = document.getElementById('saveContentBtn');
                    if (saveBtn) saveBtn.addEventListener('click', handleAddContent);
                    const igBtn = document.getElementById('saveIgHandleBtn');
                    if (igBtn) igBtn.addEventListener('click', handleSaveIgHandle);
                    document.querySelectorAll('.content-delete-btn').forEach(btn => {
                        btn.addEventListener('click', () => handleDeleteContent(btn.dataset.id));
                    });
                }
            }
        };

        // ── SAVE GOALS ──
        window.saveGoals = async () => {
            if (!currentUser) return;
            const data = {
                why: (document.getElementById('goalWhy')?.value || '').trim(),
                how: (document.getElementById('goalHow')?.value || '').trim(),
                goal90: (document.getElementById('goal90')?.value || '').trim(),
                goal6m: (document.getElementById('goal6m')?.value || '').trim(),
                updatedAt: new Date().toISOString()
            };
            try {
                await db.ref(`portal/goals/${currentUser.uid}`).set(data);
                const msg = document.getElementById('goalsSavedMsg');
                if (msg) {
                    msg.textContent = 'Goals saved';
                    msg.style.opacity = '1';
                    setTimeout(() => { msg.style.opacity = '0'; }, 2500);
                }
            } catch (err) { alert('Error saving goals: ' + err.message); }
        };

        // ── GLOBALS ──
        window.setPage = (page) => { currentPage = page; render(); };
        window.handleRefreshContent = async () => {
            const btn = document.getElementById('refreshContentBtn');
            const origHtml = btn ? btn.innerHTML : '';
            if (btn) { btn.innerHTML = IC.refresh + ' Scraping reels... (30-60s)'; btn.disabled = true; btn.style.opacity = '0.6'; }
            try {
                if (!sbClient) throw new Error('Supabase not connected');
                const { data, error } = await sbClient.functions.invoke('scrape-reels', { body: {} });
                if (error) throw new Error(error.message || JSON.stringify(error));
                if (btn) btn.innerHTML = IC.refresh + ' Updating...';
                setTimeout(() => setPage('content'), 1500);
            } catch(e) {
                alert('Refresh failed: ' + (e.message || JSON.stringify(e)));
                if (btn) { btn.innerHTML = origHtml; btn.disabled = false; btn.style.opacity = '1'; }
            }
        };
        window.handleRefreshInspo = async () => {
            const btn = document.getElementById('refreshInspoBtn');
            const origHtml = btn ? btn.innerHTML : '';
            if (btn) { btn.innerHTML = IC.refresh + ' Scraping inspo... (30-60s)'; btn.disabled = true; btn.style.opacity = '0.6'; }
            try {
                if (!sbClient) throw new Error('Supabase not connected');
                const { data, error } = await sbClient.functions.invoke('scrape-inspo', {
                    body: { uid: currentUser.uid }
                });
                if (error) throw new Error(error.message || JSON.stringify(error));
                if (btn) btn.innerHTML = IC.refresh + ' Updating...';
                setTimeout(() => setPage('inspo'), 1500);
            } catch(e) {
                alert('Refresh failed: ' + (e.message || JSON.stringify(e)));
                if (btn) { btn.innerHTML = origHtml; btn.disabled = false; btn.style.opacity = '1'; }
            }
        };
        window.signOut = async () => { await auth.signOut(); };
        window.openClientDetail = (uid) => { selectedClientDetail = uid; currentPage = 'clientDetail'; render(); };
        window.loadWeekForEdit = (key) => { selectedWeekKey = key; selectedDayIndex = null; setPage('numbers'); };
        window.deleteClient = async (uid) => {
            if (!confirm('Remove this client? They will lose access to the portal and see an "access revoked" message if they try to log in. You can re-enable them later from the admin panel.')) return;
            try {
                // Soft-disable: keep profile but mark as disabled, wipe their data
                await Promise.all([
                    db.ref(`portal/users/${uid}/disabled`).set(true),
                    db.ref(`portal/users/${uid}/disabledAt`).set(new Date().toISOString()),
                    db.ref(`portal/entries/${uid}`).remove(),
                    db.ref(`portal/tasks/${uid}`).remove(),
                    db.ref(`portal/content/${uid}`).remove()
                ]);
                selectedClientDetail = null;
                currentPage = 'clients';
                render();
            } catch (err) { alert('Error removing client: ' + err.message); }
        };

        window.reEnableClient = async (uid) => {
            if (!confirm('Re-enable this client? They will be able to log in and use the portal again.')) return;
            try {
                await Promise.all([
                    db.ref(`portal/users/${uid}/disabled`).remove(),
                    db.ref(`portal/users/${uid}/disabledAt`).remove()
                ]);
                render();
            } catch (err) { alert('Error re-enabling client: ' + err.message); }
        };

        // ── AUTH ──
        let accessRevoked = false;
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const snap = await db.ref(`portal/users/${user.uid}`).once('value');
                if (snap.exists()) {
                    const userData = snap.val();
                    if (userData.disabled) {
                        // Account has been disabled by admin
                        accessRevoked = true;
                        currentUser = null;
                        await auth.signOut();
                    } else {
                        accessRevoked = false;
                        currentUser = { uid: user.uid, ...userData };
                        db.ref(`portal/users/${user.uid}/lastLogin`).set(new Date().toISOString());
                    }
                } else if (user.email === 'timbrace14@gmail.com') {
                    const profile = { firstName: 'Tim', lastName: 'Brace', email: user.email, role: 'admin', createdAt: new Date().toISOString(), lastLogin: new Date().toISOString() };
                    await db.ref(`portal/users/${user.uid}`).set(profile);
                    currentUser = { uid: user.uid, ...profile };
                }
            } else { currentUser = null; }
            authLoading = false;
            render();
        });

        render();
    </script>
</body>
</html>
