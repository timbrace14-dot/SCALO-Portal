<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCALO Client Portal</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --bg-elevated: #0A0A0A;
            --bg-card: #111111;
            --bg-input: #1A1A1A;
            --border: rgba(255,255,255,0.08);
            --border-hover: rgba(255,255,255,0.15);
            --text-primary: #E6E8DA;
            --text-secondary: rgba(230,232,218,0.6);
            --text-muted: rgba(255,255,255,0.35);
            --accent: #B8E986;
            --accent-hover: #CDFF96;
            --accent-dim: rgba(184,233,134,0.15);
            --accent-glow: rgba(184,233,134,0.08);
            --red: #FF4533;
            --amber: #FBBF24;
            --green: #4ADE80;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { overflow-x: hidden; }

        body {
            font-family: 'Helvetica Neue', 'HelveticaNeue', Helvetica, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            font-weight: 500;
            letter-spacing: -0.015em;
            overflow-x: hidden;
        }

        #root { width: 100%; height: 100vh; overflow: hidden; }

        /* ── LOGIN ── */
        .auth-container { width: 100%; height: 100vh; display: flex; }

        .auth-left {
            width: 380px;
            background: linear-gradient(160deg, #0a1a0d 0%, #0a0f18 50%, #060618 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            flex-shrink: 0;
        }

        .auth-left-logo { height: 36px; width: auto; object-fit: contain; margin-bottom: 28px; }

        .auth-left-heading {
            color: #fff;
            font-size: 26px;
            text-align: center;
            margin-bottom: 12px;
            letter-spacing: -0.015em;
            font-weight: 700;
        }

        .auth-left-sub {
            color: rgba(255,255,255,0.35);
            font-size: 14px;
            text-align: center;
            line-height: 1.6;
            font-weight: 400;
        }

        .auth-right {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-elevated);
            padding: 40px;
        }

        .login-box { width: 100%; max-width: 360px; }
        .login-heading { font-size: 28px; margin-bottom: 8px; color: #FFFFFF; letter-spacing: -0.015em; font-weight: 700; }

        .login-subtext {
            color: rgba(255,255,255,0.56);
            font-size: 14px;
            margin-bottom: 32px;
            font-weight: 400;
        }

        /* ── PORTAL LAYOUT ── */
        .portal-layout { display: flex; height: 100vh; overflow: hidden; }

        .portal-sidebar {
            width: 220px;
            background: linear-gradient(180deg, var(--bg-card) 0%, var(--bg) 100%);
            display: flex;
            flex-direction: column;
            padding: 28px 16px 24px;
            flex-shrink: 0;
            overflow-y: auto;
        }

        .sidebar-logo { height: 22px; width: auto; object-fit: contain; margin-bottom: 36px; margin-left: 4px; }

        .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 2px; }

        .sidebar-nav-item {
            padding: 11px 14px;
            border-radius: 10px;
            cursor: pointer;
            color: rgba(255,255,255,0.4);
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            letter-spacing: -0.01em;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
            border-left: 3px solid transparent;
        }

        .sidebar-nav-item:hover {
            color: rgba(255,255,255,0.85);
            background: rgba(255,255,255,0.07);
        }

        .sidebar-nav-item.active {
            color: #fff;
            background: var(--accent-dim);
            border-left-color: var(--accent);
        }

        .sidebar-nav-icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .sidebar-nav-icon svg { width: 16px; height: 16px; }

        .sidebar-signout {
            margin-top: 16px;
            padding: 11px 14px;
            border-radius: 10px;
            cursor: pointer;
            color: rgba(255,255,255,0.22);
            font-size: 12px;
            font-weight: 700;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }

        .sidebar-signout:hover {
            color: rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.05);
        }

        /* ── CONTENT AREA ── */
        .portal-content-area {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 36px 40px;
            background: var(--bg-elevated);
            min-width: 0;
        }

        /* ── FORMS ── */
        .form-group { margin-bottom: 16px; text-align: left; }

        .form-label {
            font-size: 10px;
            color: rgba(255,255,255,0.45);
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        .form-input {
            width: 100%;
            background: var(--bg-input);
            border: 1.5px solid var(--border);
            color: var(--text-primary);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg-input);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }

        .error-message { color: var(--red); font-size: 13px; margin-top: 8px; min-height: 20px; font-weight: 400; }

        .btn-primary {
            width: 100%;
            background: var(--accent);
            border: none;
            color: #000;
            padding: 13px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 24px;
            font-family: inherit;
            letter-spacing: -0.01em;
        }

        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 6px 20px var(--accent-dim); }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
            width: 100%;
            font-family: inherit;
        }

        .btn-secondary:hover { background: rgba(255,255,255,0.06); }

        .btn-add {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 11px 20px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 20px;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-add:hover { background: var(--accent-hover); box-shadow: 0 4px 14px var(--accent-dim); }

        .btn-back {
            background: #1C1C1C;
            border: none;
            color: rgba(255,255,255,0.65);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            margin-bottom: 24px;
            font-weight: 700;
            font-family: inherit;
            transition: all 0.2s;
        }

        .btn-back:hover { background: #282828; }

        /* ── PAGE HEADERS ── */
        .page-title { font-size: 26px; color: #FFFFFF; margin-bottom: 6px; letter-spacing: -0.015em; font-weight: 700; }
        .page-subtitle { color: rgba(255,255,255,0.45); font-size: 13px; margin-bottom: 28px; font-weight: 400; letter-spacing: -0.015em; }
        .section-header { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.56); margin-top: 24px; margin-bottom: 14px; letter-spacing: 0.12em; text-transform: uppercase; }

        .greeting { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
        .greeting-text { font-size: 22px; color: #FFFFFF; letter-spacing: -0.015em; font-weight: 500; }

        .week-badge {
            background: var(--accent-dim);
            border: 1px solid rgba(184,233,134,0.25);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }

        /* ── CARDS (Glassmorphism) ── */
        .card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px 24px;
            margin-bottom: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.04);
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: var(--border-hover);
            box-shadow: 0 8px 32px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.06);
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .metric-card {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 18px 16px;
            text-align: center;
            box-shadow: 0 4px 24px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.06);
            transition: all 0.3s ease;
        }

        .metric-card:hover {
            border-color: rgba(255,255,255,0.18);
            transform: translateY(-3px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .metric-label { font-size: 9px; color: rgba(255,255,255,0.45); font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 8px; }
        .metric-value { font-size: 26px; font-weight: 700; color: #FFFFFF; margin-bottom: 6px; letter-spacing: -0.015em; }
        .metric-value.red { color: var(--red); }
        .metric-value.green { color: #4ADE80; }
        .sparkline-svg { width: 100%; height: 28px; margin-top: 4px; }

        /* ── INPUT FORM ── */
        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .num-field {
            width: 100%;
            background: #1C1C1C;
            border: 1.5px solid rgba(255,255,255,0.12);
            color: #FFFFFF;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            transition: all 0.2s;
        }

        .num-field:focus { outline: none; border-color: var(--accent); background: var(--bg-input); box-shadow: 0 0 0 3px var(--accent-dim); }

        /* ── TASKS ── */
        .task-item {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }

        .task-item:hover {
            border-color: rgba(255,255,255,0.16);
            box-shadow: 0 6px 28px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.07);
        }

        .task-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
        .task-title { font-size: 15px; font-weight: 700; color: #FFFFFF; }

        .task-due {
            background: rgba(255,69,51,0.12);
            color: #FF4533;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 11px;
            white-space: nowrap;
            font-weight: 700;
        }

        .task-description { color: rgba(255,255,255,0.56); font-size: 13px; margin-bottom: 12px; line-height: 1.5; font-weight: 400; }
        .checklist { margin-bottom: 12px; }
        .checklist-item { display: flex; gap: 10px; margin-bottom: 8px; align-items: center; }
        .checklist-checkbox { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); flex-shrink: 0; }
        .checklist-text { font-size: 13px; color: rgba(255,255,255,0.65); flex: 1; font-weight: 400; }
        .checklist-text.done { color: rgba(255,255,255,0.35); text-decoration: line-through; }
        .progress-bar { background: rgba(255,255,255,0.08); height: 8px; border-radius: 4px; overflow: hidden; margin-top: 8px; width: 100%; display: block; }
        .progress-fill { height: 8px; border-radius: 4px; transition: width 0.4s ease; display: block; }

        /* ── CLIENT GRID ── */
        .client-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .client-card {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 24px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.06);
        }

        .client-card:hover { border-color: rgba(255,255,255,0.18); transform: translateY(-3px); box-shadow: 0 8px 32px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.08); }

        .client-avatar {
            width: 46px;
            height: 46px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 14px;
            color: #fff;
        }

        .client-name { font-size: 15px; color: #FFFFFF; margin-bottom: 10px; }
        .client-metric { font-size: 12px; color: rgba(255,255,255,0.45); margin-bottom: 4px; font-weight: 400; }
        .client-metric-value { color: var(--accent); font-weight: 700; }

        /* ── CHARTS ── */
        .chart-card {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.06);
        }

        .chart-title { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.56); margin-bottom: 20px; letter-spacing: 0.1em; text-transform: uppercase; }

        /* ── MISC ── */
        .search-box {
            width: 100%;
            background: #1C1C1C;
            border: 1.5px solid rgba(255,255,255,0.12);
            color: #FFFFFF;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 14px;
            margin-bottom: 20px;
            font-family: inherit;
            font-weight: 400;
            transition: all 0.2s;
        }

        .search-box:focus { outline: none; border-color: var(--accent); background: var(--bg-input); box-shadow: 0 0 0 3px var(--accent-dim); }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: #1A1A1A;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 32px;
            width: 90%;
            max-width: 460px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 24px 60px rgba(0,0,0,0.12);
        }

        .modal-header { font-size: 20px; color: #FFFFFF; margin-bottom: 24px; }

        .empty-state { text-align: center; padding: 48px 20px; color: rgba(255,255,255,0.35); }
        .empty-state-icon { font-size: 42px; margin-bottom: 14px; }

        .textarea {
            width: 100%;
            background: #1C1C1C;
            border: 1.5px solid rgba(255,255,255,0.12);
            color: #FFFFFF;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
            transition: all 0.2s;
            font-weight: 400;
        }

        .textarea:focus { outline: none; border-color: var(--accent); background: var(--bg-input); box-shadow: 0 0 0 3px var(--accent-dim); }

        .loading { display: flex; align-items: center; justify-content: center; height: 100vh; font-size: 15px; color: rgba(255,255,255,0.35); background: #0A0A0A; }

        /* ── CONTENT LIBRARY ── */
        .content-card {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 24px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.06);
        }

        .content-card:hover { border-color: rgba(255,255,255,0.18); transform: translateX(3px); box-shadow: 0 8px 32px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.08); }

        .content-rank { font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.35); min-width: 40px; text-align: center; flex-shrink: 0; }
        .rank-gold { color: #D97706; }
        .rank-silver { color: #6B7280; }
        .rank-bronze { color: #92400E; }

        .content-body { flex: 1; min-width: 0; }

        .content-title {
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 6px;
            color: #FFFFFF;
        }

        .content-views { text-align: right; min-width: 65px; flex-shrink: 0; }
        .content-views-number { font-size: 22px; font-weight: 700; color: var(--accent); line-height: 1; }
        .content-views-label { font-size: 9px; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.12em; margin-top: 2px; }
        .content-delete-btn { background: none; border: none; color: rgba(255,255,255,0.35); font-size: 18px; cursor: pointer; padding: 0; line-height: 1; transition: color 0.2s; flex-shrink: 0; }
        .content-delete-btn:hover { color: var(--red); }

        .platform-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; white-space: nowrap; color: #fff; vertical-align: middle; }
        .platform-instagram { background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .platform-tiktok { background: #111; }
        .platform-youtube { background: #FF0000; }

        /* ── PORTAL TOPBAR ── */
        .portal-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .portal-topbar-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .portal-topbar-user {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 6px 10px 6px 6px;
            border-radius: 50px;
            transition: background 0.2s;
        }

        .portal-topbar-user:hover { background: rgba(255,255,255,0.06); }

        .portal-topbar-user span {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .user-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: #000;
            flex-shrink: 0;
            overflow: hidden;
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .avatar-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .avatar-modal {
            background: #111;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .avatar-modal-preview {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            margin: 0 auto 20px;
            overflow: hidden;
            background: rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--border);
        }

        .avatar-modal-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 900px) { .auth-left { width: 300px; } }

        @media (max-width: 640px) {
            .auth-left { display: none; }
            .portal-sidebar { width: 58px; padding: 20px 8px; align-items: center; }
            .sidebar-logo { margin-left: 0; margin-bottom: 24px; height: 14px; width: auto; }
            .sidebar-nav { flex: 0 !important; }
            .sidebar-nav-item { justify-content: center; padding: 10px; gap: 0; }
            .sidebar-nav-item .nav-label { display: none; }
            .sidebar-signout { justify-content: center; padding: 10px; gap: 0; flex-direction: column; margin-top: 24px; }
            .sidebar-signout .nav-label { display: block !important; font-size: 7px; letter-spacing: 0.05em; text-transform: uppercase; margin-top: 2px; }
            .portal-content-area { padding: 20px 12px; }
            .card-grid { grid-template-columns: repeat(2, 1fr) !important; }
            .client-grid { grid-template-columns: 1fr; }
            .card { padding: 16px 14px; }
            .metric-card { padding: 14px 10px; }
            .mobile-grid-2 { grid-template-columns: repeat(2, 1fr) !important; }
            .donut-canvas { width: 64px !important; height: 64px !important; }
            .form-input { font-size: 13px; padding: 10px 12px; max-width: 100%; }
            input[type="week"] { -webkit-appearance: none; max-width: 100%; width: 100% !important; }
            .portal-topbar { margin-bottom: 16px; padding-bottom: 12px; }
            .portal-topbar-title { font-size: 9px; }
            .portal-topbar-user span { font-size: 11px; }
            .user-avatar { width: 28px; height: 28px; font-size: 11px; }
            .avatar-modal { margin: 0 16px; padding: 24px 20px; }
        }
        /* ── IMPLEMENTATION CHECKLIST ── */
        .impl-level { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
        .impl-level-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; cursor: pointer; user-select: none; transition: background 0.2s; }
        .impl-level-header:hover { background: rgba(255,255,255,0.04); }
        .impl-level-title { font-size: 14px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 10px; }
        .impl-level-chevron { font-size: 12px; color: rgba(255,255,255,0.35); transition: transform 0.3s ease; display: inline-block; }
        .impl-level.open .impl-level-chevron { transform: rotate(90deg); }
        .impl-level-progress { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .impl-level-count { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.45); }
        .impl-level-bar { width: 80px; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
        .impl-level-bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }
        .impl-level-body { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; }
        .impl-level.open .impl-level-body { max-height: 4000px; }
        .impl-item { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-top: 1px solid rgba(255,255,255,0.05); transition: background 0.15s; }
        .impl-item:hover { background: rgba(255,255,255,0.03); }
        .impl-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: all 0.2s; font-size: 11px; color: transparent; }
        .impl-check:hover { border-color: rgba(255,255,255,0.4); }
        .impl-check.done { background: var(--accent); border-color: var(--accent); color: #000; }
        .impl-item-title { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.75); flex: 1; }
        .impl-item.done .impl-item-title { text-decoration: line-through; color: rgba(255,255,255,0.35); }
        .impl-item-link { font-size: 11px; color: var(--accent); text-decoration: none; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
        .impl-item-link:hover { text-decoration: underline; }
        .impl-section-label { padding: 10px 18px 4px; font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 0.1em; border-top: 1px solid rgba(255,255,255,0.05); }
        .impl-coming-soon { color: rgba(255,255,255,0.2); font-style: italic; font-size: 12px; padding: 10px 18px; }
        .impl-level.coming .impl-level-header { cursor: default; opacity: 0.5; }

        @media (max-width: 640px) {
            .impl-level-bar { width: 50px; }
            .impl-item { padding: 10px 14px; gap: 10px; }
            .impl-level-header { padding: 14px 14px; }
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>

        // ── PRINT HELPER (popup-blocker safe) ──
        const printHTMLContent = (html) => {
            const w = window.open('', '_blank');
            if (w) {
                w.document.write(html);
                w.document.close();
                setTimeout(() => w.print(), 500);
            } else {
                // Popup blocked — fallback to hidden iframe
                const iframe = document.createElement('iframe');
                iframe.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
                document.body.appendChild(iframe);
                iframe.contentDocument.write(html);
                iframe.contentDocument.close();
                setTimeout(() => {
                    try { iframe.contentWindow.print(); } catch(e) { alert('Please allow popups for this site to export PDFs.'); }
                    setTimeout(() => document.body.removeChild(iframe), 1000);
                }, 500);
            }
        };

        // ── AUTO-SCRAPE: trigger Supabase Edge Functions when data is stale ──
        const triggerScrapeReels = async (studentId) => {
            if (!sbClient) return;
            try {
                const { data, error } = await sbClient.functions.invoke('scrape-reels', {
                    body: studentId ? { student_id: studentId } : {}
                });
                if (error) console.warn('scrape-reels error:', error);
                else console.log('scrape-reels result:', data);
                return data;
            } catch(e) { console.warn('scrape-reels failed:', e); }
        };

        const triggerScrapeInspo = async (uid) => {
            if (!sbClient) return;
            try {
                const { data, error } = await sbClient.functions.invoke('scrape-inspo', {
                    body: uid ? { uid } : {}
                });
                if (error) console.warn('scrape-inspo error:', error);
                else console.log('scrape-inspo result:', data);
                return data;
            } catch(e) { console.warn('scrape-inspo failed:', e); }
        };

        // Check if content library data is stale (>24 hours since last scrape)
        const checkAndTriggerContentScrape = async (uid) => {
            if (!sbClient) return;
            try {
                const sbIdSnap = await db.ref(`portal/users/${uid}/supabaseStudentId`).once('value');
                const studentId = sbIdSnap.val();
                if (!studentId) return;

                const { data: videos } = await sbClient.from('videos')
                    .select('scraped_at')
                    .eq('student_id', studentId)
                    .order('scraped_at', { ascending: false })
                    .limit(1);

                if (videos && videos.length > 0 && videos[0].scraped_at) {
                    const lastScrape = new Date(videos[0].scraped_at);
                    const hoursSince = (Date.now() - lastScrape.getTime()) / (1000 * 60 * 60);
                    if (hoursSince > 24) {
                        console.log(`Content Library stale (${hoursSince.toFixed(1)}h) — triggering scrape...`);
                        await triggerScrapeReels(studentId);
                        // Refresh the page after scrape
                        setTimeout(() => { if (currentPage === 'content') setPage('content'); }, 3000);
                    }
                } else {
                    // No videos at all — trigger first scrape
                    console.log('No content library data — triggering first scrape...');
                    await triggerScrapeReels(studentId);
                    setTimeout(() => { if (currentPage === 'content') setPage('content'); }, 3000);
                }
            } catch(e) { console.warn('Auto-scrape check failed:', e); }
        };

        // Check if inspo data needs Monday refresh
        const checkAndTriggerInspoScrape = async (uid) => {
            try {
                const now = new Date();
                const isMonday = now.getDay() === 1;
                const currentWeekKey = getInspoWeekKey ? getInspoWeekKey() : getWeekKey();

                const snap = await db.ref(`portal/inspo_videos/${uid}/${currentWeekKey}`).once('value');
                const hasThisWeekData = snap.val() && Object.keys(snap.val()).length > 0;

                // Trigger if it's Monday and we don't have this week's data yet
                if (isMonday && !hasThisWeekData) {
                    console.log('Monday inspo scrape needed — triggering...');
                    await triggerScrapeInspo(uid);
                    setTimeout(() => { if (currentPage === 'inspo') setPage('inspo'); }, 5000);
                } else if (!hasThisWeekData) {
                    // Not Monday but still no data for this week
                    console.log('No inspo data for current week — triggering scrape...');

                    setTimeout(() => { if (currentPage === 'inspo') setPage('inspo'); }, 5000);

            } catch(e) { console.warn('Inspo auto-scrape check failed:', e); }

        // ── HELPERS ──
        const getWeekKey = () => {
            const d = new Date(), s = new Date(d.getFullYear(), 0, 1);
            const week = Math.ceil(((d - s) / 86400000 + s.getDay() + 1) / 7);
            return `${d.getFullYear()}_W${String(week).padStart(2, '0')}`;
        };

        const formatCurrency = (val) => val ? `£${(parseFloat(val) || 0).toLocaleString('en-GB', {maximumFractionDigits: 0})}` : '£0';

        const formatNumber = (val) => {
            if (!val && val !== 0) return '0';
            const num = parseFloat(val);
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 10000) return (num / 1000).toFixed(1) + 'K';
            return num.toLocaleString('en-GB');
        };

        const generateSparkline = (data, width = 100, height = 28) => {
            if (!data || data.length < 2) return '';
            const values = data.map(v => parseFloat(v) || 0);
            const max = Math.max(...values);
            const min = Math.min(...values);
            const range = max - min || 1;
            const pointWidth = width / (data.length - 1);
            let path = '';
            values.forEach((val, i) => {
                const x = i * pointWidth;
                const y = height - ((val - min) / range) * (height * 0.8) - (height * 0.1);
                path += (i === 0 ? 'M' : 'L') + x + ',' + y;
            });
            const fillPath = path + `L${(data.length-1)*pointWidth},${height}L0,${height}Z`;
            return `<svg class="sparkline-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none"><defs><linearGradient id="sparkGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${ACCENT}" stop-opacity="0.35"/><stop offset="100%" stop-color="${ACCENT}" stop-opacity="0"/></linearGradient></defs><path d="${fillPath}" fill="url(#sparkGrad)"/><path d="${path}" fill="none" stroke="${ACCENT}" stroke-width="2"/></svg>`;
        };

        const daysUntilDate = (dateStr) => {
            const due = new Date(dateStr);
            const now = new Date();
            const days = Math.ceil((due - now) / (1000 * 60 * 60 * 24));
            return days > 0 ? `in ${days}d` : days === 0 ? 'today' : `${Math.abs(days)}d ago`;

                    // Check if this UID was previously disabled
                    const existingSnap = await db.ref(`portal/users/${cred.user.uid}`).once('value');
                    if (existingSnap.exists() && existingSnap.val().disabled) {
                        accessRevoked = true;
                        await auth.signOut();
                        render();
                        return;
                    }
                    const isAdmin = email === 'timbrace14@gmail.com';
                    // Write profile to DB — non-blocking so login isn't stuck if DB isn't ready
                    db.ref(`portal/users/${cred.user.uid}`).set({
                        firstName, lastName, email,
                        role: isAdmin ? 'admin' : 'client',
                        createdAt: new Date().toISOString()
                    }).catch(() => {});
                } else {
                    const cred = await auth.signInWithEmailAndPassword(email, password);
                    // Check if account is disabled before onAuthStateChanged races
                    const userSnap = await db.ref(`portal/users/${cred.user.uid}`).once('value');
                    if (userSnap.exists() && userSnap.val().disabled) {
                        accessRevoked = true;
                        currentUser = null;
                        await auth.signOut();
                        authLoading = false;
                        render();
                        return;
                    }
                }

                const msg = err.message || 'Sign in failed';

            const snap = await db.ref(`portal/tasks/${currentUser.uid}`).once('value');
            const tasks = snap.val() || {};
            const taskList = Object.entries(tasks);
            const totalItems = taskList.reduce((sum, [, t]) => sum + Object.keys(t.checklist||{}).length, 0);
            const doneItems = taskList.reduce((sum, [, t]) => sum + Object.values(t.checklist||{}).filter(i=>i.done).length, 0);
            const overallPct = totalItems > 0 ? Math.round(doneItems / totalItems * 100) : 0;
            const allDone = taskList.length > 0 && overallPct === 100;
            const motivational = overallPct === 100 ? ['🏆 Champion!', 'Every task done. You\'re unstoppable.'] :
                overallPct >= 75 ? ['🔥 Almost there!', 'You\'re crushing it — finish strong.'] :
                overallPct >= 50 ? ['💪 Halfway done!', 'Great momentum — keep pushing.'] :
                overallPct >= 25 ? ['⚡ Getting started!', 'You\'ve made a start — now build on it.'] :
                ['🎯 Let\'s go!', 'Your coach set these to help you grow. Start now.'];

            return `
                <div>
                    <h2 class="page-title">Your Tasks</h2>
                    ${taskList.length > 0 ? `
                    <div id="taskBanner" class="card" style="margin-bottom:16px;background:linear-gradient(135deg,#1a0a0a,#0a0a1a);color:#fff;border:none;">
                        <div style="display:flex;justify-content:space-between;align-items:center;">
                            <div>
                                <div style="font-size:22px;font-weight:700;">${motivational[0]}</div>
                                <div style="font-size:13px;color:rgba(255,255,255,0.65);font-weight:400;margin-top:2px;">${motivational[1]}</div>
                            </div>
                            <div style="text-align:right;">
                                <div class="banner-pct" style="font-size:36px;font-weight:700;color:${overallPct===100?'#4ade80':'#FF4533'};">${overallPct}%</div>
                                <div class="banner-steps" style="font-size:11px;color:rgba(255,255,255,0.5);font-weight:400;">${doneItems}/${totalItems} steps</div>
                            </div>
                        </div>
                        <div style="margin-top:14px;height:6px;background:rgba(255,255,255,0.15);border-radius:3px;">
                            <div class="banner-fill" style="height:100%;width:${overallPct}%;background:${overallPct===100?'#4ade80':'#FF4533'};border-radius:3px;transition:width 0.5s;"></div>
                        </div>
                    </div>` : ''}

                    ${taskList.length === 0 ? `<div style="text-align:center;padding:60px 20px;">
                        <div style="font-size:48px;margin-bottom:12px;">📋</div>
                        <div style="font-size:16px;font-weight:700;color:rgba(255,255,255,0.65);">No tasks yet</div>
                        <div style="font-size:13px;color:rgba(255,255,255,0.45);font-weight:400;margin-top:6px;">Your coach will assign tasks to help you grow</div>
                    </div>` : ''}

                    ${taskList.map(([taskId, task]) => {
                        const checklist = task.checklist || {};
                        const items = Object.entries(checklist);
                        const doneCount = items.filter(([, item]) => item.done).length;
                        const pct = items.length > 0 ? Math.round(doneCount / items.length * 100) : 0;
                        const isComplete = pct === 100;
                        const isUrgent = task.dueDate && daysUntilDate(task.dueDate).includes('ago');
                        return `<div class="task-item" data-task-id="${taskId}" style="${isComplete?'opacity:0.75;':''}">
                            <div class="task-header">
                                <div style="flex:1;">
                                    <div style="display:flex;align-items:center;gap:8px;">
                                        <div class="task-title" style="${isComplete?'text-decoration:line-through;color:rgba(255,255,255,0.45);':''}">${task.title}</div>
                                        ${isComplete ? '<span style="font-size:11px;background:rgba(74,222,128,0.15);color:#4ADE80;padding:2px 8px;border-radius:20px;font-weight:700;">✓ Done</span>' : ''}
                                    </div>
                                    ${task.description ? `<div class="task-description">${task.description}</div>` : ''}
                                </div>
                                <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;">
                                    ${task.dueDate ? `<div class="task-due" style="${isUrgent?'background:rgba(255,69,51,0.12);color:#FF4533;':''}">${daysUntilDate(task.dueDate)}</div>` : ''}
                                    <div class="task-pct-label" style="font-size:15px;font-weight:700;color:${isComplete?'#4ADE80':pct>50?'#FBBF24':'#FF4533'};">${pct}%</div>
                                </div>
                            </div>
                            <div class="checklist">
                                ${items.map(([itemId, item]) => `
                                    <div class="checklist-item" style="${item.done?'opacity:0.6;':''}">
                                        <input type="checkbox" class="checklist-checkbox" data-task-id="${taskId}" data-item-id="${itemId}" ${item.done ? 'checked' : ''}>
                                        <span class="checklist-text ${item.done ? 'done' : ''}">${item.text}</span>
                                        ${item.done && item.doneAt ? `<span style="font-size:10px;color:rgba(255,255,255,0.45);font-weight:400;margin-left:auto;">✓ done</span>` : ''}
                                    </div>
                                `).join('')}
                            </div>
                            <div style="margin-top:10px;">
                                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                                    <span class="task-step-label" style="font-size:11px;color:rgba(255,255,255,0.45);font-weight:500;">${doneCount} of ${items.length} steps complete</span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width:${pct}%;background:${isComplete?'#4ADE80':pct>50?'#FBBF24':'#FF4533'};"></div>
                                </div>
                            </div>
                        </div>`;
                    }).join('')}
                </div>
            `;
        };

        const handleTaskChecklistChange = async (taskId, itemId, checked) => {
            try {
                await db.ref(`portal/tasks/${currentUser.uid}/${taskId}/checklist/${itemId}/done`).set(checked);
                if (checked) await db.ref(`portal/tasks/${currentUser.uid}/${taskId}/checklist/${itemId}/doneAt`).set(new Date().toISOString());

                // Real-time DOM update — no page reload
                const taskCard = document.querySelector(`[data-task-id="${taskId}"]`);
                if (!taskCard) return;
                const checkboxes = taskCard.querySelectorAll('.checklist-checkbox');
                const total = checkboxes.length;
                const done = Array.from(checkboxes).filter(c => c.checked).length;
                const pct = total > 0 ? Math.round(done / total * 100) : 0;
                const isComplete = pct === 100;
                const fill = taskCard.querySelector('.progress-fill');
                const pctLabel = taskCard.querySelector('.task-pct-label');
                const stepLabel = taskCard.querySelector('.task-step-label');
                const bar = taskCard.querySelector('.progress-bar');
                if (fill) { fill.style.width = pct + '%'; fill.style.background = isComplete ? '#4ADE80' : pct > 50 ? '#FBBF24' : '#FF4533'; }
                if (pctLabel) { pctLabel.textContent = pct + '%'; pctLabel.style.color = isComplete ? '#4ADE80' : pct > 50 ? '#FBBF24' : '#FF4533'; }
                if (stepLabel) stepLabel.textContent = done + ' of ' + total + ' steps complete';
                taskCard.style.borderColor = isComplete ? 'rgba(74,222,128,0.25)' : pct > 0 ? 'rgba(251,191,36,0.2)' : 'rgba(255,255,255,0.1)';

                // Update overall banner
                const allCheckboxes = document.querySelectorAll('.checklist-checkbox');
                const totalAll = allCheckboxes.length;
                const doneAll = Array.from(allCheckboxes).filter(c => c.checked).length;
                const overallPct = totalAll > 0 ? Math.round(doneAll / totalAll * 100) : 0;
                const banner = document.getElementById('taskBanner');
                if (banner) {
                    const bannerFill = banner.querySelector('.banner-fill');
                    const bannerPct = banner.querySelector('.banner-pct');
                    const bannerSteps = banner.querySelector('.banner-steps');
                    if (bannerFill) { bannerFill.style.width = overallPct + '%'; bannerFill.style.background = overallPct === 100 ? '#4ade80' : '#FF4533'; }
                    if (bannerPct) { bannerPct.textContent = overallPct + '%'; bannerPct.style.color = overallPct === 100 ? '#4ade80' : '#FF4533'; }
                    if (bannerSteps) bannerSteps.textContent = doneAll + '/' + totalAll + ' steps';
                }
            } catch (err) { console.error('Error updating task:', err); }
        };

        // ── CLIENT: IMPLEMENTATION CHECKLIST ──
        const renderClientImplementation = async () => {
            const snap = await db.ref('portal/implementation/' + currentUser.uid).once('value');
            const completions = snap.val() || {};
            const allItems = IMPLEMENTATION_MODULES.flatMap(m => m.items);
            const totalItems = allItems.length;
            const doneItems = allItems.filter(i => completions[i.id] === true).length;
            const overallPct = totalItems > 0 ? Math.round(doneItems / totalItems * 100) : 0;

            const renderLevel = (mod, idx) => {
                const isComing = mod.items.length === 0;
                if (isComing) return '<div class="impl-level coming"><div class="impl-level-header"><div class="impl-level-title"><span>&#x25B8;</span> ' + mod.title + '</div><div class="impl-coming-soon">Coming Soon</div></div></div>';
                const lvlDone = mod.items.filter(i => completions[i.id] === true).length;
                const lvlTotal = mod.items.length;
                const lvlPct = Math.round(lvlDone / lvlTotal * 100);
                const lvlColor = lvlPct === 100 ? '#4ADE80' : lvlPct >= 50 ? '#FBBF24' : '#FF4533';
                let lastSection = '';
                const itemsHtml = mod.items.map(item => {
                    const isDone = completions[item.id] === true;
                    let sectionHtml = '';
                    if (item.section && item.section !== lastSection) { sectionHtml = '<div class="impl-section-label">' + item.section + '</div>'; lastSection = item.section; }
                    else if (!item.section && lastSection) { lastSection = ''; }
                    return sectionHtml + '<div class="impl-item' + (isDone ? ' done' : '') + '" id="impl-item-' + item.id + '">' +
                        '<div class="impl-check' + (isDone ? ' done' : '') + '" id="impl-check-' + item.id + '" onclick="handleImplToggle(\'' + item.id + '\',' + !isDone + ')">&#x2713;</div>' +
                        '<div class="impl-item-title">' + item.title + '</div>' +
                        (item.url ? '<a href="' + item.url + '" target="_blank" rel="noopener" class="impl-item-link" onclick="event.stopPropagation()">Open &#x2192;</a>' : '') +
                    '</div>';
                }).join('');

                return '<div class="impl-level' + (idx === 0 ? ' open' : '') + '" id="impl-level-' + idx + '">' +
                    '<div class="impl-level-header" onclick="toggleImplLevel(' + idx + ')">' +
                        '<div class="impl-level-title"><span class="impl-level-chevron">&#x25B8;</span> ' + mod.title + '</div>' +
                        '<div class="impl-level-progress">' +
                            '<div class="impl-level-count" id="impl-count-' + idx + '">' + lvlDone + '/' + lvlTotal + '</div>' +
                            '<div class="impl-level-bar"><div class="impl-level-bar-fill" id="impl-bar-' + idx + '" style="width:' + lvlPct + '%;background:' + lvlColor + ';"></div></div>' +
                            '<div style="font-size:11px;font-weight:700;color:' + lvlColor + ';" id="impl-pct-' + idx + '">' + lvlPct + '%</div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="impl-level-body">' + itemsHtml + '</div>' +
                '</div>';
            };

            const bannerColor = overallPct === 100 ? '#4ADE80' : overallPct >= 50 ? '#FBBF24' : '#FF4533';

            return '<div>' +
                '<h2 class="page-title">Implementation Checklist</h2>' +
                '<p class="page-subtitle">Work through each level and mark lessons as done</p>' +
                '<div class="card" style="margin-bottom:20px;background:linear-gradient(135deg,#1a0a0a,#0a0a1a);border:none;">' +
                    '<div style="display:flex;justify-content:space-between;align-items:center;">' +
                        '<div><div style="font-size:13px;color:rgba(255,255,255,0.45);font-weight:400;">Overall Progress</div>' +
                        '<div id="implBannerSteps" style="font-size:11px;color:rgba(255,255,255,0.35);margin-top:2px;">' + doneItems + ' of ' + totalItems + ' tasks completed</div></div>' +
                        '<div id="implBannerPct" style="font-size:28px;font-weight:700;color:' + bannerColor + ';">' + overallPct + '%</div>' +
                    '</div>' +
                    '<div style="margin-top:12px;height:8px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden;">' +
                        '<div id="implBannerFill" style="height:100%;width:' + overallPct + '%;background:' + bannerColor + ';border-radius:4px;transition:width 0.5s;"></div>' +
                    '</div>' +
                '</div>' +
                IMPLEMENTATION_MODULES.map((m, i) => renderLevel(m, i)).join('') +
            '</div>';
        };

        window.toggleImplLevel = (idx) => {
            const el = document.getElementById('impl-level-' + idx);
            if (el && !el.classList.contains('coming')) el.classList.toggle('open');
        };

        window.handleImplToggle = async (itemId, checked) => {
            try {
                await db.ref('portal/implementation/' + currentUser.uid + '/' + itemId).set(checked || null);
                const itemEl = document.getElementById('impl-item-' + itemId);
                const checkEl = document.getElementById('impl-check-' + itemId);
                if (itemEl) { if (checked) itemEl.classList.add('done'); else itemEl.classList.remove('done'); }
                if (checkEl) {
                    if (checked) checkEl.classList.add('done'); else checkEl.classList.remove('done');
                    checkEl.setAttribute('onclick', "handleImplToggle('" + itemId + "'," + !checked + ")");
                }
                // Update level progress
                const allItems = IMPLEMENTATION_MODULES.flatMap(m => m.items);
                IMPLEMENTATION_MODULES.forEach((mod, idx) => {
                    if (mod.items.length === 0) return;
                    const lvlDone = mod.items.filter(i => {
                        const el = document.getElementById('impl-item-' + i.id);
                        return el && el.classList.contains('done');
                    }).length;
                    const lvlTotal = mod.items.length;
                    const lvlPct = Math.round(lvlDone / lvlTotal * 100);
                    const lvlColor = lvlPct === 100 ? '#4ADE80' : lvlPct >= 50 ? '#FBBF24' : '#FF4533';
                    const countEl = document.getElementById('impl-count-' + idx);
                    const barEl = document.getElementById('impl-bar-' + idx);
                    const pctEl = document.getElementById('impl-pct-' + idx);
                    if (countEl) countEl.textContent = lvlDone + '/' + lvlTotal;
                    if (barEl) { barEl.style.width = lvlPct + '%'; barEl.style.background = lvlColor; }
                    if (pctEl) { pctEl.textContent = lvlPct + '%'; pctEl.style.color = lvlColor; }
                });
                // Update overall banner
                const totalDone = allItems.filter(i => { const el = document.getElementById('impl-item-' + i.id); return el && el.classList.contains('done'); }).length;
                const totalAll = allItems.length;
                const overallPct = Math.round(totalDone / totalAll * 100);
                const bannerColor = overallPct === 100 ? '#4ADE80' : overallPct >= 50 ? '#FBBF24' : '#FF4533';
                const bannerPct = document.getElementById('implBannerPct');
                const bannerFill = document.getElementById('implBannerFill');
                const bannerSteps = document.getElementById('implBannerSteps');
                if (bannerPct) { bannerPct.textContent = overallPct + '%'; bannerPct.style.color = bannerColor; }
                if (bannerFill) { bannerFill.style.width = overallPct + '%'; bannerFill.style.background = bannerColor; }
                if (bannerSteps) bannerSteps.textContent = totalDone + ' of ' + totalAll + ' tasks completed';
            } catch (err) { console.error('Error updating implementation:', err); }
        };

        // ── PROGRESS ──
        let progressAllEntries = {};
        let progressViews = { revenue: 'month', rates: 'month', views: 'month', followers: 'month' };

        const buildChartData = (viewKey) => {
            if (viewKey === 'month') {
                // Last 8 weeks
                const result = [];
                for (let i = 7; i >= 0; i--) {
                    const d = new Date(); d.setDate(d.getDate() - i * 7);
                    const s = new Date(d.getFullYear(), 0, 1);
                    const week = Math.ceil(((d - s) / 86400000 + s.getDay() + 1) / 7);
                    const wk = `${d.getFullYear()}_W${String(week).padStart(2,'0')}`;
                    const monday = new Date(d); monday.setDate(d.getDate() - d.getDay() + 1);
                    const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
                    const fmt = dt => dt.toLocaleDateString('en-GB', { day:'numeric', month:'short' });
                    result.push({ label: `${fmt(monday)} - ${fmt(sunday)}`, ...getWeeklyTotals(progressAllEntries[wk]), ...(progressAllEntries[wk]||{}) });
                }
                return result;
            } else {
                // Last 12 calendar months — aggregate weekly entries by month
                const months = {};
                Object.entries(progressAllEntries).forEach(([wk, e]) => {
                    // Approximate month from week number
                    const year = parseInt(wk.split('_')[0]);
                    const weekNum = parseInt(wk.split('_W')[1]);
                    const d = new Date(year, 0, 1 + (weekNum - 1) * 7);
                    const monthKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
                    if (!months[monthKey]) months[monthKey] = { label: d.toLocaleDateString('en-GB',{month:'short',year:'2-digit'}), revenue:0,expenses:0,appointmentsAvailable:0,appointmentsFilled:0,rebookings:0,noShows:0,instagramViews:0,tiktokViews:0,instagramFollowers:0,tiktokFollowers:0 };
                    const m = months[monthKey];
                    const t = getWeeklyTotals(e);
                    m.revenue += t.revenue;
                    m.expenses += t.expenses;
                    m.appointmentsAvailable += t.appointmentsAvailable;
                    m.appointmentsFilled += t.appointmentsFilled;
                    m.rebookings += t.rebookings;
                    m.noShows += t.noShows;
                    m.instagramViews += parseFloat(e.instagramViews)||0;
                    m.tiktokViews += parseFloat(e.tiktokViews)||0;
                    m.instagramFollowers += parseFloat(e.instagramFollowers)||0;
                    m.tiktokFollowers += parseFloat(e.tiktokFollowers)||0;
                });
                const sorted = Object.entries(months).sort(([a],[b]) => a.localeCompare(b));
                return sorted.slice(-12).map(([, v]) => v);
            }
        };

        const drawChart = (chartId, viewKey) => {
            const canvasMap = { revenue:'chartRevenue', rates:'chartRates', views:'chartViews', followers:'chartFollowers' };
            const canvas = document.getElementById(canvasMap[chartId]);
            if (!canvas) return;
            const existing = Chart.getChart(canvas);
            if (existing) existing.destroy();
            const data = buildChartData(viewKey);
            const labels = data.map(w => w.label);
            const baseOpts = {
                responsive: true, animation: { duration: 600, easing: 'easeOutQuart' },
                plugins: { legend: { display: false }, tooltip: { backgroundColor: 'rgba(0,0,0,0.85)', titleFont: { size: 12, weight: '700', family: "'Helvetica Neue'" }, bodyFont: { size: 11, family: "'Helvetica Neue'" }, padding: 10, cornerRadius: 8, borderColor: 'rgba(255,255,255,0.08)', borderWidth: 1, callbacks: {} } },
                scales: {
                    x: { grid: { display: false }, border: { display: false }, ticks: { font: { size: 10, weight: '600', family: "'Helvetica Neue'" }, color: 'rgba(255,255,255,0.35)', maxRotation: 0 } },
                    y: { grid: { color: 'rgba(255,255,255,0.04)', lineWidth: 1 }, border: { display: false }, ticks: { font: { size: 10, family: "'Helvetica Neue'" }, color: 'rgba(255,255,255,0.35)' }, beginAtZero: true }
                }
            };
            // Gradient plugin for ALL bar charts
            const gradientBarPlugin = {
                id: 'gradientBar',
                beforeDatasetsDraw(chart) {
                    if (chart.config.type !== 'bar') return;
                    const { ctx, chartArea } = chart;
                    if (!chartArea) return;
                    const { top, bottom } = chartArea;
                    chart.data.datasets.forEach((ds, dsi) => {
                        const meta = chart.getDatasetMeta(dsi);
                        meta.data.forEach((bar, i) => {
                            const baseColor = ds._gradientColors ? (ds._gradientColors[i] || ds._gradientColors[0]) : (Array.isArray(ds.backgroundColor) ? ds.backgroundColor[i] : ds.backgroundColor);
                            if (!baseColor || typeof baseColor !== 'string') return;
                            const grad = ctx.createLinearGradient(0, top, 0, bottom);
                            const fadeColor = baseColor.length === 9 ? baseColor.slice(0,7) + '08' : baseColor.length === 7 ? baseColor + '08' : 'rgba(0,0,0,0.02)';
                            grad.addColorStop(0, baseColor);
                            grad.addColorStop(0.7, baseColor.length >= 7 ? baseColor.slice(0,7) + '40' : baseColor);
                            grad.addColorStop(1, fadeColor);
                            bar.options.backgroundColor = grad;
                        });
                    });
                }
            };
            Chart.register(gradientBarPlugin);
            const barDs = (d, color) => [{ data:d, backgroundColor: d.map((v,i)=>i===d.length-1?color:color+'66'), _gradientColors: d.map((v,i)=>i===d.length-1?color:color+'66'), borderRadius:6, borderSkipped:false, borderWidth: 0, hoverBackgroundColor: color }];
            if (chartId === 'revenue') {
                new Chart(canvas, { type:'bar', data:{ labels, datasets: barDs(data.map(w=>w.revenue||0),ACCENT) }, options:{ ...baseOpts, plugins:{ ...baseOpts.plugins, tooltip:{ callbacks:{ label: ctx=>' £'+ctx.raw.toLocaleString('en-GB') } } } } });
            } else if (chartId === 'rates') {
                new Chart(canvas, { type:'bar', data:{ labels, datasets:[
                    { label:'Occupancy %', data: data.map(w=>w.appointmentsAvailable>0?Math.round(w.appointmentsFilled/w.appointmentsAvailable*100):0), backgroundColor:ACCENT+'99', borderRadius:4 },
                    { label:'Rebook %', data: data.map(w=>w.appointmentsFilled>0?Math.round(w.rebookings/w.appointmentsFilled*100):0), backgroundColor:'#4ADE8099', borderRadius:4 }
                ]}, options:{ ...baseOpts, plugins:{ legend:{ display:true, position:'top', labels:{ font:{size:11,weight:'700'}, color:'rgba(255,255,255,0.65)', boxWidth:12 } }, tooltip:{ callbacks:{ label: ctx=>' '+ctx.dataset.label+': '+ctx.raw+'%' } } }, scales:{ ...baseOpts.scales, y:{ ...baseOpts.scales.y, max:100 } } } });
            } else if (chartId === 'views') {
                new Chart(canvas, { type:'bar', data:{ labels, datasets: barDs(data.map(w=>(w.instagramViews||0)+(w.tiktokViews||0)),'#6366F1') }, options:{ ...baseOpts, plugins:{ ...baseOpts.plugins, tooltip:{ callbacks:{ label: ctx=>' '+ctx.raw.toLocaleString('en-GB')+' views' } } } } });
            } else if (chartId === 'followers') {
                new Chart(canvas, { type:'bar', data:{ labels, datasets: barDs(data.map(w=>(w.instagramFollowers||0)+(w.tiktokFollowers||0)),'#0EA5E9') }, options:{ ...baseOpts, plugins:{ ...baseOpts.plugins, tooltip:{ callbacks:{ label: ctx=>' +'+ctx.raw.toLocaleString('en-GB')+' followers' } } } } });
            }
        };

        window.setProgressView = (chartId, viewKey) => {
            progressViews[chartId] = viewKey;
            drawChart(chartId, viewKey);
            // Update toggle buttons for this chart
            document.querySelectorAll(`[data-progress-chart="${chartId}"]`).forEach(btn => {
                const v = btn.dataset.progressView;
                btn.style.background = v === viewKey ? ACCENT : '#1A1A1A';
                btn.style.color = v === viewKey ? '#fff' : '#888';
            });
        };

        const renderClientProgress = async () => {
            const snap = await db.ref(`portal/entries/${currentUser.uid}`).once('value');
            progressAllEntries = snap.val() || {};
            const hasData = Object.keys(progressAllEntries).length > 0;

            const toggles = (chartId) => ['month','year'].map(v =>
                `<button data-progress-chart="${chartId}" data-progress-view="${v}" onclick="setProgressView('${chartId}','${v}')" style="padding:5px 14px;border-radius:20px;border:none;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.2s;background:${progressViews[chartId]===v?ACCENT:'#1A1A1A'};color:${progressViews[chartId]===v?'#fff':'rgba(255,255,255,0.56)'};">${v==='month'?'Month':'Year'}</button>`
            ).join('');

            const chartCard = (id, title, chartId) => `
                <div class="chart-card">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                        <div class="chart-title" style="margin-bottom:0;">${title}</div>
                        <div style="display:flex;gap:6px;">${toggles(chartId)}</div>
                    </div>
                    <canvas id="${id}" height="120"></canvas>
                </div>`;

            return `
                <div>
                    <h2 class="page-title">Analytics</h2>
                    <p class="page-subtitle">Track your growth over time</p>

        const renderAdminAddClient = () => `

                                <tr style="border-bottom:1px solid rgba(255,255,255,0.1);text-align:left;">
                                    <th style="padding:10px 12px;color:rgba(255,255,255,0.45);font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;">Name</th>
                                    <th style="padding:10px 12px;color:rgba(255,255,255,0.45);font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;">Email</th>
                                    <th style="padding:10px 12px;color:rgba(255,255,255,0.45);font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;">Start Date</th>
                                    <th style="padding:10px 12px;color:rgba(255,255,255,0.45);font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;">End Date</th>
                                    <th style="padding:10px 12px;color:rgba(255,255,255,0.45);font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;">Days Left</th>
                                    <th style="padding:10px 12px;color:rgba(255,255,255,0.45);font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;">Status</th>
                                    <th style="padding:10px 12px;color:rgba(255,255,255,0.45);font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${clientRows.map(c => `
                                    <tr style="border-bottom:1px solid rgba(255,255,255,0.05);" id="crm-row-${c.uid}">
                                        <td style="padding:12px;font-weight:700;color:#fff;">${c.name}</td>
                                        <td style="padding:12px;color:rgba(255,255,255,0.5);font-size:12px;">${c.email}</td>
                                        <td style="padding:12px;color:rgba(255,255,255,0.6);">${c.startDate ? c.startDate.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }) : '&#x2014;'}</td>
                                        <td style="padding:12px;color:rgba(255,255,255,0.6);">${c.endDate ? c.endDate.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }) : '&#x2014;'}</td>
                                        <td style="padding:12px;font-weight:700;color:${c.statusColor};">${c.daysRemaining !== null ? c.daysRemaining : '&#x2014;'}</td>
                                        <td style="padding:12px;"><span style="display:inline-block;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;color:${c.statusColor};background:${c.statusBg};">${c.statusLabel}</span></td>
                                        <td style="padding:12px;white-space:nowrap;">
                                            <button onclick="toggleCrmEditDates('${c.uid}','${c.startRaw || ''}','${c.endRaw || ''}')" style="background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.7);border:none;padding:6px 10px;border-radius:6px;font-weight:700;font-size:11px;cursor:pointer;font-family:inherit;margin-right:6px;">${IC.pencil} Edit Dates</button>
                                            ${c.daysRemaining !== null && c.daysRemaining <= 30 ? `<a href="mailto:${c.email}?subject=${renewalSubject}&body=${renewalBody(c.name.split(' ')[0])}" style="background:rgba(255,69,51,0.15);color:#FF4533;border:none;padding:6px 10px;border-radius:6px;font-weight:700;font-size:11px;cursor:pointer;font-family:inherit;text-decoration:none;">${IC.mail} Renewal</a>` : ''}
                                        </td>
                                    </tr>
                                    <tr id="crm-edit-${c.uid}" style="display:none;">
                                        <td colspan="7" style="padding:12px;background:rgba(255,255,255,0.02);">
                                            <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
                                                <label style="font-size:10px;color:rgba(255,255,255,0.45);font-weight:700;letter-spacing:0.1em;text-transform:uppercase;">Start
                                                    <input type="date" id="crm-start-${c.uid}" value="${c.startRaw || ''}" style="display:block;margin-top:4px;background:#1A1A1A;border:1.5px solid rgba(255,255,255,0.12);color:#fff;border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;">
                                                </label>
                                                <label style="font-size:10px;color:rgba(255,255,255,0.45);font-weight:700;letter-spacing:0.1em;text-transform:uppercase;">End
                                                    <input type="date" id="crm-end-${c.uid}" value="${c.endRaw || ''}" style="display:block;margin-top:4px;background:#1A1A1A;border:1.5px solid rgba(255,255,255,0.12);color:#fff;border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;">
                                                </label>
                                                <button onclick="saveCrmDates('${c.uid}')" style="background:${ACCENT};color:#000;border:none;padding:8px 16px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;margin-top:16px;">Save</button>
                                                <button onclick="document.getElementById('crm-edit-${c.uid}').style.display='none'" style="background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.5);border:none;padding:8px 12px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;margin-top:16px;">Cancel</button>
                                            </div>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        };

        window.toggleCrmEditDates = (uid, startVal, endVal) => {
            const row = document.getElementById('crm-edit-' + uid);
            if (!row) return;
            row.style.display = row.style.display === 'none' ? 'table-row' : 'none';
        };

        window.saveCrmDates = async (uid) => {
            const startVal = document.getElementById('crm-start-' + uid).value;
            const endVal = document.getElementById('crm-end-' + uid).value;
            const updates = {};
            if (startVal) updates['programmeStart'] = startVal;
            else updates['programmeStart'] = null;
            if (endVal) updates['programmeEnd'] = endVal;
            else updates['programmeEnd'] = null;
            await db.ref('portal/users/' + uid).update(updates);
            render();
        };

        // ── AVATAR UPLOAD ──
        window.openAvatarModal = () => {
            const container = document.getElementById('avatarModalContainer');
            if (!container) return;
            const initials = ((currentUser.firstName||'?')[0] + (currentUser.lastName||'?')[0]).toUpperCase();
            const previewHtml = currentUser.profilePicture
                ? '<img id="avatarPreviewImg" src="' + currentUser.profilePicture + '" alt="">'
                : '<div id="avatarPreviewInitials" style="font-size:28px;font-weight:700;color:rgba(255,255,255,0.35);">' + initials + '</div>';
            container.innerHTML = '<div class="avatar-modal-overlay" onclick="closeAvatarModal(event)">' +
                '<div class="avatar-modal" onclick="event.stopPropagation()">' +
                    '<div style="font-size:16px;font-weight:700;color:#fff;margin-bottom:4px;">Profile Picture</div>' +
                    '<div style="font-size:12px;color:rgba(255,255,255,0.45);margin-bottom:20px;">Upload a photo to personalise your portal</div>' +
                    '<div class="avatar-modal-preview" id="avatarModalPreview">' + previewHtml + '</div>' +
                    '<label style="display:inline-block;background:' + ACCENT + ';color:#000;border:none;padding:10px 20px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;">' +
                        'Choose Photo' +
                        '<input type="file" accept="image/*" onchange="handleAvatarUpload(event)" style="display:none;">' +
                    '</label>' +
                    (currentUser.profilePicture ? '<button onclick="removeAvatar()" style="display:block;margin:12px auto 0;background:none;border:none;color:rgba(255,255,255,0.4);font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;">Remove photo</button>' : '') +
                    '<button onclick="closeAvatarModal()" style="display:block;margin:16px auto 0;background:rgba(255,255,255,0.06);border:none;color:rgba(255,255,255,0.6);padding:8px 20px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;">Close</button>' +
                '</div>' +
            '</div>';
        };

        window.closeAvatarModal = (e) => {
            if (e && e.target !== e.currentTarget) return;
            const container = document.getElementById('avatarModalContainer');
            if (container) container.innerHTML = '';
        };

        window.handleAvatarUpload = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = async () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 128;
                    canvas.height = 128;
                    const ctx = canvas.getContext('2d');
                    const size = Math.min(img.width, img.height);
                    const sx = (img.width - size) / 2;
                    const sy = (img.height - size) / 2;
                    ctx.drawImage(img, sx, sy, size, size, 0, 0, 128, 128);
                    const base64 = canvas.toDataURL('image/jpeg', 0.8);
                    try {
                        await db.ref('portal/users/' + currentUser.uid + '/profilePicture').set(base64);
                        currentUser.profilePicture = base64;
                        closeAvatarModal();
                        render();
                    } catch (err) { alert('Error saving photo: ' + err.message); }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        window.removeAvatar = async () => {
            try {
                await db.ref('portal/users/' + currentUser.uid + '/profilePicture').remove();
                currentUser.profilePicture = null;
                closeAvatarModal();
                render();
            } catch (err) { alert('Error removing photo: ' + err.message); }
        };

        // ── ADMIN: TASKS ──
        const renderAdminTasks = async () => {
            const snap = await db.ref('portal/users').once('value');
            const users = snap.val() || {};
            const clientUsers = Object.entries(users).filter(([, u]) => u.role === 'client' && !u.disabled);
            return `
                <div>
                    <h2 class="page-title">Manage Tasks</h2>
                    <p class="page-subtitle">Assign and track client tasks</p>
                    <div class="card">

                        <div class="form-group"><label class="form-label">Select Client</label>
