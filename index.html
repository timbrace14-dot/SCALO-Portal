                // Most likely cause: database.rules.json hasn't been deployed yet with the new
                // "leave" path. Don't break the rest of the portal — just disable leave-awareness.
                console.warn('Leave dates unavailable (deploy database.rules.json?):', err.message);
                leaveDatesCache = {};
            }
            return leaveDatesCache;
        };
        const isLeaveDay = (dateStr) => !!leaveDatesCache[dateStr];
        // Returns local-time YYYY-MM-DD for the given weekKey + dayIdx (0=Mon ... 6=Sun)
        const dayDateString = (weekKey, dayIdx) => {
            const monday = getMondayOfWeek(weekKey);
            const d = new Date(monday);
            d.setDate(monday.getDate() + dayIdx);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };
        const isDayLeave = (weekKey, dayIdx) => isLeaveDay(dayDateString(weekKey, dayIdx));
        // Count leave days in a given week
        const getLeaveDayCount = (weekKey) => {
            if (!weekKey) return 0;
            let count = 0;
            for (let i = 0; i < 7; i++) if (isDayLeave(weekKey, i)) count++;
            return count;
        };

        // Helper: normalize entry data — returns weekly totals from either old (flat) or new (days) format.
        // If weekKey is provided, days marked as leave are skipped entirely.
        const getWeeklyTotals = (entry, weekKey) => {
            if (!entry) return { appointmentsAvailable:0, appointmentsFilled:0, newClients:0, rebookings:0, noShows:0, hoursWorked:0, avgTicketPrice:0, revenue:0, businessExpenses:0, personalExpenses:0, expenses:0 };
            // New format: has a "days" property
            if (entry.days) {
                const totals = { appointmentsAvailable:0, appointmentsFilled:0, newClients:0, rebookings:0, noShows:0, hoursWorked:0, avgTicketPrice:0, revenue:0, businessExpenses:0, personalExpenses:0 };
                let avgTicketSum = 0, avgTicketCount = 0;
                for (let i = 0; i < 7; i++) {
                    if (weekKey && isDayLeave(weekKey, i)) continue;
                    const day = entry.days[i];
                    if (!day) continue;
                    FIELD_KEYS.forEach(key => {
                        if (key === 'avgTicketPrice') {
                            const val = parseFloat(day[key]);
                            if (val) { avgTicketSum += val; avgTicketCount++; }
                        } else {
                            totals[key] += parseFloat(day[key]) || 0;
                        }
                    });
                    // Backwards compat: old "expenses" field maps to businessExpenses
                    if (day.expenses && !day.businessExpenses) totals.businessExpenses += parseFloat(day.expenses) || 0;
                }
                totals.avgTicketPrice = avgTicketCount > 0 ? avgTicketSum / avgTicketCount : 0;
                totals.expenses = totals.businessExpenses + totals.personalExpenses;
                return totals;
            }
            // Old format: flat weekly data. If the entire week is on leave, treat as zero.
            if (weekKey && getLeaveDayCount(weekKey) === 7) {
                return { appointmentsAvailable:0, appointmentsFilled:0, newClients:0, rebookings:0, noShows:0, hoursWorked:0, avgTicketPrice:0, revenue:0, businessExpenses:0, personalExpenses:0, expenses:0 };
            }
            const result = {};
            FIELD_KEYS.forEach(key => { result[key] = parseFloat(entry[key]) || 0; });
            // Backwards compat: old "expenses" field maps to businessExpenses
            if (entry.expenses && !entry.businessExpenses) result.businessExpenses = parseFloat(entry.expenses) || 0;
            result.expenses = result.businessExpenses + result.personalExpenses;
            return result;
        };

        // Helper: check if entry uses new daily format
        const isDailyFormat = (entry) => entry && entry.days !== undefined;

        // Helper: count filled days in a daily-format entry. Leave days are NOT counted as filled.
        const getFilledDayCount = (entry, weekKey) => {
            if (!entry || !entry.days) return 0;
            let count = 0;
            for (let i = 0; i < 7; i++) {
                if (weekKey && isDayLeave(weekKey, i)) continue;
                const day = entry.days[i];
                if (day && FIELD_KEYS.some(k => day[k] !== undefined && day[k] !== null && day[k] !== '')) count++;
            }
            return count;
        };

        const getWeekOptions = () => {
            const options = [];
            for (let i = 0; i < 12; i++) {
                const d = new Date();
                d.setDate(d.getDate() - i * 7);
                const s = new Date(d.getFullYear(), 0, 1);
                const week = Math.ceil(((d - s) / 86400000 + s.getDay() + 1) / 7);
                const wk = `${d.getFullYear()}_W${String(week).padStart(2, '0')}`;
                const monday = new Date(d);
                monday.setDate(d.getDate() - d.getDay() + 1);
                const sunday = new Date(monday);
                sunday.setDate(monday.getDate() + 6);
                const fmt = (dt) => dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
                const label = i === 0 ? `This week (${fmt(monday)} – ${fmt(sunday)})` : `${fmt(monday)} – ${fmt(sunday)}`;
                options.push({ key: wk, label });
            }
            return options;
        };

        const weekKeyFromInput = (val) => {
            return val.replace('-W', '_W').replace('-', '_W');
        };
        const weekInputFromKey = (key) => {
            return key.replace('_W', '-W');
        };

        // ── GOALS PAGE ──
        const renderClientGoals = async () => {
            const goalsSnap = await db.ref(`portal/goals/${currentUser.uid}`).once('value');
            const goals = goalsSnap.val() || {};
            return `
                <div>
                    <h2 class="page-title">Your Goals</h2>
                    <p class="page-subtitle">Write it down. Make it real.</p>

                    <div style="background:#0f0f0f;border:0.5px solid #2a2a2a;border-radius:16px;padding:28px 24px;margin-bottom:24px;">
                        <div style="margin-bottom:18px;">
                            <label style="display:block;font-size:11px;color:#f5c842;text-transform:uppercase;letter-spacing:-0.015em;font-weight:700;margin-bottom:4px;">Your Why</label>
                            <div style="font-size:12px;color:#777;letter-spacing:-0.015em;margin-bottom:8px;">The deeper reason you started this — the life you want to build.</div>
                            <textarea id="goalWhy" rows="3" style="width:100%;box-sizing:border-box;background:#1a1a1a;border:0.5px solid #333;border-radius:8px;color:#e8e8e8;padding:12px;font-family:'Helvetica Neue',Helvetica,sans-serif;font-size:14px;letter-spacing:-0.015em;resize:vertical;outline:none;transition:border-color 0.2s;" onfocus="this.style.borderColor='#f5c842'" onblur="this.style.borderColor='#333'">${goals.why || ''}</textarea>
                        </div>

                        <div style="margin-bottom:18px;">
                            <label style="display:block;font-size:11px;color:#f5c842;text-transform:uppercase;letter-spacing:-0.015em;font-weight:700;margin-bottom:4px;">Your How</label>
                            <div style="font-size:12px;color:#777;letter-spacing:-0.015em;margin-bottom:8px;">The specific actions and numbers that will get you there.</div>
                            <textarea id="goalHow" rows="3" style="width:100%;box-sizing:border-box;background:#1a1a1a;border:0.5px solid #333;border-radius:8px;color:#e8e8e8;padding:12px;font-family:'Helvetica Neue',Helvetica,sans-serif;font-size:14px;letter-spacing:-0.015em;resize:vertical;outline:none;transition:border-color 0.2s;" onfocus="this.style.borderColor='#f5c842'" onblur="this.style.borderColor='#333'">${goals.how || ''}</textarea>
                        </div>

                        <div style="border-top:0.5px solid #222;margin:20px 0;"></div>

                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;" class="mobile-grid-2">
                            <div style="background:#1a1a1a;border:0.5px solid #2a2a2a;border-radius:10px;padding:16px;">
                                <label style="display:block;font-size:10px;color:#f5c842;text-transform:uppercase;letter-spacing:-0.015em;font-weight:700;font-family:'Helvetica Neue',Helvetica,sans-serif;margin-bottom:10px;">90-Day Goal</label>
                                <textarea id="goal90" rows="4" style="width:100%;box-sizing:border-box;background:transparent;border:none;border-bottom:0.5px solid #333;color:#e8e8e8;padding:8px 0;font-family:'Helvetica Neue',Helvetica,sans-serif;font-size:14px;letter-spacing:-0.015em;resize:vertical;outline:none;transition:border-color 0.2s;" onfocus="this.style.borderBottomColor='#f5c842'" onblur="this.style.borderBottomColor='#333'">${goals.goal90 || ''}</textarea>
                            </div>
                            <div style="background:#1a1a1a;border:0.5px solid #2a2a2a;border-radius:10px;padding:16px;">
                                <label style="display:block;font-size:10px;color:#f5c842;text-transform:uppercase;letter-spacing:-0.015em;font-weight:700;font-family:'Helvetica Neue',Helvetica,sans-serif;margin-bottom:10px;">6-Month Goal</label>
                                <textarea id="goal6m" rows="4" style="width:100%;box-sizing:border-box;background:transparent;border:none;border-bottom:0.5px solid #333;color:#e8e8e8;padding:8px 0;font-family:'Helvetica Neue',Helvetica,sans-serif;font-size:14px;letter-spacing:-0.015em;resize:vertical;outline:none;transition:border-color 0.2s;" onfocus="this.style.borderBottomColor='#f5c842'" onblur="this.style.borderBottomColor='#333'">${goals.goal6m || ''}</textarea>
                            </div>
                        </div>

                        <div style="display:flex;align-items:center;gap:14px;">
                            <button onclick="saveGoals()" style="background:#f5c842;color:#0f0f0f;border:none;padding:10px 22px;border-radius:8px;font-family:'Helvetica Neue',Helvetica,sans-serif;font-size:13px;font-weight:700;letter-spacing:-0.015em;cursor:pointer;transition:opacity 0.2s;" onmouseover="this.style.opacity='0.85'" onmouseout="this.style.opacity='1'">Save Goals</button>
                            <span id="goalsSavedMsg" style="font-size:13px;color:#4ADE80;font-weight:700;opacity:0;transition:opacity 0.4s;"></span>
                        </div>
                    </div>
                </div>
            `;
        };

        // ── DAILY FIVE CHALLENGE ──
        const DF_LENGTH = 90;
        const DF_ITEMS = [
            { key: 'content',    label: 'Posted one piece of content',           detail: 'A reel or post — anything that goes on the grid.' },
            { key: 'ctaStories', label: 'Posted 3 CTA stories',                  detail: 'Drive booking traffic — DM "fade", link in bio, polls.' },
            { key: 'numbers',    label: "Logged today's numbers",                detail: 'Auto-ticks once you fill in today on the Daily Log.' },
            { key: 'followUps',  label: 'Followed up with 5 rebook-due clients', detail: 'Voice note, DM, anything that asks for the rebook.' },
            { key: 'roadmap',    label: 'Watched 20 min of a Roadmap step',      detail: 'Stay sharp. Stay learning.' },
        ];
        const DF_MODES = {
            hard:      { label: '75 Hard Mode',  short: 'Hard',       tagline: 'Miss one box, restart at day 1.',                       blurb: 'For students who want maximum discipline. Any missed day, no matter why, resets the entire challenge.' },
            twostrike: { label: 'Two-Strike Mode', short: 'Two-Strike', tagline: 'Two free misses across 90 days, then restart.',          blurb: 'A bit of buffer for life. Two missed days are forgiven. The third resets you to day 1.' },
            streak:    { label: 'Streak Mode',   short: 'Streak',     tagline: 'Miss a day → current streak resets, totals stay.',     blurb: 'Most forgiving. You never lose your total days complete or your best-ever streak — only your current run.' },
        };
        const DF_MODE_RANK = { hard: 3, twostrike: 2, streak: 1 };

        // Helper: local-time YYYY-MM-DD for a Date
        const df_iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

        // Helper: 1-indexed day number of the challenge (today minus startDate + 1)
        const df_dayNumber = (startStr, todayStr) => {
            const start = new Date(startStr + 'T00:00:00');
            const today = new Date(todayStr + 'T00:00:00');
            return Math.floor((today - start) / 86400000) + 1;
        };

        // Helper: list of YYYY-MM-DD strings from startDate for `count` days
        const df_dateRange = (startStr, count) => {
            const out = [];
            const start = new Date(startStr + 'T00:00:00');
            for (let i = 0; i < count; i++) {
                const d = new Date(start);
                d.setDate(start.getDate() + i);
                out.push(df_iso(d));
            }
            return out;
        };

        // Helper: does the Daily Log have ANY data logged for this date? Used to auto-tick "numbers"
        const df_hasNumbersFor = (entries, dateStr) => {
            const d = new Date(dateStr + 'T00:00:00');
            const dow = d.getDay() || 7;
            const monday = new Date(d);
            monday.setDate(d.getDate() - (dow - 1));
            const yearStart = new Date(monday.getFullYear(), 0, 1);
            const weekNum = Math.ceil(((monday - yearStart) / 86400000 + yearStart.getDay() + 1) / 7);
            const weekKey = `${monday.getFullYear()}_W${String(weekNum).padStart(2, '0')}`;
            const dayIdx = dow - 1;
            const entry = entries && entries[weekKey];
            if (!entry || !entry.days || !entry.days[dayIdx]) return false;
            return FIELD_KEYS.some(k => entry.days[dayIdx][k] !== undefined && entry.days[dayIdx][k] !== null && entry.days[dayIdx][k] !== '');
        };

        // Helper: day is "complete" if all 5 boxes are ticked (numbers auto-derived from Daily Log)
        const df_isDayComplete = (dayData, autoNumbers) => {
            const d = dayData || {};
            return !!(d.content && d.ctaStories && (autoNumbers || d.numbers) && d.followUps && d.roadmap);
        };

        // Helper: load daily-five state. Returns {} if rule not published yet (graceful fallback).
        const df_load = async () => {
            try {
                const snap = await db.ref(`portal/dailyfive/${currentUser.uid}`).once('value');
                return snap.val() || {};
            } catch (err) {
                console.warn('Daily Five unavailable (deploy database.rules.json?):', err.message);
                return null; // null signals "not configured" — UI shows a hint
            }
        };

        // Compute the rolling challenge stats from the saved data + the current Daily Log entries
        const df_computeStats = (df, entries, todayStr) => {
            const days = (df && df.days) || {};
            if (!df || !df.startDate || !df.mode) return null;
            const allDates = df_dateRange(df.startDate, DF_LENGTH);
            let currentStreak = 0, bestStreak = 0, totalComplete = 0, missesUsed = 0, failed = false;
            const dayStatus = {};
            for (const dateStr of allDates) {
                if (dateStr > todayStr) { dayStatus[dateStr] = 'future'; continue; }
                const auto = df_hasNumbersFor(entries, dateStr);
                const complete = df_isDayComplete(days[dateStr], auto);
                if (complete) {
                    dayStatus[dateStr] = (dateStr === todayStr) ? 'complete-today' : 'complete';
                    totalComplete++;
                    currentStreak++;
                    if (currentStreak > bestStreak) bestStreak = currentStreak;
                } else if (dateStr === todayStr) {
                    dayStatus[dateStr] = 'today';
                    // today is in-progress — doesn't break the streak yet
                } else {
                    dayStatus[dateStr] = 'missed';
                    currentStreak = 0;
                    if (df.mode === 'hard') { failed = true; }
                    else if (df.mode === 'twostrike') { missesUsed++; if (missesUsed > 2) failed = true; }
                }
            }
            const dayNumber = df_dayNumber(df.startDate, todayStr);
            return { allDates, dayStatus, currentStreak, bestStreak, totalComplete, missesUsed, failed, dayNumber };
        };

        // ── DAILY FIVE PAGE ──
        const renderClientDailyFive = async () => {
            const [df, entriesSnap] = await Promise.all([
                df_load(),
                db.ref(`portal/entries/${currentUser.uid}`).once('value'),
            ]);
            const entries = entriesSnap.val() || {};
            const today = df_iso(new Date());

            // Rule not published yet → friendly hint (still show the start screen)
            if (df === null) {
                return `
                <div>
                    <h2 class="page-title">The Daily Five Challenge</h2>
                    <p class="page-subtitle">Build the habits that grow your barbering business.</p>
                    <div style="background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.25);border-radius:14px;padding:20px;font-size:13px;color:#FBBF24;line-height:1.6;">
                        Almost there — your portal needs the new <code>dailyfive</code> Firebase rule published before this can save. Ask your coach to publish the rules update, then refresh this page.
                    </div>
                </div>`;
            }

            // No challenge started yet → mode-selection screen
            if (!df.startDate || !df.mode) {
                const modeCard = (modeKey) => {
                    const m = DF_MODES[modeKey];
                    return `
                        <div style="background:#0f0f0f;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px;">
                            <div>
                                <div style="font-size:11px;font-weight:800;color:${ACCENT};text-transform:uppercase;letter-spacing:0.1em;margin-bottom:6px;">${m.short}</div>
                                <div style="font-size:18px;font-weight:800;color:#fff;">${m.label}</div>
                                <div style="font-size:13px;color:#f5c842;font-weight:600;margin-top:4px;">${m.tagline}</div>
                            </div>
                            <div style="font-size:13px;color:rgba(255,255,255,0.6);line-height:1.6;flex:1;">${m.blurb}</div>
                            <button onclick="dfStart('${modeKey}')" style="background:${ACCENT};color:#000;border:none;padding:11px 16px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;letter-spacing:0.04em;text-transform:uppercase;">Start in ${m.short} mode &rarr;</button>
                        </div>`;
                };
                return `
                <div>
                    <h2 class="page-title">The Daily Five Challenge</h2>
                    <p class="page-subtitle">90 days. 5 things every day. Pick your difficulty.</p>

                    <div style="background:#0f0f0f;border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:24px;margin-bottom:24px;">
                        <div style="font-size:13px;color:rgba(255,255,255,0.7);line-height:1.7;">
                            Every day for 90 days, you tick 5 boxes:<br>
                            <strong style="color:#fff;">post a piece of content · 3 CTA stories · log your numbers · follow up with 5 rebook-due clients · 20 min of a Roadmap step</strong>.<br>
                            How strict you want to be is your call. Pick a mode below — you can switch difficulty any time (up or down) and your progress comes with you.
                        </div>
                    </div>

                    <div class="mobile-grid-2" style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;">
                        ${modeCard('hard')}
                        ${modeCard('twostrike')}
                        ${modeCard('streak')}
                    </div>
                </div>`;
            }

            // Active challenge state
            const stats = df_computeStats(df, entries, today);
            const days = df.days || {};
            const todayData = days[today] || {};
            const autoNumbersToday = df_hasNumbersFor(entries, today);
            const mode = DF_MODES[df.mode] || DF_MODES.streak;
            const challengeComplete = stats.dayNumber > DF_LENGTH;

            // Today's checklist tiles
            const checklistHtml = DF_ITEMS.map(item => {
                const isAuto = item.key === 'numbers';
                const ticked = isAuto ? autoNumbersToday : !!todayData[item.key];
                const onclickAttr = isAuto ? '' : `onclick="dfToggle('${item.key}')"`;
                const cursor = isAuto ? 'default' : 'pointer';
                const bg = ticked ? 'rgba(74,222,128,0.08)' : '#0f0f0f';
                const border = ticked ? 'rgba(74,222,128,0.35)' : 'rgba(255,255,255,0.08)';
                return `
                    <div ${onclickAttr} style="display:flex;align-items:center;gap:14px;padding:16px 18px;background:${bg};border:1px solid ${border};border-radius:14px;cursor:${cursor};transition:all 0.2s;">
                        <div style="width:28px;height:28px;border-radius:8px;background:${ticked ? '#4ADE80' : 'rgba(255,255,255,0.06)'};display:flex;align-items:center;justify-content:center;color:${ticked ? '#0f0f0f' : 'rgba(255,255,255,0.25)'};font-size:16px;font-weight:900;flex-shrink:0;">${ticked ? '&#x2713;' : ''}</div>
                        <div style="flex:1;">
                            <div style="font-size:14px;font-weight:700;color:#fff;">${item.label}</div>
                            <div style="font-size:11px;color:rgba(255,255,255,0.45);margin-top:2px;font-weight:400;">${item.detail}</div>
                        </div>
                        ${isAuto ? `<div style="font-size:9px;font-weight:700;color:${ticked ? '#4ADE80' : 'rgba(255,255,255,0.35)'};text-transform:uppercase;letter-spacing:0.1em;">Auto</div>` : ''}
                    </div>`;
            }).join('');

            // Compact 90-day grid (10 cols × 9 rows)
            const gridHtml = stats.allDates.map((dateStr, i) => {
                const status = stats.dayStatus[dateStr];
                let bg = 'rgba(255,255,255,0.05)'; // future
                let border = 'transparent';
                if (status === 'complete' || status === 'complete-today') bg = '#4ADE80';
                else if (status === 'missed') bg = 'rgba(255,69,51,0.7)';
                if (dateStr === today) border = ACCENT;
                return `<div title="Day ${i+1} · ${dateStr}" style="aspect-ratio:1/1;background:${bg};border:1.5px solid ${border};border-radius:3px;"></div>`;
            }).join('');

            // Mode controls — both upgrade and downgrade are now allowed; progress is preserved either way
            const upgradeModes = Object.keys(DF_MODES).filter(k => k !== df.mode && DF_MODE_RANK[k] > DF_MODE_RANK[df.mode]);
            const downgradeModes = Object.keys(DF_MODES).filter(k => k !== df.mode && DF_MODE_RANK[k] < DF_MODE_RANK[df.mode]);

            return `
                <div>
                    <h2 class="page-title">The Daily Five</h2>
                    <p class="page-subtitle">Day ${Math.min(stats.dayNumber, DF_LENGTH)} of ${DF_LENGTH} &middot; ${mode.label}</p>

                    ${stats.failed ? `
                    <div style="background:linear-gradient(135deg,#1a0808,#1a1208);border:1px solid rgba(255,69,51,0.4);border-radius:14px;padding:18px 20px;margin-bottom:18px;">
                        <div style="font-size:13px;font-weight:800;color:#FF4533;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:6px;">Challenge ended</div>
                        <div style="font-size:13px;color:rgba(255,255,255,0.75);line-height:1.6;margin-bottom:12px;">You didn't hit all 5 boxes on a day &mdash; your ${mode.label.toLowerCase()} run is over. Switch to a kinder mode below to keep your completed days, or restart fresh from day 1.</div>
                        <div style="display:flex;gap:8px;flex-wrap:wrap;">
                            ${downgradeModes.length > 0 ? `<button onclick="dfChangeMode('${downgradeModes[downgradeModes.length - 1]}')" style="background:${ACCENT};color:#000;border:none;padding:10px 20px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;letter-spacing:0.04em;text-transform:uppercase;">Switch to ${DF_MODES[downgradeModes[downgradeModes.length - 1]].short} &rarr;</button>` : ''}
                            <button onclick="dfRestart()" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.2);padding:10px 20px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:0.04em;text-transform:uppercase;">Restart from day 1</button>
                        </div>
                    </div>` : ''}

                    ${challengeComplete && !stats.failed ? `
                    <div style="background:linear-gradient(135deg,#0a1a0f,#0a1a12);border:1px solid rgba(74,222,128,0.45);border-radius:14px;padding:24px;margin-bottom:18px;text-align:center;">
                        <div style="font-size:36px;margin-bottom:8px;">🏆</div>
                        <div style="font-size:18px;font-weight:800;color:#4ADE80;letter-spacing:0.04em;text-transform:uppercase;margin-bottom:6px;">90 days. Done.</div>
                        <div style="font-size:13px;color:rgba(255,255,255,0.75);line-height:1.6;">You showed up every single day. Your business is bigger because of it. That's the whole point.</div>
                    </div>` : ''}

                    <!-- Stats row -->
                    <div class="mobile-grid-2" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px;">
                        <div style="background:#0f0f0f;border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:14px;">
                            <div style="font-size:10px;color:rgba(255,255,255,0.45);text-transform:uppercase;letter-spacing:0.08em;font-weight:700;margin-bottom:6px;">Current Streak</div>
                            <div style="font-size:24px;font-weight:800;color:${ACCENT};">${stats.currentStreak}<span style="font-size:14px;color:rgba(255,255,255,0.45);font-weight:600;"> day${stats.currentStreak === 1 ? '' : 's'}</span></div>
                        </div>
                        <div style="background:#0f0f0f;border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:14px;">
                            <div style="font-size:10px;color:rgba(255,255,255,0.45);text-transform:uppercase;letter-spacing:0.08em;font-weight:700;margin-bottom:6px;">Best Streak</div>
                            <div style="font-size:24px;font-weight:800;color:#fff;">${stats.bestStreak}<span style="font-size:14px;color:rgba(255,255,255,0.45);font-weight:600;"> day${stats.bestStreak === 1 ? '' : 's'}</span></div>
                        </div>
                        <div style="background:#0f0f0f;border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:14px;">
                            <div style="font-size:10px;color:rgba(255,255,255,0.45);text-transform:uppercase;letter-spacing:0.08em;font-weight:700;margin-bottom:6px;">Days Complete</div>
                            <div style="font-size:24px;font-weight:800;color:#fff;">${stats.totalComplete}<span style="font-size:14px;color:rgba(255,255,255,0.45);font-weight:600;"> / ${DF_LENGTH}</span></div>
                        </div>
                        <div style="background:#0f0f0f;border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:14px;">
                            <div style="font-size:10px;color:rgba(255,255,255,0.45);text-transform:uppercase;letter-spacing:0.08em;font-weight:700;margin-bottom:6px;">${df.mode === 'twostrike' ? 'Strikes Used' : df.mode === 'hard' ? 'Mode' : 'Days Left'}</div>
                            <div style="font-size:24px;font-weight:800;color:#fff;">${df.mode === 'twostrike' ? stats.missesUsed + ' / 2' : df.mode === 'hard' ? '<span style="font-size:18px;color:#FF4533;letter-spacing:0.04em;">HARD</span>' : Math.max(0, DF_LENGTH - stats.dayNumber + 1)}</div>
                        </div>
                    </div>

                    <!-- Today's checklist -->
                    <div style="display:flex;align-items:center;justify-content:space-between;margin:0 2px 14px;">
                        <div style="font-size:12px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.55);">Today &middot; ${new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })}</div>
                    </div>
                    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:24px;">
                        ${checklistHtml}
                    </div>

                    <!-- 90-day grid (compact) -->
                    <div style="display:flex;align-items:center;justify-content:space-between;margin:0 2px 12px;">
                        <div style="font-size:12px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.55);">90-Day Progress</div>
                        <div style="display:flex;gap:14px;font-size:10px;color:rgba(255,255,255,0.45);font-weight:600;">
                            <span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:10px;height:10px;background:#4ADE80;border-radius:2px;"></span>Done</span>
                            <span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:10px;height:10px;background:rgba(255,69,51,0.7);border-radius:2px;"></span>Missed</span>
                            <span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:10px;height:10px;background:rgba(255,255,255,0.05);border-radius:2px;border:1.5px solid ${ACCENT};box-sizing:border-box;"></span>Today</span>
                        </div>
                    </div>
                    <div style="background:#0f0f0f;border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:16px;margin-bottom:24px;display:flex;justify-content:flex-start;">
                        <div style="display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;width:100%;max-width:340px;">
                            ${gridHtml}
                        </div>
                    </div>

                    <!-- Mode controls — both directions allowed, progress preserved -->
                    <div style="background:#0f0f0f;border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:18px;margin-bottom:24px;">
                        <div style="font-size:12px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.55);margin-bottom:8px;">Difficulty</div>
                        <div style="font-size:13px;color:rgba(255,255,255,0.6);line-height:1.6;margin-bottom:14px;">You're on <strong style="color:#fff;">${mode.label}</strong>. Switching modes keeps every day you've completed &mdash; only the rules going forward change.</div>
                        ${upgradeModes.length > 0 ? `<div style="display:flex;flex-wrap:wrap;gap:8px;">${upgradeModes.map(k => `<button onclick="dfChangeMode('${k}')" style="background:transparent;border:1px solid rgba(255,69,51,0.4);color:#FF4533;padding:8px 14px;border-radius:8px;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;letter-spacing:0.05em;text-transform:uppercase;">Level up to ${DF_MODES[k].short} &rarr;</button>`).join('')}</div>` : ''}
                        ${downgradeModes.length > 0 ? `<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;">${downgradeModes.map(k => `<button onclick="dfChangeMode('${k}')" style="background:transparent;border:1px solid rgba(184,233,134,0.4);color:var(--accent);padding:8px 14px;border-radius:8px;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;letter-spacing:0.05em;text-transform:uppercase;">Switch to ${DF_MODES[k].short}</button>`).join('')}</div>` : ''}
                    </div>
                </div>
            `;
        };

        // Save handlers — exposed on window for inline onclick
        window.dfStart = async (mode) => {
            if (!DF_MODES[mode]) return;
            const today = df_iso(new Date());
            try {
                await db.ref(`portal/dailyfive/${currentUser.uid}`).set({
                    startDate: today,
                    mode,
                    days: {},
                });
                toast.success(`${DF_MODES[mode].label} — locked in. Day 1.`);
                setPage('dailyfive');
            } catch (err) { toast.error('Could not start: ' + err.message); }
        };

        window.dfToggle = async (itemKey) => {
            if (itemKey === 'numbers') return; // auto-derived
            const today = df_iso(new Date());
            const ref = db.ref(`portal/dailyfive/${currentUser.uid}/days/${today}/${itemKey}`);
            try {
                const snap = await ref.once('value');
                await ref.set(!snap.val());
                setPage('dailyfive');
            } catch (err) { toast.error('Could not save: ' + err.message); }
        };

        // Change difficulty in either direction. Progress (startDate + completed days) is preserved
        // — only the rules going forward change. df_computeStats re-derives "failed" from the new mode.
        window.dfChangeMode = async (newMode) => {
            if (!DF_MODES[newMode]) return;
            const snap = await db.ref(`portal/dailyfive/${currentUser.uid}`).once('value');
            const cur = snap.val() || {};
            if (cur.mode === newMode) return;
            const goingHarder = DF_MODE_RANK[newMode] > DF_MODE_RANK[cur.mode];
            const message = goingHarder
                ? `Switching to ${DF_MODES[newMode].label} keeps your ${cur.startDate ? 'day count and ' : ''}completed days. The stricter rule kicks in from today — miss a day now and ${newMode === 'hard' ? 'your run ends' : 'a strike is used'}.`
                : `Switching to ${DF_MODES[newMode].label} keeps every day you've completed. The relaxed rule applies retroactively — any previous misses stop counting against you.`;
            const ok = await confirmAsync({
                title: `Switch to ${DF_MODES[newMode].label}?`,
                message,
                confirmLabel: 'Switch mode',
                cancelLabel: 'Stay',
            });
            if (!ok) return;
            try {
                await db.ref(`portal/dailyfive/${currentUser.uid}/mode`).set(newMode);
                toast.success(`Now on ${DF_MODES[newMode].label}.`);
                setPage('dailyfive');
            } catch (err) { toast.error('Could not save: ' + err.message); }
        };

        // Back-compat alias — older inline onclicks may still call dfUpgrade
        window.dfUpgrade = window.dfChangeMode;

        window.dfRestart = async () => {
            const ok = await confirmAsync({
                title: 'Restart from day 1?',
                message: 'This wipes every day you\'ve completed. Use this only if you genuinely want a fresh 90-day run.',
                confirmLabel: 'Restart',
                danger: true,
            });
            if (!ok) return;
            const today = df_iso(new Date());
            try {
                const snap = await db.ref(`portal/dailyfive/${currentUser.uid}`).once('value');
                const cur = snap.val() || {};
                await db.ref(`portal/dailyfive/${currentUser.uid}`).set({
                    startDate: today,
                    mode: cur.mode || 'streak',
                    days: {},
                });
                toast.success('Restarted. Day 1.');
                setPage('dailyfive');
            } catch (err) { toast.error('Could not save: ' + err.message); }
        };

        // ── PRICE COACH ──
        // AI chat agent that helps barbers structure price increases using the
        // Price Ascension framework. Streams responses from the Supabase edge
        // function `price-coach-chat`, which calls Claude. The student's
        // business numbers are read straight off their daily log entries.
        const PRICE_COACH_FN_URL = SUPABASE_URL + '/functions/v1/price-coach-chat';

        // In-memory state for the currently-open Price Coach session.
        let pc_session = null;          // { id, messages:[{role,content}], startedAt, updatedAt }
        let pc_streaming = false;
        let pc_businessData = null;
        let pc_pastSummary = '';

        // Compute the businessData object the edge function's system prompt
        // expects, aggregating across every week in the student's daily log.
        const pc_computeBusinessData = async (uid) => {
            const snap = await db.ref('portal/entries/' + uid).once('value');
            const entries = snap.val() || {};
            let totalRevenue = 0, totalApptsFilled = 0, totalApptsAvailable = 0;
            let totalNoShows = 0, totalNewClients = 0, totalRebookings = 0;
            let totalHoursWorked = 0, totalBusinessExpenses = 0;
            let avgTicketSum = 0, avgTicketCount = 0;
            let weeksWithData = 0;

            Object.entries(entries).forEach(([weekKey, entry]) => {
                if (!weekKey.includes('_W')) return;
                const t = getWeeklyTotals(entry, weekKey);
                if (!(t.revenue || t.appointmentsFilled || t.hoursWorked)) return;
                weeksWithData++;
                totalRevenue += t.revenue;
                totalApptsFilled += t.appointmentsFilled;
                totalApptsAvailable += t.appointmentsAvailable;
                totalNoShows += t.noShows;
                totalNewClients += t.newClients;
                totalRebookings += t.rebookings;
                totalHoursWorked += t.hoursWorked;
                totalBusinessExpenses += t.businessExpenses;
                if (t.avgTicketPrice > 0) { avgTicketSum += t.avgTicketPrice; avgTicketCount++; }
            });

            const timeline = buildDailyTimeline(entries);
            const dateFrom = timeline.length ? timeline[0].date.toISOString().slice(0,10) : null;
            const dateTo   = timeline.length ? timeline[timeline.length-1].date.toISOString().slice(0,10) : null;

            // Revenue ÷ filled is the true average ticket. Fall back to the
            // self-reported avg if filled is empty.
            const computedAvg = totalApptsFilled > 0 ? totalRevenue / totalApptsFilled : 0;
            const reportedAvg = avgTicketCount > 0 ? avgTicketSum / avgTicketCount : 0;
            const avgTicketPrice = computedAvg > 0 ? computedAvg : reportedAvg;

            const occupancyRate = totalApptsAvailable > 0 ? (totalApptsFilled / totalApptsAvailable) * 100 : 0;
            const rebookRate    = totalApptsFilled > 0 ? (totalRebookings / totalApptsFilled) * 100 : 0;
            const profit        = totalRevenue - totalBusinessExpenses;
            const profitMargin  = totalRevenue > 0 ? (profit / totalRevenue) * 100 : 0;
            const hoursPerWeek  = weeksWithData > 0 ? totalHoursWorked / weeksWithData : 0;
            const annualRevenue = weeksWithData > 0 ? (totalRevenue / weeksWithData) * 48 : 0;
            const monthsOfData  = weeksWithData / 4.345;
            const newClientsPerMonth = monthsOfData > 0 ? totalNewClients / monthsOfData : 0;
            const weeklyExpenses     = weeksWithData > 0 ? totalBusinessExpenses / weeksWithData : 0;
            const breakEvenHaircutsPerWeek = avgTicketPrice > 0 ? weeklyExpenses / avgTicketPrice : 0;

            const r1 = (n) => Math.round(n * 10) / 10;
            const r2 = (n) => Math.round(n * 100) / 100;

            return {
                dateFrom, dateTo,
                weeksOfData: r1(weeksWithData),
                monthsOfData: r1(monthsOfData),
                avgTicketPrice: r2(avgTicketPrice),
                totalRevenue: r2(totalRevenue),
                annualRevenue: r2(annualRevenue),
                appointmentsFilled: totalApptsFilled,
                appointmentsAvailable: totalApptsAvailable,
                occupancyRate: r1(occupancyRate),
                totalNoShows,
                newClients: totalNewClients,
                newClientsPerMonth: r1(newClientsPerMonth),
                rebookRate: r1(rebookRate),
                totalHoursWorked: r1(totalHoursWorked),
                hoursPerWeek: r1(hoursPerWeek),
                totalBusinessExpenses: r2(totalBusinessExpenses),
                profit: r2(profit),
                profitMargin: r1(profitMargin),
                breakEvenHaircutsPerWeek: r1(breakEvenHaircutsPerWeek),
            };
        };

        // Lightweight markdown → HTML for what the agent actually outputs:
        // ## headings, **bold**, *italic*, "- " bullet lists, paragraphs.
        const pc_renderMarkdown = (md) => {
            if (!md) return '';
            let s = md.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            s = s.replace(/^## (.*)$/gm, '<h3 style="font-size:14px;font-weight:800;color:#fff;margin:14px 0 6px;letter-spacing:0.02em;">$1</h3>');
            s = s.replace(/^### (.*)$/gm, '<h4 style="font-size:13px;font-weight:700;color:rgba(255,255,255,0.9);margin:12px 0 4px;">$1</h4>');
            s = s.replace(/\*\*([^*]+)\*\*/g, '<strong style="color:#fff;">$1</strong>');
            s = s.replace(/(^|[^*])\*([^*\n]+)\*([^*]|$)/g, '$1<em>$2</em>$3');
            s = s.replace(/(^|\n)((?:- .*(?:\n|$))+)/g, (_, prefix, block) => {
                const items = block.trim().split(/\n/).map(l => l.replace(/^- /, '').trim()).map(t => '<li style="margin-bottom:4px;">' + t + '</li>').join('');
                return prefix + '<ul style="margin:6px 0 10px 18px;padding:0;color:rgba(255,255,255,0.85);line-height:1.55;">' + items + '</ul>';
            });
            s = s.replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
            return s;
        };

        // Build a compact text summary of the student's prior sessions so the
        // agent has continuity across visits. Past three sessions only.
        const pc_buildPastSummary = (sessions) => {
            if (!sessions || !sessions.length) return '';
            return sessions.slice(-3).map(s => {
                const when = s.startedAt ? new Date(s.startedAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
                const firstUser = (s.messages || []).find(m => m.role === 'user');
                const lastAssistant = [...(s.messages || [])].reverse().find(m => m.role === 'assistant');
                const trim = (t, n) => (t || '').length > n ? (t || '').slice(0, n) + '…' : (t || '');
                return '• ' + when + (firstUser ? ' — student asked: "' + trim(firstUser.content, 80) + '"' : '') + (lastAssistant ? ' Coach recommended: "' + trim(lastAssistant.content, 220) + '"' : '');
            }).join('\n');
        };

        // The data-summary card at the top of the chat. Lets the barber sanity-
        // check what the coach is working from before they engage.
        const pc_renderDataCard = (bd) => {
            const sym = currencySymbol();
            const r = (n) => sym + Math.round(n || 0).toLocaleString(getCurrency().locale);
            const r1 = (n) => Math.round((n || 0) * 10) / 10;
            const stat = (label, value, sub) => `
                <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:10px 12px;">
                    <div style="font-size:9.5px;color:rgba(255,255,255,0.45);text-transform:uppercase;letter-spacing:0.08em;font-weight:700;margin-bottom:4px;">${label}</div>
                    <div style="font-size:16px;font-weight:800;color:#fff;line-height:1.1;">${value}</div>
                    ${sub ? '<div style="font-size:10px;color:rgba(255,255,255,0.4);margin-top:2px;">' + sub + '</div>' : ''}
                </div>`;
            return `
                <div style="background:#0f0f0f;border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:16px 18px;margin-bottom:18px;">
                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
                        <div style="font-size:11px;font-weight:800;color:rgba(255,255,255,0.6);text-transform:uppercase;letter-spacing:0.1em;">Your numbers — what the coach sees</div>
                        <div style="font-size:10px;color:rgba(255,255,255,0.35);">${bd.weeksOfData || 0} weeks logged</div>
                    </div>
                    <div class="mobile-grid-2" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;">
                        ${stat('Avg Ticket', r(bd.avgTicketPrice))}
                        ${stat('Occupancy', r1(bd.occupancyRate) + '%')}
                        ${stat('Rebook', r1(bd.rebookRate) + '%')}
                        ${stat('Profit', r(bd.profit), r1(bd.profitMargin) + '% margin')}
                        ${stat('Annual', r(bd.annualRevenue), 'projected')}
                        ${stat('New / mo', r1(bd.newClientsPerMonth))}
                        ${stat('No-shows', String(bd.totalNoShows || 0))}
                        ${stat('Hours/wk', r1(bd.hoursPerWeek))}
                    </div>
                </div>`;
        };

        const renderClientPriceCoach = async () => {
            pc_businessData = await pc_computeBusinessData(currentUser.uid);

            const sessSnap = await db.ref('portal/price_coach_sessions/' + currentUser.uid).once('value');
            const sessions = [];
            sessSnap.forEach((child) => sessions.push({ id: child.key, ...child.val() }));
            sessions.sort((a,b) => (b.startedAt || 0) - (a.startedAt || 0));
            pc_pastSummary = pc_buildPastSummary(sessions.slice().reverse());

            if (!pc_session) pc_session = { id: null, messages: [], startedAt: null, updatedAt: null };

            const noData = !pc_businessData || (pc_businessData.weeksOfData || 0) < 1;

            if (noData) {
                return `
                <div>
                    <h2 class="page-title">Price Coach</h2>
                    <p class="page-subtitle">A coach for structuring your next price increase — built on your actual numbers.</p>
                    <div style="background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.25);border-radius:14px;padding:22px;font-size:13.5px;color:#FBBF24;line-height:1.7;">
                        You haven't logged any weeks yet. The Price Coach needs a couple of weeks of <strong>Daily Log</strong> data — current price, appointments filled, expenses — before it can give you a real answer. Log a week or two and come back.
                        <div style="margin-top:14px;"><button onclick="setPage('numbers')" style="background:${ACCENT};color:#000;border:none;padding:10px 18px;border-radius:10px;font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;letter-spacing:0.04em;text-transform:uppercase;">Open the Daily Log &rarr;</button></div>
                    </div>
                </div>`;
            }

            const messagesHtml = pc_session.messages.map(m => pc_renderMessage(m)).join('');

            const pastHtml = sessions.length ? sessions.slice(0, 8).map(s => {
                const when = s.startedAt ? new Date(s.startedAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '';
                const firstUser = (s.messages || []).find(m => m.role === 'user');
                const summary = firstUser ? firstUser.content : 'Session';
                const trim = summary.length > 42 ? summary.slice(0, 42) + '…' : summary;
                const active = pc_session.id === s.id ? 'border-color:rgba(184,233,134,0.4);background:rgba(184,233,134,0.04);' : '';
                return `<button onclick="priceCoachOpenSession('${s.id}')" style="${active}width:100%;text-align:left;background:#0a0a0a;border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:10px 12px;color:rgba(255,255,255,0.85);font-family:inherit;font-size:12px;cursor:pointer;margin-bottom:6px;line-height:1.4;">
                    <div style="font-size:10px;color:rgba(255,255,255,0.4);margin-bottom:3px;">${when}</div>
                    <div>${trim.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>
                </button>`;
            }).join('') : '<div style="font-size:11px;color:rgba(255,255,255,0.35);padding:4px 2px;line-height:1.5;">No past sessions yet. Your first chat will show up here.</div>';

            const suggestedPrompts = [
                "I want to map out my next price increase.",
                "What's my next move on price?",
                "Walk me through my numbers.",
            ];
            const promptChips = suggestedPrompts.map(p => {
                const safe = JSON.stringify(p).replace(/"/g, '&quot;');
                return `<button onclick="priceCoachSend(${safe})" style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.85);font-family:inherit;font-size:12px;padding:8px 12px;border-radius:20px;cursor:pointer;">${p}</button>`;
            }).join('');

            return `
                <div>
                    <h2 class="page-title">Price Coach</h2>
                    <p class="page-subtitle">A coach for structuring your next price increase — built on your actual numbers.</p>

                    <div class="pc-layout" style="display:grid;grid-template-columns:1fr 240px;gap:18px;align-items:start;">
                        <div style="min-width:0;">
                            ${pc_renderDataCard(pc_businessData)}

                            <div id="pcThread" style="background:#0a0a0a;border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:18px;min-height:300px;max-height:62vh;overflow-y:auto;margin-bottom:14px;">
                                ${pc_session.messages.length ? messagesHtml : `
                                    <div class="pc-empty" style="text-align:center;padding:48px 24px;color:rgba(255,255,255,0.5);font-size:13px;line-height:1.7;">
                                        <div style="font-size:32px;margin-bottom:10px;opacity:0.7;">💬</div>
                                        <div style="color:rgba(255,255,255,0.75);font-weight:700;margin-bottom:4px;">Ready when you are.</div>
                                        <div style="font-size:12px;">Say hi to start, or tap a prompt below.</div>
                                    </div>`}
                            </div>

                            ${pc_session.messages.length === 0 ? `
                            <div id="pcPromptChips" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">${promptChips}</div>` : ''}

                            <div style="display:flex;gap:8px;align-items:flex-end;">
                                <textarea id="pcInput" placeholder="Ask the coach anything — or just say hi..." rows="2" style="flex:1;background:#0f0f0f;border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 14px;color:#fff;font-family:inherit;font-size:13px;resize:vertical;min-height:46px;max-height:200px;outline:none;"></textarea>
                                <button id="pcSendBtn" onclick="priceCoachSend()" style="background:${ACCENT};color:#000;border:none;padding:0 18px;height:46px;border-radius:12px;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;letter-spacing:0.04em;text-transform:uppercase;">Send</button>
                            </div>

            let accumulated = '';
            try {
                const idToken = await getIdToken();
                if (!idToken) throw new Error('Not authenticated');
                const res = await fetch(PRICE_COACH_FN_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                    },
                    body: JSON.stringify({
                        idToken,
                        messages: pc_session.messages,
                        businessData: pc_businessData,
                        pastSessionsSummary: pc_pastSummary,

                    const errText = await res.text().catch(() => '');
                    throw new Error('Coach unavailable (' + res.status + '): ' + errText.slice(0, 200));
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                const bubble = document.querySelector('#' + streamId + ' .pc-msg-body');
                const renderStream = () => {
                    if (!bubble) return;
                    bubble.innerHTML = pc_renderMarkdown(accumulated) + '<span class="pc-cursor" style="display:inline-block;width:7px;height:14px;background:rgba(255,255,255,0.5);vertical-align:middle;animation:pc-blink 1s infinite;margin-left:2px;"></span>';
                    pc_scrollThread();
                };

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';
                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const dataStr = line.slice(6).trim();
                        if (!dataStr) continue;
                        try {
                            const evt = JSON.parse(dataStr);
                            if (evt.type === 'text') { accumulated += evt.text; renderStream(); }
                            else if (evt.type === 'error') { throw new Error(evt.message || 'Stream error'); }
                        } catch(_) { /* skip malformed */ }
                    }

            const totalsRow = `<div class="card" style="margin-top:8px;margin-bottom:16px;background:#0f0f0f;border:1.5px solid ${ACCENT_RGBA}0.2);">

                        return `<div style="background:rgba(255,255,255,0.04);border-radius:10px;padding:10px 12px;text-align:center;">

                        ${allLeaveDates.length > 0 ? `
                        <div style="margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.06);">
                            <div style="font-size:10px;color:rgba(255,255,255,0.45);text-transform:uppercase;letter-spacing:0.05em;font-weight:700;margin-bottom:8px;">Days off</div>
                            <div style="display:flex;flex-wrap:wrap;gap:6px;">${leaveChipsHtml}</div>
                        </div>` : ''}
                    </div>

                    ${isOldFormat ? `<div style="background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.2);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:#FBBF24;">

                    </div>` : ''}

                    <div class="card" style="margin-top:8px;margin-bottom:40px;">

                        <div style="overflow-x:auto;">

                                    <tr style="border-bottom:2px solid rgba(255,255,255,0.08);">

                                        const t = getWeeklyTotals(e);

                                        const filled = getFilledDayCount(e);
                                        return `
                                        <tr style="border-bottom:1px solid rgba(255,255,255,0.06);${key===selectedWeekKey?'background:rgba(255,255,255,0.04);':''}" >

                                            <td style="padding:10px 10px;font-size:10px;color:${isDaily ? '#4ADE80' : 'rgba(255,255,255,0.35)'};">${isDaily ? filled+'/7 days' : 'Weekly total'}</td>
                                            <td style="text-align:center;padding:10px 10px;"><button onclick="loadWeekForEdit('${key}')" style="background:${key===selectedWeekKey?'#FBBF24':'#1A1A1A'};border:none;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;color:${key===selectedWeekKey?'#000':'rgba(255,255,255,0.65)'};">${key===selectedWeekKey?'Editing':'Edit'}</button></td>
                                            <td style="text-align:center;padding:10px 10px;"><button onclick="exportWeekPDF('${key}')" style="background:${ACCENT};border:none;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;color:#000;">PDF</button></td>
                                        </tr>`;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>` : '<div style="margin-bottom:40px;"></div>'}
                </div>
            `;
        };

        window.selectDay = (idx) => {
            selectedDayIndex = idx;
            // Re-render to toggle day panel
            setPage('numbers');
        };

        window.handleSaveDayNumbers = async (dayIdx) => {
            const weekKey = selectedWeekKey || getWeekKey();
            const dayData = {};
            document.querySelectorAll(`.day-field-${dayIdx}`).forEach(input => {
                const key = input.dataset.key;
                const value = input.value.trim();
                dayData[key] = value ? parseFloat(value) : null;
            });
            try {
                // Save this day's data under the days sub-key
                await db.ref(`portal/entries/${currentUser.uid}/${weekKey}/days/${dayIdx}`).set(dayData);
                // Also store week/year metadata
                await db.ref(`portal/entries/${currentUser.uid}/${weekKey}/week`).set(parseInt(weekKey.split('_W')[1]));
                await db.ref(`portal/entries/${currentUser.uid}/${weekKey}/year`).set(parseInt(weekKey.split('_')[0]));

                const btn = document.getElementById(`saveDayBtn_${dayIdx}`);
                if (btn) {
                    btn.textContent = '✓ Saved!';
                    btn.style.background = '#4ADE80';
                    setTimeout(() => { setPage('numbers'); }, 1200);
                }
            } catch (err) { toast.error('Error saving: ' + err.message); }
        };

        // Legacy save handler (no longer used for new entries, but kept for safety)
        const handleSaveNumbers = async () => {
            // This now redirects to day-based saving
            if (selectedDayIndex !== null && selectedDayIndex !== undefined) {
                await window.handleSaveDayNumbers(selectedDayIndex);
            }
        };

        // ── ANNUAL LEAVE save handlers ──
        // Build an inclusive YYYY-MM-DD list from start to end (capped at 365 days for safety)
        const leaveDateRange = (startStr, endStr) => {
            const start = new Date(startStr + 'T00:00:00');
            const end = new Date(endStr + 'T00:00:00');
            if (isNaN(start) || isNaN(end) || end < start) return [];
            const days = Math.round((end - start) / 86400000) + 1;
            if (days > 365) return [];
            const out = [];
            for (let i = 0; i < days; i++) {
                const d = new Date(start);
                d.setDate(start.getDate() + i);
                out.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`);
            }
            return out;
        };

            try {
                const updates = {};
                dates.forEach(d => { updates[d] = true; });
                await db.ref(`portal/leave/${currentUser.uid}`).update(updates);
                toast.success(`${dates.length} ${dates.length === 1 ? 'day' : 'days'} marked as leave`);

        window.markSingleDayLeave = async (dateStr) => {

        window.unmarkLeaveDate = async (dateStr) => {
            try {
                await db.ref(`portal/leave/${currentUser.uid}/${dateStr}`).remove();

        const exportWeekPDF = async (weekKey) => {
            if (!weekKey) { toast.error('Please select a week to export'); return; }
            try {
                const snap = await db.ref(`portal/entries/${currentUser.uid}/${weekKey}`).once('value');
                const rawEntry = snap.val();
                if (!rawEntry) { toast.error('No data found for ' + weekKey); return; }
                const d = getWeeklyTotals(rawEntry);
                const revenue = d.revenue||0;
                const expenses = d.expenses||0;
                const profit = revenue - expenses;
                const profitMargin = revenue > 0 ? ((profit/revenue)*100).toFixed(1) : '0.0';
                const occupancy = d.appointmentsAvailable > 0 ? (d.appointmentsFilled/d.appointmentsAvailable*100).toFixed(1) : '0.0';
                const rebook = d.appointmentsFilled > 0 ? (d.rebookings/d.appointmentsFilled*100).toFixed(1) : '0.0';
                // Social data removed from PDF — now tracked via Social Tracker
                const htmlContent = `<!DOCTYPE html><html><head><title>SCALO Report - ${weekKey}</title>

                    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 700px; margin: 40px auto; color: #222; }

                    td { padding: 10px 12px; border-bottom: 1px solid #F0F0F0; font-size: 14px; }
                    .val { font-weight: 700; text-align: right; }
                    .green { color: #4ADE80; }
                    .red { color: #FF4533; }
                    .footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 11px; color: #CCC; }

        // ── SOCIAL PDF EXPORT ──
        const exportSocialPDF = async () => {
            const monthVal = document.getElementById('socialExportMonth')?.value;
            if (!monthVal) { toast.error('Please select a month'); return; }
            const [selYear, selMonth] = monthVal.split('-').map(Number);
            const monthName = new Date(selYear, selMonth - 1, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });

                const allHistory = snap.val() || {};

                // Filter weeks that fall within the selected month
                const filtered = Object.entries(allHistory).filter(([key]) => {
                    const [yr, wPart] = key.split('_W');
                    const weekNum = parseInt(wPart);
                    const jan1 = new Date(parseInt(yr), 0, 1);
                    const weekDate = new Date(jan1.getTime() + (weekNum - 1) * 7 * 86400000);
                    return weekDate.getFullYear() === selYear && (weekDate.getMonth() + 1) === selMonth;

                if (filtered.length === 0) {
                    toast.error('No social data found for ' + monthName);
                    return;

                // Calculate growth: first week vs last week of month
                const first = filtered[0][1];
                const last = filtered[filtered.length - 1][1];

                    const start = first[key] || 0;
                    const end = last[key] || 0;
                    const change = end - start;
                    const color = change > 0 ? '#4ADE80' : change < 0 ? '#FF4533' : 'rgba(255,255,255,0.65)';
                    const sign = change > 0 ? '+' : '';
                    return '<tr><td>' + label + '</td><td class="val">' + formatNumber(start) + '</td><td class="val">' + formatNumber(end) + '</td><td class="val" style="color:' + color + ';">' + sign + formatNumber(change) + '</td></tr>';
                };

                // Build weekly breakdown rows
                const weekRows = filtered.map(([key, v]) => {
                    const [yr, wPart] = key.split('_W');

                    'h1 { font-size: 22px; margin-bottom: 4px; }' +
                    '.sub { color: #999; font-size: 13px; margin-bottom: 30px; }' +
                    '.section { font-size: 10px; color: ' + ACCENT + '; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; margin: 28px 0 12px; }' +
                    'table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }' +

                    '.green { color: #4ADE80; }' +
                    '.red { color: #FF4533; }' +

                    '@media print { body { margin: 20px; } }' +
                '</style></head><body>' +

                    '<tr><th>Week</th><th style="text-align:right;">IG Foll.</th><th style="text-align:right;">IG Views</th><th style="text-align:right;">IG Posts</th>' +

                        const weekDate = new Date(jan1.getTime() + (weekNum - 1) * 7 * 86400000);

                    }).join('')) +
                '</table>' +

                '<div class="footer">Generated from SCALO Client Portal &#x2014; ' + new Date().toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' }) + '</div>' +

                toast.error('Export error: ' + err.message);

        window.exportSocialPDF = exportSocialPDF;


        // ── CLIENT: IMPLEMENTATION CHECKLIST ──
        const renderClientImplementation = async () => {
            const snap = await db.ref('portal/implementation/' + currentUser.uid).once('value');
            const completions = snap.val() || {};
            const allItems = IMPLEMENTATION_MODULES.flatMap(m => m.items);
            const totalItems = allItems.length;
            const doneItems = allItems.filter(i => completions[i.id] === true).length;

                let lastSection = '';

                '</div>';

            const bannerColor = overallPct === 100 ? '#4ADE80' : overallPct >= 50 ? '#FBBF24' : '#FF4533';

            return '<div>' +
                '<h2 class="page-title">Implementation Checklist</h2>' +

                        '<div><div style="font-size:13px;color:rgba(255,255,255,0.45);font-weight:400;">Overall Progress</div>' +
                        '<div id="implBannerSteps" style="font-size:11px;color:rgba(255,255,255,0.35);margin-top:2px;">' + doneItems + ' of ' + totalItems + ' tasks completed</div></div>' +

                    '</div>' +
                '</div>' +
                IMPLEMENTATION_MODULES.map((m, i) => renderLevel(m, i)).join('') +
            '</div>';
        };

        window.toggleImplLevel = (idx) => {
            const el = document.getElementById('impl-level-' + idx);
            if (el && !el.classList.contains('coming')) el.classList.toggle('open');
        };

        window.handleImplToggle = async (itemId, checked) => {
            try {
                await db.ref('portal/implementation/' + currentUser.uid + '/' + itemId).set(checked || null);
                const itemEl = document.getElementById('impl-item-' + itemId);
                const checkEl = document.getElementById('impl-check-' + itemId);
                if (itemEl) { if (checked) itemEl.classList.add('done'); else itemEl.classList.remove('done'); }
                if (checkEl) {
                    if (checked) checkEl.classList.add('done'); else checkEl.classList.remove('done');
                    checkEl.setAttribute('onclick', "handleImplToggle('" + itemId + "'," + !checked + ")");
                }
                // Update level progress
                const allItems = IMPLEMENTATION_MODULES.flatMap(m => m.items);
                IMPLEMENTATION_MODULES.forEach((mod, idx) => {
                    if (mod.items.length === 0) return;
                    const lvlDone = mod.items.filter(i => {
                        const el = document.getElementById('impl-item-' + i.id);
                        return el && el.classList.contains('done');
                    }).length;
                    const lvlTotal = mod.items.length;
                    const lvlPct = Math.round(lvlDone / lvlTotal * 100);
                    const lvlColor = lvlPct === 100 ? '#4ADE80' : lvlPct >= 50 ? '#FBBF24' : '#FF4533';
                    const countEl = document.getElementById('impl-count-' + idx);
                    const barEl = document.getElementById('impl-bar-' + idx);
                    const pctEl = document.getElementById('impl-pct-' + idx);
                    if (countEl) countEl.textContent = lvlDone + '/' + lvlTotal;
                    if (barEl) { barEl.style.width = lvlPct + '%'; barEl.style.background = lvlColor; }
                    if (pctEl) { pctEl.textContent = lvlPct + '%'; pctEl.style.color = lvlColor; }
                });
                // Update overall banner
                const totalDone = allItems.filter(i => { const el = document.getElementById('impl-item-' + i.id); return el && el.classList.contains('done'); }).length;
                const totalAll = allItems.length;
                const overallPct = Math.round(totalDone / totalAll * 100);
                const bannerColor = overallPct === 100 ? '#4ADE80' : overallPct >= 50 ? '#FBBF24' : '#FF4533';
                const bannerPct = document.getElementById('implBannerPct');
                const bannerFill = document.getElementById('implBannerFill');
                const bannerSteps = document.getElementById('implBannerSteps');
                if (bannerPct) { bannerPct.textContent = overallPct + '%'; bannerPct.style.color = bannerColor; }
                if (bannerFill) { bannerFill.style.width = overallPct + '%'; bannerFill.style.background = bannerColor; }
                if (bannerSteps) bannerSteps.textContent = totalDone + ' of ' + totalAll + ' tasks completed';
            } catch (err) { console.error('Error updating implementation:', err); }
        };

        // ── PROGRESS ──
        let progressAllEntries = {};
        let progressViews = { revenue: 'month', rates: 'month', views: 'month', followers: 'month' };

        const buildChartData = (viewKey) => {
            if (viewKey === 'month') {
                // Last 8 weeks
                const result = [];
                for (let i = 7; i >= 0; i--) {
                    const d = new Date(); d.setDate(d.getDate() - i * 7);
                    const s = new Date(d.getFullYear(), 0, 1);
                    const week = Math.ceil(((d - s) / 86400000 + s.getDay() + 1) / 7);
                    const wk = `${d.getFullYear()}_W${String(week).padStart(2,'0')}`;
                    const monday = new Date(d); monday.setDate(d.getDate() - d.getDay() + 1);
                    const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
                    const fmt = dt => dt.toLocaleDateString('en-GB', { day:'numeric', month:'short' });
                    result.push({ label: `${fmt(monday)} - ${fmt(sunday)}`, ...getWeeklyTotals(progressAllEntries[wk], wk), ...(progressAllEntries[wk]||{}) });
                }
                return result;
            } else {
                // Last 12 calendar months — aggregate weekly entries by month
                const months = {};
                Object.entries(progressAllEntries).forEach(([wk, e]) => {
                    // Approximate month from week number
                    const year = parseInt(wk.split('_')[0]);
                    const weekNum = parseInt(wk.split('_W')[1]);
                    const d = new Date(year, 0, 1 + (weekNum - 1) * 7);
                    const monthKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
                    if (!months[monthKey]) months[monthKey] = { label: d.toLocaleDateString('en-GB',{month:'short',year:'2-digit'}), revenue:0,expenses:0,appointmentsAvailable:0,appointmentsFilled:0,rebookings:0,noShows:0,instagramViews:0,tiktokViews:0,instagramFollowers:0,tiktokFollowers:0 };
                    const m = months[monthKey];
                    const t = getWeeklyTotals(e, wk);
                    m.revenue += t.revenue;
                    m.expenses += t.expenses;
                    m.appointmentsAvailable += t.appointmentsAvailable;
                    m.appointmentsFilled += t.appointmentsFilled;
                    m.rebookings += t.rebookings;
                    m.noShows += t.noShows;
                    m.instagramViews += parseFloat(e.instagramViews)||0;
                    m.tiktokViews += parseFloat(e.tiktokViews)||0;
                    m.instagramFollowers += parseFloat(e.instagramFollowers)||0;
                    m.tiktokFollowers += parseFloat(e.tiktokFollowers)||0;
                });
                const sorted = Object.entries(months).sort(([a],[b]) => a.localeCompare(b));
                return sorted.slice(-12).map(([, v]) => v);
            }
        };

        const drawChart = (chartId, viewKey) => {
            const canvasMap = { revenue:'chartRevenue', rates:'chartRates', views:'chartViews', followers:'chartFollowers' };
            const canvas = document.getElementById(canvasMap[chartId]);
            if (!canvas) return;
            const existing = Chart.getChart(canvas);
            if (existing) existing.destroy();
            const data = buildChartData(viewKey);
            const labels = data.map(w => w.label);
            const _lt = isLightMode();
            const _tickClr = _lt ? 'rgba(0,0,0,0.4)' : 'rgba(255,255,255,0.35)';
            const _gridClr = _lt ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.04)';
            const _tipBg = _lt ? 'rgba(0,0,0,0.8)' : 'rgba(0,0,0,0.85)';
            const _tipBdr = _lt ? 'rgba(0,0,0,0.12)' : 'rgba(255,255,255,0.08)';
            const baseOpts = {
                responsive: true, animation: { duration: 600, easing: 'easeOutQuart' },
                plugins: { legend: { display: false }, tooltip: { backgroundColor: _tipBg, titleFont: { size: 12, weight: '700', family: "'Helvetica Neue'" }, bodyFont: { size: 11, family: "'Helvetica Neue'" }, titleColor: '#fff', bodyColor: '#fff', padding: 10, cornerRadius: 8, borderColor: _tipBdr, borderWidth: 1, callbacks: {} } },
                scales: {
                    x: { grid: { display: false }, border: { display: false }, ticks: { font: { size: 10, weight: '600', family: "'Helvetica Neue'" }, color: _tickClr, maxRotation: 0 } },
                    y: { grid: { color: _gridClr, lineWidth: 1 }, border: { display: false }, ticks: { font: { size: 10, family: "'Helvetica Neue'" }, color: _tickClr }, beginAtZero: true }
                }
            };
            // Gradient plugin for ALL bar charts
            const gradientBarPlugin = {
                id: 'gradientBar',
                beforeDatasetsDraw(chart) {
                    if (chart.config.type !== 'bar') return;
                    const { ctx, chartArea } = chart;
                    if (!chartArea) return;
                    const { top, bottom } = chartArea;
                    chart.data.datasets.forEach((ds, dsi) => {
                        const meta = chart.getDatasetMeta(dsi);
                        meta.data.forEach((bar, i) => {
                            const baseColor = ds._gradientColors ? (ds._gradientColors[i] || ds._gradientColors[0]) : (Array.isArray(ds.backgroundColor) ? ds.backgroundColor[i] : ds.backgroundColor);
                            if (!baseColor || typeof baseColor !== 'string') return;
                            const grad = ctx.createLinearGradient(0, top, 0, bottom);
                            const fadeColor = baseColor.length === 9 ? baseColor.slice(0,7) + '08' : baseColor.length === 7 ? baseColor + '08' : 'rgba(0,0,0,0.02)';
                            grad.addColorStop(0, baseColor);
                            grad.addColorStop(0.7, baseColor.length >= 7 ? baseColor.slice(0,7) + '40' : baseColor);
                            grad.addColorStop(1, fadeColor);
                            bar.options.backgroundColor = grad;
                        });
                    });
                }
            };
            Chart.register(gradientBarPlugin);
            const barDs = (d, color) => [{ data:d, backgroundColor: d.map((v,i)=>i===d.length-1?color:color+'66'), _gradientColors: d.map((v,i)=>i===d.length-1?color:color+'66'), borderRadius:6, borderSkipped:false, borderWidth: 0, hoverBackgroundColor: color }];
            if (chartId === 'revenue') {
                new Chart(canvas, { type:'bar', data:{ labels, datasets: barDs(data.map(w=>w.revenue||0),ACCENT) }, options:{ ...baseOpts, plugins:{ ...baseOpts.plugins, tooltip:{ callbacks:{ label: ctx=>' '+currencySymbol()+ctx.raw.toLocaleString(getCurrency().locale) } } } } });

                    { label:'Rebook %', data: data.map(w=>w.appointmentsFilled>0?Math.round(w.rebookings/w.appointmentsFilled*100):0), backgroundColor:'#4ADE8099', borderRadius:4 }
                ]}, options:{ ...baseOpts, plugins:{ legend:{ display:true, position:'top', labels:{ font:{size:11,weight:'700'}, color: _lt?'rgba(0,0,0,0.6)':'rgba(255,255,255,0.65)', boxWidth:12 } }, tooltip:{ callbacks:{ label: ctx=>' '+ctx.dataset.label+': '+ctx.raw+'%' } } }, scales:{ ...baseOpts.scales, y:{ ...baseOpts.scales.y, max:100 } } } });
            } else if (chartId === 'views') {
                new Chart(canvas, { type:'bar', data:{ labels, datasets: barDs(data.map(w=>(w.instagramViews||0)+(w.tiktokViews||0)),'#6366F1') }, options:{ ...baseOpts, plugins:{ ...baseOpts.plugins, tooltip:{ callbacks:{ label: ctx=>' '+ctx.raw.toLocaleString('en-GB')+' views' } } } } });

                db.ref(`portal/entries/${currentUser.uid}`).once('value'),
